highscore:pointsGame('highscore','High Score','Points','Le meilleur total en quelques volées',3,[1,3,5,7],
  'Un défi court : chaque joueur tente le plus gros total possible sur quelques volées seulement. Le meilleur total gagne. Idéal pour départager rapidement.'),

/* ---------------- Shanghai ---------------- */
shanghai:{id:'shanghai',name:'Shanghai',short:'Shanghai',group:'Points',sub:'Un numéro par manche',
  rules:g=>`À chaque manche, un seul numéro compte : 1 à la première manche, 2 à la deuxième, et ainsi de suite. On marque la valeur touchée (simple, double ou triple). ${g.opts.shanghai?'Toucher simple, double et triple du numéro dans la même volée fait un « Shanghai » : victoire immédiate !':'Le « Shanghai » (simple + double + triple) ne donne pas la victoire immédiate dans cette variante.'} Sinon, le plus grand total gagne.`,
  opts:[{k:'rounds',label:'Nombre de manches',vals:[[7,'7'],[10,'10'],[20,'20']],def:7},
        {k:'shanghai',label:'Shanghai = victoire immédiate',vals:[[true,'Oui'],[false,'Non']],def:true}],
  title:g=>`Shanghai<small>${g.opts.rounds} manches</small>`,
  run(g){const R=g.opts.rounds;return runTurns(g,{
    init:g=>({tot:g.players.map(()=>0)}),
    dart(S,p,d,cur){const tg=cur.round,hit=d.seg===tg?d.mult:0,pts=hit*tg;S.tot[p]+=pts;
      if(hit){cur.m=cur.m||{};cur.m[hit]=1}
      if(g.opts.shanghai&&cur.m&&cur.m[1]&&cur.m[2]&&cur.m[3]){cur.shanghai=true;cur.win=true;S.over=true;S.winner=p;
        S.ranking=[p,...g.players.map((_,i)=>i).filter(i=>i!==p).sort((a,b)=>S.tot[b]-S.tot[a])]}
      return {pts,hit}},
    endTurn(S,p,t){t.total=sumPts(t);t.k=t.darts.reduce((a,x)=>a+x.hit,0)},
    check(S,np){if(S.round[np]>=R)rankBy(S,S.tot)}})},
  big:(S,p)=>S.tot[p],chip:(S,i)=>S.tot[i],chipSub:(S,i)=>`manche ${Math.min(S.round[i]+1,99)}`,
  target:(S,p)=>S.over?null:S.round[p]+1,
  hint:(S,p,g)=>{const tg=S.round[p]+1;return `Cible : <b>${tg}</b> · manche ${tg} sur ${g.opts.rounds}`},
  curTotal:cd=>cd.reduce((a,d)=>a+d.pts,0),fmt:t=>t.shanghai?'SHANGHAI':String(t.total),unit:()=>'',
  cat:t=>t.shanghai?'checkout':hitsCat(t,t.k),say:t=>t.shanghai?'Shanghai ! ':(t.total?t.total+' ! ':''),
  resume:(S,p)=>`score ${S.tot[p]}`,
  statCols:['Total','Touches','Meilleure manche','Fléch.'],
  statRows(S,g){return g.players.map((_,i)=>{const ts=S.turns.filter(t=>t.p===i);return [S.tot[i],ts.reduce((a,t)=>a+t.darts.filter(d=>d.hit).length,0),ts.reduce((a,t)=>Math.max(a,t.total),0),ts.reduce((a,t)=>a+t.darts.length,0)]})},
  statNote:'Touches = fléchettes tombées dans le numéro de la manche.',
  endLine(S){const t=S.turns[S.turns.length-1];return t&&t.shanghai?`Shanghai à la manche ${t.round} !`:'Fin des manches : le plus grand total l\'emporte.'}},

/* ---------------- Tour de l'horloge ---------------- */
atc:{id:'atc',name:'Tour de l\'horloge',short:'Horloge',group:'Entraînement',sub:'De 1 à 20 dans l\'ordre',
  rules:g=>`Touchez les numéros dans l'ordre, de 1 à 20${g.opts.bull?', puis le Bull pour terminer':''}. Tant que le numéro n'est pas touché, on reste dessus. ${g.opts.mult?'Un double fait avancer de deux numéros, un triple de trois.':'Simple, double ou triple : chaque touche fait avancer d\'un numéro.'} Le premier à terminer gagne.`,
  opts:[{k:'bull',label:'Finir par le Bull',vals:[[true,'Oui'],[false,'Non']],def:true},
        {k:'mult',label:'Doubles et triples font sauter des numéros',vals:[[false,'Non'],[true,'Oui']],def:false}],
  title:g=>`Tour de l'horloge<small>${g.opts.bull?'1 → 20 → Bull':'1 → 20'}</small>`,
  run(g){const last=g.opts.bull?21:20;return runTurns(g,{
    init:g=>({pos:g.players.map(()=>1),last}),
    dart(S,p,d){const pos=S.pos[p],tg=pos<=20?pos:25;let hit=0;
      if(d.seg===tg&&d.mult){hit=1;S.pos[p]=tg===25?22:Math.min(pos+(g.opts.mult?d.mult:1),21)}
      if(S.pos[p]>last){S.over=true;S.winner=p;S.ranking=[p,...g.players.map((_,i)=>i).filter(i=>i!==p).sort((a,b)=>S.pos[b]-S.pos[a])]}
      return {hit}},
    endTurn(S,p,t){t.total=t.darts.reduce((a,x)=>a+x.hit,0);if(S.winner===p)t.win=true}})},
  big:(S,p)=>atcLabel(S,p,true),chip:(S,i)=>atcLabel(S,i,false),
  chipSub:(S,i)=>`${Math.min(S.pos[i],S.last+1)-1} validés sur ${S.last}`,
  target:(S,p)=>S.over||S.pos[p]>S.last?null:S.pos[p]>20?25:S.pos[p],
  hint:(S,p)=>S.pos[p]>S.last?'Terminé !':`Visez : <b>${S.pos[p]>20?'le Bull':S.pos[p]}</b>`,
  curTotal:cd=>cd.reduce((a,d)=>a+d.hit,0),fmt:t=>plural(t.total,'touche'),unit:()=>'',
  cat:t=>t.win?'checkout':t.total===3?'huge':t.total===2?'big':t.total===1?'mid':'zero',
  say:()=>'',resume:(S,p)=>`vise ${S.pos[p]>20?'le Bull':S.pos[p]}`,
  statCols:['Atteint','Touches','Réussite','Fléch.'],
  statRows(S,g){return g.players.map((_,i)=>{const ts=S.turns.filter(t=>t.p===i),d=ts.reduce((a,t)=>a+t.darts.length,0),h=ts.reduce((a,t)=>a+t.total,0);const v=S.pos[i];
    return [v>S.last?'Terminé':v>20?'Bull':v,h,d?Math.round(h/d*100)+' %':'–',d]})},
  statNote:'Réussite = touches ÷ fléchettes lancées.',
  endLine(S,g){const ts=S.turns.filter(t=>t.p===S.winner);return `Terminé en ${ts.reduce((a,t)=>a+t.darts.length,0)} fléchettes`}},
};

function pointsGame(id,name,group,sub,def,vals,rules){return {id,name,short:name,group,sub,rules:()=>rules,
  opts:[{k:'rounds',label:'Nombre de volées',vals:vals.map(v=>[v,String(v)]),def}],
  title:g=>`${name}<small>${plural(g.opts.rounds,'volée')}</small>`,
  run(g){const R=g.opts.rounds;return runTurns(g,{
    init:g=>({tot:g.players.map(()=>0)}),
    dart(S,p,d){const pts=dScore(d);S.tot[p]+=pts;return {pts}},
    endTurn(S,p,t){t.total=sumPts(t)},
    check(S,np){if(S.round[np]>=R)rankBy(S,S.tot)}})},
  big:(S,p)=>S.tot[p],chip:(S,i)=>S.tot[i],
  chipSub:(S,i)=>{const ts=S.turns.filter(t=>t.p===i);return ts.length?`moy. ${(S.tot[i]/ts.length).toFixed(1)}`:'moy. –'},
  hint:(S,p,g)=>`Volée <b>${Math.min(S.round[p]+1,g.opts.rounds)}</b> sur ${g.opts.rounds}`,
  curTotal:cd=>cd.reduce((a,d)=>a+d.pts,0),fmt:t=>String(t.total),unit:()=>'',
  cat:(t,S)=>pointsCat(t,S),say:t=>t.total===180?'':(t.total===0?'Zéro. ':t.total+' ! '),
  resume:(S,p)=>`score ${S.tot[p]}`,
  statCols:['Total','Moy. volée','Meilleure','100+','180','Fléch.'],
  statRows(S,g){return g.players.map((_,i)=>{const ts=S.turns.filter(t=>t.p===i);return [S.tot[i],ts.length?(S.tot[i]/ts.length).toFixed(1):'–',ts.reduce((a,t)=>Math.max(a,t.total),0),ts.filter(t=>t.total>=100).length,ts.filter(t=>t.total===180).length,ts.reduce((a,t)=>a+t.darts.length,0)]})},
  statNote:'Moyenne par volée = total ÷ nombre de volées jouées.',
  endLine:()=>'Fin des volées : le plus grand total l\'emporte.'}}

function cricketGame(cut){
  const id=cut?'cutthroat':'cricket',name=cut?'Cut-Throat Cricket':'Cricket';
  return {id,name,short:cut?'Cut-Throat':'Cricket',group:'Cricket',sub:cut?'Les points vont aux adversaires':'Fermer 15 à 20 et le Bull',
  rules:g=>cut
    ?`Même objectif que le Cricket : fermer 15, 16, 17, 18, 19, 20 et le Bull en les touchant trois fois (un double compte deux fois, un triple trois fois). Mais une fois votre numéro fermé, les points en trop sont donnés aux adversaires qui ne l'ont pas encore fermé. Le plus petit score gagne quand tous ses numéros sont fermés.`
    :`Il faut fermer 15, 16, 17, 18, 19, 20 et le Bull en les touchant trois fois chacun (un double compte deux fois, un triple trois fois). Une fois un numéro fermé, on marque des points dessus tant qu'un adversaire ne l'a pas fermé. Gagne celui qui a tout fermé avec au moins autant de points que les autres.`,
  opts:[{k:'rounds',label:'Limite de manches',vals:[[15,'15'],[20,'20'],[25,'25'],[0,'Aucune']],def:20,help:v=>v?`Après ${v} manches, ${cut?'le plus petit':'le plus grand'} score gagne.`:'La partie continue jusqu\'à la victoire.'}],
  title:g=>`${cut?'Cut-Throat':'Cricket'}<small>${g.opts.rounds?g.opts.rounds+' manches':'sans limite'}</small>`,
  run(g){const R=g.opts.rounds,n=g.players.length;
    const closedAll=(S,i)=>CR_NUMS.every(k=>S.marks[i][k]>=3);
    const marksTot=(S,i)=>CR_NUMS.reduce((a,k)=>a+S.marks[i][k],0);
    const checkWin=(S)=>{for(let i=0;i<n;i++){if(!closedAll(S,i))continue;const o=S.pts.filter((_,j)=>j!==i);
      if(cut?S.pts[i]<=Math.min(...o,Infinity):S.pts[i]>=Math.max(...o,-Infinity)){S.over=true;S.winner=i;
        S.ranking=[i,...S.pts.map((_,j)=>j).filter(j=>j!==i).sort((a,b)=>cut?S.pts[a]-S.pts[b]:S.pts[b]-S.pts[a])];return true}}return false};
    return runTurns(g,{
      init:g=>({marks:g.players.map(()=>Object.fromEntries(CR_NUMS.map(k=>[k,0]))),pts:g.players.map(()=>0)}),
      dart(S,p,d){if(!CR_NUMS.includes(d.seg)||!d.mult)return {mk:0,pts:0};
        const k=d.seg,m=S.marks[p],before=m[k],used=Math.min(d.mult,Math.max(0,3-before));m[k]=Math.min(3,before+d.mult);
        const extra=d.mult-used;let pts=0,scored=0;
        if(extra>0){const val=(k===25?25:k)*extra,open=S.pts.map((_,j)=>j).filter(j=>j!==p&&S.marks[j][k]<3);
          if(open.length){scored=extra;if(cut){open.forEach(j=>S.pts[j]+=val)}else S.pts[p]+=val;pts=val}}
        checkWin(S);return {mk:used+scored,pts}},
      endTurn(S,p,t){t.total=t.darts.reduce((a,x)=>a+x.mk,0);t.pts=sumPts(t);if(S.winner===p)t.win=true},
      check(S,np){if(R&&S.round[np]>=R)rankBy(S,S.pts,cut,i=>marksTot(S,i))}})},
  big:(S,p)=>S.pts[p],chip:(S,i)=>S.pts[i],
  chipSub:(S,i)=>{const d=S.turns.filter(t=>t.p===i).reduce((a,t)=>a+t.darts.length,0),m=S.turns.filter(t=>t.p===i).reduce((a,t)=>a+t.total,0);return d?`${(m/d*3).toFixed(2)} marques/volée`:'–'},
  hint:(S,p)=>`<div class="crow">${CR_NUMS.map(k=>`<span class="cm m${S.marks[p][k]}${CR_NUMS.every(j=>j===k)?'':''}${S.marks.some((mm,j)=>j!==p&&mm[k]<3)?'':' dead'}"><i>${k===25?'B':k}</i>${markIcon(S.marks[p][k])}</span>`).join('')}</div>`,
  table(S,g){return `<div class="ctab-wrap"><table class="ctab"><thead><tr><th></th>${g.players.map(pl=>`<th>${esc(pl.name)}</th>`).join('')}</tr></thead><tbody>${CR_NUMS.map(k=>`<tr><th>${k===25?'Bull':k}</th>${g.players.map((_,i)=>`<td class="m${S.marks[i][k]}">${markIcon(S.marks[i][k])}</td>`).join('')}</tr>`).join('')}<tr class="pts"><th>Points</th>${g.players.map((_,i)=>`<td>${S.pts[i]}</td>`).join('')}</tr></tbody></table></div>`},
  curTotal:cd=>cd.reduce((a,d)=>a+d.mk,0),fmt:t=>plural(t.total,'marque'),unit:()=>'',
  cat:t=>hitsCat(t,t.total),say:t=>t.total>=2&&!t.win?`${t.total} marques ! `:'',
  resume:(S,p)=>`${S.pts[p]} points`,
  statCols:['Points','Fermés','Marques','Marques/volée','Fléch.'],
  statRows(S,g){return g.players.map((_,i)=>{const ts=S.turns.filter(t=>t.p===i),d=ts.reduce((a,t)=>a+t.darts.length,0),m=ts.reduce((a,t)=>a+t.total,0);
    return [S.pts[i],CR_NUMS.filter(k=>S.marks[i][k]>=3).length+' / 7',m,d?(m/d*3).toFixed(2):'–',d]})},
  statNote:'Marques/volée = marques comptées ÷ fléchettes lancées × 3 (une marque = une touche utile sur 15 à 20 ou le Bull ; double = 2, triple = 3).',
  endLine(S){return S.ranking&&S.turns.length&&S.turns[S.turns.length-1].win?'Tous les numéros fermés !':'Limite de manches atteinte.'}};
}
function atcLabel(S,i,big){const v=S.pos[i];return v>S.last?'✓':v>20?(big?'Bull':'B'):v}
function markIcon(m){
  if(m>=3)return '<svg viewBox="0 0 20 20" aria-label="fermé"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5.5 14.5l9-9M5.5 5.5l9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  if(m===2)return '<svg viewBox="0 0 20 20" aria-label="2 marques"><path d="M5 15L15 5M5 5l10 10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
  if(m===1)return '<svg viewBox="0 0 20 20" aria-label="1 marque"><path d="M6 15L14 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
  return '<svg viewBox="0 0 20 20" aria-label="aucune marque"></svg>';
}

/* =========================================================
   Jeux supplémentaires
   ========================================================= */
function shuffleSeeded(arr,seed){const R=rng(seed);const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function seedOf(g){let h=0;for(const c of g.id||'arrow')h=Math.imul(h^c.charCodeAt(0),16777619);return h}
const others=(g,p)=>g.players.map((_,i)=>i).filter(i=>i!==p);
/* Tentative de finition (121, finitions au hasard) : double obligatoire pour finir */
function finishDart(cur,d){const pts=dScore(d),nr=cur.rem-pts;
  if(nr<0||nr===1||(nr===0&&d.mult!==2)){cur.bust=true;cur.end=true;return {pts:0}}
  cur.rem=nr;if(nr===0){cur.ok=true;cur.end=true}return {pts}}

/* Cible par manche (Baseball, Golf) */
GAMES.baseball={id:'baseball',name:'Baseball',short:'Baseball',group:'Points',sub:'9 manches, un numéro par manche',
  rules:g=>`Neuf manches : à la manche 1 on vise le 1, à la manche 2 le 2, et ainsi de suite. Seul le numéro de la manche rapporte : simple = 1 point, double = 2, triple = 3. ${g.opts.bull?'Le Bull vaut un « home run » : 4 points à chaque manche. ':''}Le plus grand total après ${g.opts.rounds} manches gagne.`,
  opts:[{k:'rounds',label:'Nombre de manches',vals:[[9,'9'],[5,'5'],[20,'20']],def:9},{k:'bull',label:'Bull = home run (4 points)',vals:[[false,'Non'],[true,'Oui']],def:false}],
  title:g=>`Baseball<small>${g.opts.rounds} manches</small>`,
  run(g){const R=g.opts.rounds;return runTurns(g,{
    init:g=>({tot:g.players.map(()=>0)}),
    dart(S,p,d,cur){const tg=cur.round;let pts=0;if(d.seg===tg&&d.mult)pts=d.mult;else if(g.opts.bull&&d.seg===25)pts=4;S.tot[p]+=pts;return {pts,hit:pts?1:0}},
    endTurn(S,p,t){t.total=sumPts(t)},check(S,np){if(S.round[np]>=R)rankBy(S,S.tot)}})},
  big:(S,p)=>S.tot[p],chip:(S,i)=>S.tot[i],chipSub:(S,i)=>`manche ${S.round[i]+1}`,
  target:(S,p)=>S.over?null:S.round[p]+1,hint:(S,p,g)=>`Manche ${S.round[p]+1} sur ${g.opts.rounds} · visez le <b>${S.round[p]+1}</b>`,
  curTotal:cd=>cd.reduce((a,d)=>a+d.pts,0),fmt:t=>plural(t.total,'point'),
  cat:t=>hitsCat(t,t.total),say:t=>t.total>=2?`${t.total} points ! `:'',resume:(S,p)=>`${S.tot[p]} points`,
  statCols:['Points','Meilleure manche','Touches','Fléch.'],
  statRows(S,g){return g.players.map((_,i)=>{const ts=S.turns.filter(t=>t.p===i);return [S.tot[i],ts.reduce((a,t)=>Math.max(a,t.total),0),ts.reduce((a,t)=>a+t.darts.filter(d=>d.hit).length,0),ts.reduce((a,t)=>a+t.darts.length,0)]})},
  statNote:'Simple = 1 point, double = 2, triple = 3 sur le numéro de la manche.',endLine:()=>'Fin des manches : le plus grand total l\'emporte.'};

GAMES.golf={id:'golf',name:'Golf',short:'Golf',group:'Points',sub:'Le moins de coups possible',
  rules:g=>`Chaque trou correspond à un numéro : trou 1 = le 1, trou 2 = le 2… On a trois fléchettes par trou. Le score du trou est le numéro de la fléchette qui touche le numéro visé (1, 2 ou 3 coups). Si aucune ne touche, le trou compte ${g.opts.pen} coups. Le plus petit total après ${g.opts.rounds} trous gagne.`,
  opts:[{k:'rounds',label:'Nombre de trous',vals:[[9,'9'],[18,'18']],def:9},{k:'pen',label:'Coups si le trou est manqué',vals:[[4,'4'],[5,'5']],def:5}],
  title:g=>`Golf<small>${g.opts.rounds} trous</small>`,
  run(g){const R=g.opts.rounds;return runTurns(g,{
    init:g=>({tot:g.players.map(()=>0)}),
    dart(S,p,d,cur){const tg=((cur.round-1)%20)+1;if(d.seg===tg&&d.mult){cur.hitAt=cur.darts.length+1;cur.end=true;return {hit:1}}return {hit:0}},
    endTurn(S,p,t){t.total=t.hitAt||g.opts.pen;S.tot[p]+=t.total},check(S,np){if(S.round[np]>=R)rankBy(S,S.tot,true)}})},
  big:(S,p)=>S.tot[p],chip:(S,i)=>S.tot[i],chipSub:(S,i)=>`trou ${S.round[i]+1}`,
  target:(S,p)=>S.over?null:((S.round[p])%20)+1,hint:(S,p,g)=>`Trou ${S.round[p]+1} sur ${g.opts.rounds} · visez le <b>${(S.round[p]%20)+1}</b>`,
  curTotal:cd=>cd.length,fmt:t=>t.hitAt?plural(t.total,'coup'):`raté (${t.total})`,
  cat:t=>t.hitAt===1?'huge':t.hitAt===2?'big':t.hitAt===3?'mid':'zero',say:t=>t.hitAt===1?'Trou en un ! ':'',resume:(S,p)=>`${S.tot[p]} coups`,
  statCols:['Coups','Trous en un','Trous manqués','Fléch.'],
  statRows(S,g){return g.players.map((_,i)=>{const ts=S.turns.filter(t=>t.p===i);return [S.tot[i],ts.filter(t=>t.hitAt===1).length,ts.filter(t=>!t.hitAt).length,ts.reduce((a,t)=>a+t.darts.length,0)]})},
  statNote:'Score d\'un trou = rang de la fléchette qui touche (1, 2 ou 3), ou la pénalité si aucune ne touche. Le plus petit total gagne.',endLine:()=>'Le plus petit nombre de coups l\'emporte.'};

GAMES.killer={id:'killer',name:'Killer',short:'Killer',group:'Points',sub:'Devenir tueur et éliminer',
  rules:g=>`Chaque joueur reçoit un numéro au hasard (affiché sur son nom) et ${plural(g.opts.lives,'vie')}. Touchez d'abord ${g.opts.become==='double'?'le double':'n\'importe quelle zone'} de votre numéro pour devenir « tueur ». Ensuite, chaque double d'un adversaire lui retire une vie. ${g.opts.self?'Attention : un tueur qui touche son propre double perd une vie. ':''}Un joueur sans vie est éliminé ; le dernier en jeu gagne.`,
  opts:[{k:'lives',label:'Nombre de vies',vals:[[3,'3'],[5,'5'],[7,'7']],def:3},
        {k:'become',label:'Pour devenir tueur',vals:[['double','Double de son numéro'],['any','Son numéro']],def:'double'},
        {k:'self',label:'Toucher son propre double fait perdre une vie',vals:[[true,'Oui'],[false,'Non']],def:true}],
  setup(g){g.assign=shuffleSeeded([...Array(20)].map((_,i)=>i+1),seedOf(g)).slice(0,g.players.length);while(g.assign.length<g.players.length)g.assign.push(g.assign[g.assign.length%20])},
  title:g=>`Killer<small>${plural(g.opts.lives,'vie')}</small>`,
  run(g){const n=g.players.length;const num=g.assign||g.players.map((_,i)=>i+1);return runTurns(g,{
    init:g=>({lives:g.players.map(()=>g.opts.lives),killer:g.players.map(()=>false),num,out:[]}),
    skip:(S,p)=>S.lives[p]<=0,
    dart(S,p,d,cur){let kills=0;cur.kills=cur.kills||0;
      if(!d.mult||d.seg===25)return {k:0};
      if(!S.killer[p]){if(d.seg===S.num[p]&&(g.opts.become==='any'||d.mult===2)){S.killer[p]=true;cur.made=true;return {k:0,hit:1}}return {k:0}}
      if(d.mult!==2)return {k:0};
      for(let j=0;j<n;j++){if(S.num[j]!==d.seg||S.lives[j]<=0)continue;
        if(j===p){if(!g.opts.self)continue;S.lives[p]--;cur.self=true;if(S.lives[p]<=0){S.out.push(p);cur.end=true}}
        else{S.lives[j]--;kills++;if(S.lives[j]<=0)S.out.push(j)}}
      cur.kills+=kills;
      const alive=S.lives.map((l,i)=>l>0?i:-1).filter(i=>i>=0);
      if(alive.length<=1){S.over=true;S.winner=alive.length?alive[0]:null;S.ranking=[...alive,...S.out.slice().reverse()];if(S.winner===p)cur.win=true}
      return {k:kills,hit:kills?1:0}},
    endTurn(S,p,t){t.total=t.kills||0}})},
  big:(S,p)=>`${Math.max(0,S.lives[p])}<span class="heart">♥\uFE0E</span>`,chip:(S,i)=>S.lives[i]>0?`${S.lives[i]}<span class="heart">♥\uFE0E</span>`:'✕',
  chipSub:(S,i)=>`n° ${S.num[i]}${S.killer[i]?' · tueur':''}`,
  target:(S,p)=>S.over||S.killer[p]?null:S.num[p],
  hint:(S,p,g)=>{if(!S.killer[p])return `Votre numéro : <b>${S.num[p]}</b> · touchez ${g.opts.become==='double'?'son double':'ce numéro'} pour devenir tueur`;
    const t=others(g,p).filter(j=>S.lives[j]>0).map(j=>`<b>D${S.num[j]}</b> ${esc(g.players[j].name)}`);return `Tueur ! Visez : ${t.join(' · ')}`},
  curTotal:cd=>cd.reduce((a,d)=>a+(d.k||0),0),fmt:t=>t.made&&!t.total?'Tueur !':t.self&&!t.total?'Touché soi-même':plural(t.total,'vie')+' prise'+(t.total>1?'s':''),
  cat:t=>t.win?'checkout':t.total>=2?'huge':t.total===1||t.made?'big':t.self?'low':'zero',say:t=>t.made?'Nouveau tueur ! ':'',
  resume:(S,p)=>`${S.lives[p]} vies`,
  statCols:['Numéro','Vies','Vies prises','Fléch.'],
  statRows(S,g){return g.players.map((_,i)=>{const ts=S.turns.filter(t=>t.p===i);return [S.num[i],Math.max(0,S.lives[i]),ts.reduce((a,t)=>a+t.total,0),ts.reduce((a,t)=>a+t.darts.length,0)]})},
  statNote:'Le classement suit l\'ordre d\'élimination.',endLine:()=>'Dernier joueur encore en vie.'};

GAMES.bobs27={id:'bobs27',name:'Bob\'s 27',short:'Bob\'s 27',group:'Entraînement',sub:'Les doubles, de 1 à 20 puis Bull',
  rules:g=>`Exercice aux doubles. On commence avec 27 points et on vise le double 1, puis le double 2, jusqu'au double 20 et au Bull. Chaque double touché ajoute sa valeur (D5 = 10 points). Si aucune des trois fléchettes ne touche, on retire la valeur du double. ${g.opts.stop?'Sous zéro, le joueur est éliminé.':'On continue même sous zéro.'}`,
  opts:[{k:'stop',label:'Éliminé sous zéro',vals:[[true,'Oui'],[false,'Non']],def:true}],
  title:()=>'Bob\'s 27<small>D1 → Bull</small>',
  run(g){const n=g.players.length;return runTurns(g,{
    init:g=>({sc:g.players.map(()=>27),dead:g.players.map(()=>false)}),
    skip:(S,p)=>S.dead[p]||S.round[p]>=21,
    dart(S,p,d,cur){const tg=cur.round<=20?cur.round:25;const hit=d.seg===tg&&d.mult===2;return {hit:hit?1:0,pts:hit?tg*2:0}},
    endTurn(S,p,t){const tg=t.round<=20?t.round:25,h=t.darts.reduce((a,x)=>a+x.hit,0);t.k=h;t.total=h?h*tg*2:-tg*2;S.sc[p]+=t.total;if(g.opts.stop&&S.sc[p]<0)S.dead[p]=true},
    check(S,np){const live=S.sc.map((_,i)=>i).filter(i=>!S.dead[i]&&S.round[i]<21);if(!live.length)rankBy(S,S.sc,false,i=>S.round[i])}})},
  big:(S,p)=>S.sc[p],chip:(S,i)=>S.dead[i]?'✕':S.sc[i],chipSub:(S,i)=>S.dead[i]?'éliminé':S.round[i]>=21?'terminé':`vise D${S.round[i]<20?S.round[i]+1:'Bull'}`,
  target:(S,p)=>S.over?null:(S.round[p]<20?S.round[p]+1:25),
  hint:(S,p)=>{const r=S.round[p]+1;return r<=20?`Visez le <b>double ${r}</b> (${r*2} points)`:'Visez le <b>Bull</b> (50 points)'},
  curTotal:cd=>cd.reduce((a,d)=>a+d.pts,0),fmt:t=>(t.total>0?'+':'')+t.total,
  cat:t=>t.k>=2?'huge':t.k===1?'big':'zero',say:t=>t.k?`${t.k} double${t.k>1?'s':''} ! `:'',resume:(S,p)=>`${S.sc[p]} points`,
  statCols:['Score','Doubles touchés','Réussite','Atteint'],
  statRows(S,g){return g.players.map((_,i)=>{const ts=S.turns.filter(t=>t.p===i),h=ts.reduce((a,t)=>a+t.k,0),d=ts.reduce((a,t)=>a+t.darts.length,0);return [S.sc[i],h,d?Math.round(h/d*100)+' %':'–',S.dead[i]?`éliminé (D${Math.min(S.round[i],20)})`:S.round[i]>=21?'Bull':'D'+S.round[i]]})},
  statNote:'Réussite = doubles touchés ÷ fléchettes lancées.',endLine:()=>'Le meilleur score l\'emporte.'};

GAMES.c121={id:'c121',name:'121 Challenge',short:'121',group:'Entraînement',sub:'Finir 121 en trois fléchettes',
  rules:g=>`Exercice de finition. On part de 121 et on a trois fléchettes pour tomber exactement à zéro en finissant par un double. Réussi : on passe à ${121+g.opts.step}, puis au suivant. ${g.opts.fail==='back'?'Raté : on revient à 121.':'Raté : on retente le même score.'} Après ${g.opts.rounds} tentatives, le plus haut score atteint gagne.`,
  opts:[{k:'rounds',label:'Nombre de tentatives',vals:[[10,'10'],[20,'20'],[30,'30']],def:10},
        {k:'step',label:'Progression après une réussite',vals:[[1,'+1'],[5,'+5'],[10,'+10']],def:1},
        {k:'fail',label:'Après un échec',vals:[['stay','On retente'],['back','Retour à 121']],def:'stay'}],
  title:g=>`121 Challenge<small>${g.opts.rounds} tentatives</small>`,
  run(g){const R=g.opts.rounds;return runTurns(g,{
    init:g=>({tg:g.players.map(()=>121),best:g.players.map(()=>0),ok:g.players.map(()=>0)}),
    dart(S,p,d,cur){if(cur.rem==null){cur.rem=S.tg[p];cur.start=S.tg[p]}return finishDart(cur,d)},
    endTurn(S,p,t){if(t.ok){S.ok[p]++;S.best[p]=Math.max(S.best[p],S.tg[p]);S.tg[p]=Math.min(170,S.tg[p]+g.opts.step)}else if(g.opts.fail==='back')S.tg[p]=121;t.total=t.ok?t.start:0},
    check(S,np){if(S.round[np]>=R)rankBy(S,S.best,false,i=>S.ok[i])}})},
  big:(S,p)=>S.cur&&S.cur.p===p&&S.cur.rem!=null?S.cur.rem:S.tg[p],chip:(S,i)=>S.tg[i],chipSub:(S,i)=>`${plural(S.ok[i],'réussite')}`,
  hint:(S,p,g,cd)=>{const rem=S.cur&&S.cur.p===p&&S.cur.rem!=null?S.cur.rem:S.tg[p];const sug=suggest(rem,3-cd.length,'double');return `Objectif ${S.tg[p]} · tentative ${S.round[p]+1}/${g.opts.rounds}`+(sug?` · <b>${sug.map(dLabel).join(' · ')}</b>`:'')},
  curTotal:cd=>cd.reduce((a,d)=>a+(d.pts||0),0),fmt:t=>t.ok?`✓ ${t.start}`:t.bust?'bust':'raté',
  cat:t=>t.ok?'checkout':t.bust?'bust':'low',say:()=>'',resume:(S,p)=>`objectif ${S.tg[p]}`,
  statCols:['Meilleur','Réussites','Taux','Fléch.'],
  statRows(S,g){return g.players.map((_,i)=>{const ts=S.turns.filter(t=>t.p===i);return [S.best[i]||'–',S.ok[i],ts.length?Math.round(S.ok[i]/ts.length*100)+' %':'–',ts.reduce((a,t)=>a+t.darts.length,0)]})},
  statNote:'Taux = finitions réussies ÷ tentatives.',endLine:()=>'Le plus haut score fini l\'emporte.'};

function ringTraining(id,name,mult){const lbl=mult===2?'double':'triple';
  return {id,name,short:name,group:'Entraînement',sub:`Viser les ${lbl}s un par un`,
  rules:g=>`Exercice de précision : à chaque volée, on vise le ${lbl} indiqué (${mult===2?'de 1 à 20 puis le Bull':'de 1 à 20'}${g.opts.order==='random'?', dans un ordre tiré au hasard':', dans l\'ordre'}). Chaque ${lbl} touché rapporte 1 point. Le plus grand nombre de touches gagne.`,
  opts:[{k:'order',label:'Ordre',vals:[['seq','Dans l\'ordre'],['random','Au hasard']],def:'seq'}],
  setup(g){const base=[...Array(20)].map((_,i)=>i+1);if(mult===2)base.push(25);g.seq=g.opts.order==='random'?shuffleSeeded(base,seedOf(g)):base},
  title:g=>`${name}<small>${g.seq?g.seq.length:20} cibles</small>`,
  run(g){const seq=g.seq||[...Array(20)].map((_,i)=>i+1),R=seq.length;return runTurns(g,{
    init:g=>({hits:g.players.map(()=>0),seq}),
    dart(S,p,d,cur){const tg=seq[cur.round-1];const hit=d.seg===tg&&d.mult===(tg===25?2:mult)?1:0;S.hits[p]+=hit;return {hit}},
    endTurn(S,p,t){t.total=t.darts.reduce((a,x)=>a+x.hit,0)},check(S,np){if(S.round[np]>=R)rankBy(S,S.hits)}})},
  big:(S,p)=>S.hits[p],chip:(S,i)=>S.hits[i],chipSub:(S,i)=>{const d=S.turns.filter(t=>t.p===i).reduce((a,t)=>a+t.darts.length,0);return d?Math.round(S.hits[i]/d*100)+' % de réussite':'–'},
  target:(S,p)=>S.over?null:S.seq[S.round[p]],
  hint:(S,p)=>{const tg=S.seq[S.round[p]];return `Visez : <b>${tg===25?'le Bull (50)':(mult===2?'D':'T')+tg}</b> · cible ${S.round[p]+1}/${S.seq.length}`},
  curTotal:cd=>cd.reduce((a,d)=>a+d.hit,0),fmt:t=>plural(t.total,'touche'),
  cat:t=>t.total===3?'huge':t.total===2?'big':t.total===1?'mid':'zero',say:()=>'',resume:(S,p)=>`${S.hits[p]} touches`,
  statCols:['Touches','Réussite','Fléch.'],
  statRows(S,g){return g.players.map((_,i)=>{const d=S.turns.filter(t=>t.p===i).reduce((a,t)=>a+t.darts.length,0);return [S.hits[i],d?Math.round(S.hits[i]/d*100)+' %':'–',d]})},
  statNote:`Réussite = ${lbl}s touchés ÷ fléchettes lancées.`,endLine:()=>'Le plus grand nombre de touches l\'emporte.'}}
GAMES.doubles=ringTraining('doubles','Entraînement doubles',2);
GAMES.triples=ringTraining('triples','Entraînement triples',3);

GAMES.rcheck={id:'rcheck',name:'Finitions au hasard',short:'Finitions',group:'Entraînement',sub:'Un score à finir à chaque volée',
  rules:g=>`À chaque volée, un score à finir est tiré au hasard (${{easy:'entre 2 et 60',mid:'entre 61 et 100',hard:'entre 101 et 170'}[g.opts.level]}). On a trois fléchettes pour tomber exactement à zéro, en finissant par un double. Tous les joueurs reçoivent les mêmes scores. Le plus grand nombre de finitions réussies gagne.`,
  opts:[{k:'level',label:'Difficulté',vals:[['easy','Facile'],['mid','Moyen'],['hard','Difficile']],def:'mid'},{k:'rounds',label:'Nombre de finitions',vals:[[10,'10'],[20,'20']],def:10}],
  setup(g){const [a,b]={easy:[2,60],mid:[61,100],hard:[101,170]}[g.opts.level];const bad=[159,162,163,165,166,168,169];const R=rng(seedOf(g));const out=[];
    while(out.length<g.opts.rounds){const v=a+Math.floor(R()*(b-a+1));if(!bad.includes(v))out.push(v)}g.seq=out},
  title:g=>`Finitions au hasard<small>${g.opts.rounds}</small>`,
  run(g){const seq=g.seq||[...Array(g.opts.rounds)].map(()=>40),R=seq.length;return runTurns(g,{
    init:g=>({ok:g.players.map(()=>0),seq}),
    dart(S,p,d,cur){if(cur.rem==null){cur.rem=seq[cur.round-1];cur.start=cur.rem}return finishDart(cur,d)},
    endTurn(S,p,t){if(t.ok)S.ok[p]++;t.total=t.ok?t.start:0},check(S,np){if(S.round[np]>=R)rankBy(S,S.ok)}})},
  big:(S,p)=>S.cur&&S.cur.p===p&&S.cur.rem!=null?S.cur.rem:(S.seq[S.round[p]]??'–'),chip:(S,i)=>`${S.ok[i]}✓`,chipSub:(S,i)=>`finition ${Math.min(S.round[i]+1,S.seq.length)}/${S.seq.length}`,
  hint:(S,p,g,cd)=>{const rem=S.cur&&S.cur.p===p&&S.cur.rem!=null?S.cur.rem:S.seq[S.round[p]];const sug=suggest(rem,3-cd.length,'double');return sug?`Finition : <b>${sug.map(dLabel).join(' · ')}</b>`:`Pas de finition en ${plural(3-cd.length,'fléchette')}`},
  curTotal:cd=>cd.reduce((a,d)=>a+(d.pts||0),0),fmt:t=>t.ok?`✓ ${t.start}`:t.bust?'bust':'raté',
  cat:t=>t.ok?'checkout':t.bust?'bust':'low',say:()=>'',resume:(S,p)=>`${S.ok[p]} réussies`,
  statCols:['Réussies','Taux','Meilleure','Fléch.'],
  statRows(S,g){return g.players.map((_,i)=>{const ts=S.turns.filter(t=>t.p===i);return [S.ok[i],ts.length?Math.round(S.ok[i]/ts.length*100)+' %':'–',ts.reduce((a,t)=>Math.max(a,t.ok?t.start:0),0)||'–',ts.reduce((a,t)=>a+t.darts.length,0)]})},
  statNote:'Taux = finitions réussies ÷ finitions tentées.',endLine:()=>'Le plus de finitions réussies l\'emporte.'};

GAMES.race={id:'race',name:'Course aux points',short:'Course',group:'Personnalisés',sub:'Le premier à N points',
  rules:g=>`Chaque fléchette ajoute ses points. Le premier joueur à atteindre ${g.opts.target} points gagne, même au milieu de sa volée. Un score à choisir librement pour des parties courtes ou longues.`,
  opts:[{k:'target',label:'Objectif',vals:[[100,'100'],[200,'200'],[300,'300'],[500,'500'],[1000,'1000']],def:300,free:{min:20,max:5000,label:'Autre objectif'}}],
  title:g=>`Course<small>${g.opts.target} points</small>`,
  run(g){const T=g.opts.target;return runTurns(g,{
    init:g=>({tot:g.players.map(()=>0)}),
    dart(S,p,d,cur){const pts=dScore(d);S.tot[p]+=pts;if(S.tot[p]>=T){S.over=true;S.winner=p;cur.win=true;S.ranking=[p,...g.players.map((_,i)=>i).filter(i=>i!==p).sort((a,b)=>S.tot[b]-S.tot[a])]}return {pts}},
    endTurn(S,p,t){t.total=sumPts(t)}})},
  big:(S,p)=>S.tot[p],chip:(S,i)=>S.tot[i],chipSub:(S,i,g)=>`reste ${Math.max(0,g.opts.target-S.tot[i])}`,
  hint:(S,p,g)=>`Encore <b>${Math.max(0,g.opts.target-S.tot[p])}</b> points pour gagner`,
  curTotal:cd=>cd.reduce((a,d)=>a+d.pts,0),fmt:t=>String(t.total),
  cat:(t,S)=>pointsCat(t,S),say:t=>t.total===180||t.win?'':(t.total===0?'Zéro. ':t.total+' ! '),resume:(S,p)=>`score ${S.tot[p]}`,
  statCols:['Total','Meilleure','Fléch.'],
  statRows(S,g){return g.players.map((_,i)=>{const ts=S.turns.filter(t=>t.p===i);return [S.tot[i],ts.reduce((a,t)=>Math.max(a,t.total),0),ts.reduce((a,t)=>a+t.darts.length,0)]})},
  statNote:'Total = somme de toutes les fléchettes.',endLine:(S,g)=>`Premier à ${g.opts.target} points.`};

const ZONE_L={any:'n\'importe quelle zone',double:'le double',triple:'le triple'};
const segLabel=n=>n===25?'Bull':String(n);
GAMES.custom={id:'custom',name:'Parcours personnalisé',short:'Parcours',group:'Personnalisés',sub:'Vos numéros, dans votre ordre',
  rules:g=>`Touchez les cibles de votre parcours dans l'ordre : ${g.opts.seq.map(segLabel).join(' → ')}. Il faut toucher ${ZONE_L[g.opts.zone]} de chaque numéro${g.opts.zone==='triple'?' (le Bull se valide au centre)':''}. Le premier à finir le parcours gagne.`,
  opts:[{k:'seq',label:'Parcours (touchez les numéros dans l\'ordre voulu)',type:'seq',def:[20,19,18,17,16,15,25]},
        {k:'zone',label:'Zone à toucher',vals:[['any','Toutes'],['double','Doubles'],['triple','Triples']],def:'any'}],
  title:g=>`Parcours<small>${g.opts.seq.length} cibles</small>`,
  run(g){const seq=g.opts.seq.length?g.opts.seq:[20],L=seq.length,z=g.opts.zone;return runTurns(g,{
    init:g=>({pos:g.players.map(()=>0),seq}),
    dart(S,p,d,cur){const tg=seq[S.pos[p]];let ok=d.seg===tg&&d.mult>0;
      if(ok&&z==='double')ok=d.mult===2;if(ok&&z==='triple')ok=tg===25?d.mult===2:d.mult===3;
      if(ok){S.pos[p]++;if(S.pos[p]>=L){S.over=true;S.winner=p;cur.win=true;S.ranking=[p,...g.players.map((_,i)=>i).filter(i=>i!==p).sort((a,b)=>S.pos[b]-S.pos[a])]}}return {hit:ok?1:0}},
    endTurn(S,p,t){t.total=t.darts.reduce((a,x)=>a+x.hit,0)}})},
  big:(S,p)=>S.pos[p]>=S.seq.length?'✓':segLabel(S.seq[S.pos[p]]),chip:(S,i)=>`${S.pos[i]}/${S.seq.length}`,chipSub:(S,i)=>S.pos[i]>=S.seq.length?'terminé':`vise ${segLabel(S.seq[S.pos[i]])}`,
  target:(S,p)=>S.over||S.pos[p]>=S.seq.length?null:S.seq[S.pos[p]],
  hint:(S,p,g)=>S.pos[p]>=S.seq.length?'Terminé !':`Visez : <b>${g.opts.zone==='double'?'D':g.opts.zone==='triple'&&S.seq[S.pos[p]]!==25?'T':''}${segLabel(S.seq[S.pos[p]])}</b> · cible ${S.pos[p]+1}/${S.seq.length}`,

const profById=id=>profiles().find(p=>p.id===id);
const profByName=n=>profiles().find(p=>p.name.trim().toLowerCase()===String(n).trim().toLowerCase());
function ensureProfile(name,color){let p=profByName(name);
  if(!p){p={id:uid(),name:name.trim(),color:color||AV_COLORS[profiles().length%AV_COLORS.length],created:Date.now()};profiles().push(p)}
  p.last=Date.now();saveProfiles();return p}
function profilesByRecent(){return profiles().slice().sort((a,b)=>(b.last||0)-(a.last||0))}

/* ---------- Statistiques (calculées uniquement à partir des fléchettes saisies) ---------- */
function gameHistory(){return store.get('history',[]).filter(g=>g&&g.players&&g.darts)}
function playerIndex(g,p){let i=g.players.findIndex(x=>x.id===p.id);if(i<0)i=g.players.findIndex(x=>x.name.trim().toLowerCase()===p.name.trim().toLowerCase());return i}
function statsOf(p){
  const st={games:0,wins:0,ties:0,x01:{darts:0,pts:0,best:0,c180:0,c140:0,c100:0,co:0,dAtt:0,dHit:0},cricket:{darts:0,marks:0},byType:{},evo:[],recent:[]};
  for(const g of gameHistory().slice().reverse()){
    let i=playerIndex(g,p),mi=-1,ml=1;
    if(i<0){i=g.players.findIndex(x=>x.members&&x.members.some(m=>m.id===p.id||m.name.trim().toLowerCase()===p.name.trim().toLowerCase()));
      if(i>=0){const mem=g.players[i].members;mi=mem.findIndex(m=>m.id===p.id||m.name.trim().toLowerCase()===p.name.trim().toLowerCase());ml=mem.length}}
    if(i<0)continue;const m=GAMES[g.type||'x01'];if(!m)continue;let S;try{S=m.run(g)}catch(e){continue}
    st.games++;const won=S.winner===i,tie=!!(S.tie&&S.tie.includes(i));if(won)st.wins++;if(tie)st.ties++;
    const bt=st.byType[m.name]||(st.byType[m.name]={games:0,wins:0});bt.games++;if(won)bt.wins++;
    st.recent.push({g,won,tie,i});
    const ts=S.turns.filter(t=>t.p===i).filter((t,k)=>mi<0||k%ml===mi);
    if((g.type||'x01')==='x01'){let d=0,pts=0;
      for(const t of ts){d+=t.darts.length;pts+=t.total;st.x01.best=Math.max(st.x01.best,t.total);
        if(t.total===180)st.x01.c180++;else if(t.total>=140)st.x01.c140++;else if(t.total>=100)st.x01.c100++;
        if(t.checkout)st.x01.co=Math.max(st.x01.co,t.total);
        if(g.outRule==='double'){let rem=t.startRem;for(const dd of t.darts){if(rem===50||(rem<=40&&rem%2===0&&rem>0))st.x01.dAtt++;if(dd.mult===2&&dd.pts===rem)st.x01.dHit++;rem-=dd.pts}}}
      st.x01.darts+=d;st.x01.pts+=pts;if(d)st.evo.push({t:g.finishedAt||g.created,v:pts/d*3})}
    if(g.type==='cricket'||g.type==='cutthroat'){for(const t of ts){st.cricket.darts+=t.darts.length;st.cricket.marks+=t.total}}
  }
  st.recent.reverse();return st;
}
const fmt1=v=>Number.isFinite(v)?v.toFixed(1):'–';

/* Courbe d'évolution de la moyenne (dessinée à l'échelle) */
function evoChart(pts){
  if(pts.length<2)return '<p class="note">La courbe apparaît après deux parties de 301 à 901.</p>';
  const P=pts.slice(-30),W=320,H=150,L=34,R=8,T=12,B=22;
  const lo=Math.floor(Math.min(...P.map(p=>p.v))/10)*10,hi=Math.ceil(Math.max(...P.map(p=>p.v))/10)*10||10;const span=Math.max(10,hi-lo);
  const x=i=>L+(W-L-R)*i/(P.length-1),y=v=>T+(H-T-B)*(1-(v-lo)/span);
  const ticks=[lo,lo+span/2,lo+span];
  const line=P.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join('');
  const area=line+`L${x(P.length-1).toFixed(1)} ${H-B}L${L} ${H-B}Z`;
  return `<svg class="evo" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de la moyenne sur ${P.length} parties">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" class="lab">${Math.round(v)}</text>`).join('')}
    <path d="${area}" class="area"/><path d="${line}" class="ln"/>
    ${P.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===P.length-1?4:2.4}" class="${i===P.length-1?'last':'pt'}"/>`).join('')}
    <text x="${L}" y="${H-6}" class="lab">1<tspan dx="2">re partie</tspan></text><text x="${W-R}" y="${H-6}" text-anchor="end" class="lab">dernière</text></svg>`;
}

/* Élimination directe : tableau complet, exemptés qualifiés d'office */
function buildKO(ids){let n=1;while(n<ids.length)n*=2;const seeds=ids.concat(Array(n-ids.length).fill(null));
  const order=[];for(let i=0;i<n/2;i++)order.push([seeds[i],seeds[n-1-i]]);
  const rounds=[];let cur=order.map(([a,b],i)=>({id:uid(),r:0,i,a,b,winner:null}));rounds.push(cur);
  let size=cur.length;let r=1;while(size>1){size/=2;rounds.push([...Array(size)].map((_,i)=>({id:uid(),r,i,a:null,b:null,winner:null})));r++}
  const flat=rounds.flat();koAdvance(flat);return flat}
function koAdvance(ms){let changed=true;while(changed){changed=false;
  for(const m of ms){if(m.winner==null&&m.r===0&&((m.a&&!m.b)||(!m.a&&m.b))){m.winner=m.a||m.b;m.bye=true;changed=true}
    if(m.winner){const nx=ms.find(x=>x.r===m.r+1&&x.i===Math.floor(m.i/2));if(nx){const side=m.i%2?'b':'a';if(nx[side]!==m.winner){nx[side]=m.winner;changed=true}}}}}}
/* Championnat : chacun contre chacun (méthode du cercle), aller-retour en option */
function buildLeague(ids,legs){const a=ids.slice();if(a.length%2)a.push(null);const n=a.length,ms=[];
  for(let r=0;r<n-1;r++){for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x&&y)ms.push({id:uid(),r,a:r%2?y:x,b:r%2?x:y,winner:null})}a.splice(1,0,a.pop())}
  if(legs===2){const back=ms.map(m=>({id:uid(),r:m.r+n-1,a:m.b,b:m.a,winner:null,leg:2}));ms.push(...back)}return ms}
/* Poules : répartition en serpentin, chacun contre chacun dans sa poule */
function buildGroups(ids,size){const ng=Math.max(2,Math.round(ids.length/size));const groups=[...Array(ng)].map(()=>[]);
  ids.forEach((id,k)=>{const row=Math.floor(k/ng),col=k%ng;groups[row%2?ng-1-col:col].push(id)});
  const ms=[];groups.forEach((gr,gi)=>buildLeague(gr,1).forEach(m=>ms.push(Object.assign(m,{stage:'g',grp:gi}))));return {groups,ms}}
const koMatches=t=>t.format==='groups'?t.matches.filter(m=>m.stage==='k'):t.matches;
const GROUP_L='ABCDEFGHIJKLMNOP';
/* Phase finale : les 2 premiers de chaque poule, 1er d'une poule contre 2e d'une autre */
function buildFinals(t){const W=[],R=[];t.groups.forEach((gr,gi)=>{const st=standings(t,gr,t.matches.filter(m=>m.stage==='g'&&m.grp===gi));if(st[0])W.push({id:st[0].id,g:gi});if(st[1])R.push({id:st[1].id,g:gi})});
  const len=W.length+R.length;let n=1;while(n<len)n*=2;const seeds=Array(len).fill(null);W.forEach((w,i)=>seeds[i]=w.id);
  const left=R.slice();for(let j=0;j<W.length;j++){const pi=n-1-j;if(pi>=len||pi<W.length)continue;let k=left.findIndex(r=>r.g!==W[j].g);if(k<0)k=0;seeds[pi]=left.splice(k,1)[0].id}
  for(let i=W.length;i<len;i++)if(seeds[i]==null)seeds[i]=left.shift().id;
  buildKO(seeds).forEach(m=>t.matches.push(Object.assign(m,{stage:'k'})))}
function standings(t,ids,ms){const tab=Object.fromEntries((ids||t.players.map(p=>p.id)).map(id=>[id,{id,pl:0,w:0,l:0,d:0,pts:0}]));
  for(const m of (ms||t.matches)){if(!m.done||!tab[m.a]||!tab[m.b])continue;const A=tab[m.a],B=tab[m.b];A.pl++;B.pl++;
    if(m.winner===m.a){A.w++;B.l++;A.pts+=2}else if(m.winner===m.b){B.w++;A.l++;B.pts+=2}else{A.d++;B.d++;A.pts++;B.pts++}}
  return Object.values(tab).sort((x,y)=>y.pts-x.pts||y.w-x.w||x.l-y.l)}
const tLabel=t=>t.format==='ko'?'Élimination directe':t.format==='groups'?'Poules + phase finale':'Championnat'+(t.legs===2?' aller-retour':'');
function tStatus(t){if(t.format!=='league'){const K=koMatches(t);if(!K.length)return {done:false};const fin=K.find(m=>m.r===Math.max(...K.map(x=>x.r)));return fin&&fin.winner?{done:true,champ:fin.winner}:{done:false}}
  if(t.matches.every(m=>m.done)){const s=standings(t);return {done:true,champ:s[0].id}}return {done:false}}

}

function matchRow(t,m){const A=m.a?esc(pName(t,m.a)):'<i>à venir</i>',B=m.b?esc(pName(t,m.b)):'<i>à venir</i>';

    ${live?`<button class="btn btn-primary sm" data-act="resume">Reprendre</button>`:can?`<button class="btn btn-primary sm" data-act="tplay" data-v="${m.id}">Jouer</button>`:m.done&&m.gameId?`<button class="lnk" data-act="hgame" data-v="${m.gameId}">Résumé</button>`:'<span></span>'}</div>`}

function playMatch(mid){const t=tById(curTid);const m=t.matches.find(x=>x.id===mid);if(!m)return;

  const amb=store.get('ambByName',{});
  gate(dartsKey(d.type,d.opts,2),dartsLabel(d.type,d.opts),()=>{
  game=Object.assign({id:uid(),created:Date.now(),amb:Object.fromEntries(pls.map(p=>[p.id,amb[p.name]&&AMBIANCES[amb[p.name]]?amb[p.name]:'standard'])),players:pls,darts:[],validated:0,tournament:{tid:t.id,mid:m.id}},asGame(d));
  if(GAMES[game.type].setup)GAMES[game.type].setup(game);saveGame();Sound.unlock();Voice.warm();go('game');announceStart()})}
/* Fin d'une partie de tournoi : on inscrit le résultat */
function recordTournament(g,S){if(!g.tournament)return;const t=tById(g.tournament.tid);if(!t)return;const m=t.matches.find(x=>x.id===g.tournament.mid);if(!m)return;
  const w=S.winner!=null?g.players[S.winner].id:null;
  const ko=t.format==='ko'||m.stage==='k';
  if(ko&&w==null)return; // égalité en élimination directe : le match reste à rejouer
  m.done=true;m.winner=w;m.gameId=g.id;if(ko)koAdvance(koMatches(t));
  if(t.format==='groups'&&m.stage==='g'&&!koMatches(t).length&&t.matches.every(x=>x.stage!=='g'||x.done))buildFinals(t);
  saveT(t)}
function unrecordTournament(g){if(!g.tournament)return;const t=tById(g.tournament.tid);if(!t)return;const m=t.matches.find(x=>x.id===g.tournament.mid);if(!m||m.gameId!==g.id)return;
  if(m.stage==='g'&&koMatches(t).some(x=>x.done&&!x.bye))return; // phase finale déjà commencée
  if(m.stage==='g')t.matches=t.matches.filter(x=>x.stage!=='k');
  if(t.format==='ko'||m.stage==='k'){const nx=koMatches(t).find(x=>x.r===m.r+1&&x.i===Math.floor(m.i/2));if(nx&&nx.done)return;if(nx)nx[m.i%2?'b':'a']=null}
  m.done=false;m.winner=null;m.gameId=null;saveT(t)}

/* =========================================================
   Profil de l'utilisateur et code utilisateur
   Chaque appareil a un profil « propriétaire » avec un code à 6 caractères.
   Sur l'appareil qui gère la partie, on ajoute le code d'un joueur à son profil :
   ses parties peuvent ensuite lui être envoyées par un lien, et elles
   s'ajoutent à ses statistiques sur son propre téléphone. Aucun serveur.
   ========================================================= */
const CODE_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newUserCode(){let c='';const a=new Uint32Array(6);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<6;i++)a[i]=Math.random()*1e9}for(let i=0;i<6;i++)c+=CODE_ABC[a[i]%CODE_ABC.length];return c}
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
function owner(){return profiles().find(p=>p.owner)||null}
function profByCode(c){c=normCode(c);return c?profiles().find(p=>p.code===c):null}

/* ---------- Parties à envoyer ---------- */
function outbox(){return store.get('outbox',{})}
function queueGame(g){const o=owner();const box=outbox();
  g.players.flatMap(pl=>pl.members||[pl]).forEach(pl=>{const pr=profById(pl.id);if(pr&&pr.code&&(!o||pr.code!==o.code)){(box[pr.code]=box[pr.code]||[]);if(!box[pr.code].includes(g.id))box[pr.code].push(g.id)}});store.set('outbox',box)}
function unqueueGame(g){const box=outbox();for(const k of Object.keys(box)){box[k]=box[k].filter(id=>id!==g.id);if(!box[k].length)delete box[k]}store.set('outbox',box)}
function pendingFor(code){return (outbox()[code]||[]).length}

/* Lien d'envoi : parties compressées dans le lien (#imp=…) */
const b64u={enc(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},
  dec(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}};
async function zip(str){const u=new TextEncoder().encode(str);if(typeof CompressionStream==='undefined')return '0'+b64u.enc(u);
  const cs=new Blob([u]).stream().pipeThrough(new CompressionStream('deflate-raw'));return '1'+b64u.enc(new Uint8Array(await new Response(cs).arrayBuffer()))}
async function unzip(t){const u=b64u.dec(t.slice(1));if(t[0]==='0')return new TextDecoder().decode(u);
  const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return await new Response(ds).text()}
function packGame(g){return {i:g.id,t:g.type||'x01',s:g.start,o:g.outRule,n:g.inRule,op:g.opts,a:g.assign,q:g.seq,c:g.created,f:g.finishedAt,
  p:g.players.map(pl=>{const pr=profById(pl.id);return [pl.name,(pr&&pr.code)||'',pl.members?pl.members.map(m=>{const q=profById(m.id);return [m.name,(q&&q.code)||'']}):undefined]}),d:g.darts.map(d=>d.seg*4+d.mult)}}
function unpackGame(x){const g={id:x.i,type:x.t,opts:x.op||{},created:x.c,finishedAt:x.f,imported:true,validated:0,
  players:x.p.map(([name,code,mem],i)=>{const pl={id:'imp-'+x.i+'-'+i,name,code};if(mem)pl.members=mem.map(([n,c],j)=>({id:'imp-'+x.i+'-'+i+'-'+j,name:n,code:c}));return pl}),darts:x.d.map(v=>({seg:Math.floor(v/4),mult:v%4}))};
  if(x.t==='x01'){g.start=x.s;g.outRule=x.o;g.inRule=x.n}if(x.a)g.assign=x.a;if(x.q)g.seq=x.q;return g}
async function sendStats(code){const pr=profByCode(code);const ids=outbox()[code]||[];const hist=gameHistory();
  const games=ids.map(id=>hist.find(g=>g.id===id)).filter(Boolean);

  const done=()=>{const box=outbox();delete box[code];store.set('outbox',box);render()};
  if(navigator.share){navigator.share({title:'ARROW · statistiques',text:txt,url:link}).then(done).catch(()=>{})}
  else{openSheet(`<div class="sheet-head"><h2>Envoyer les statistiques</h2><button class="icon-btn" data-act="closesheet" aria-label="Fermer">${I.x}</button></div>
      <p>Copiez ce lien et envoyez-le à ${esc(pr?pr.name:'ce joueur')} (WhatsApp, SMS…).</p><div class="linkbox">${esc(link)}</div>
      <button class="btn btn-primary" data-act="copyimp">Copier le lien</button>`,'Envoyer');window._impLink=link;window._impDone=done}}

/* Ajoute les parties reçues aux statistiques ; renvoie le nombre de parties nouvelles */
function importPayload(x){const o=owner();if(!o||!x||!x.games)return 0;
  const known=new Set(gameHistory().map(g=>g.id));const h=store.get('history',[]);let n=0;
  for(const raw of x.games){const g=unpackGame(raw);if(known.has(g.id))continue;
    g.players.flatMap(pl=>pl.members||[pl]).forEach(pl=>{if(pl.code&&pl.code===x.to){pl.id=o.id;pl.name=o.name}else{const pr=pl.code?profByCode(pl.code):null;if(pr)pl.id=pr.id}});
    h.push(g);n++}
  if(n){h.sort((a,b)=>(b.finishedAt||b.created||0)-(a.finishedAt||a.created||0));store.set('history',h.slice(0,500))}
  return n}
function doImport(){const o=owner(),x=incoming;if(!o||!x)return;const n=importPayload(x);
  incoming=null;toastMsg(`${n} partie${n>1?'s':''} ajoutée${n>1?'s':''} à vos statistiques`);curPid=o.id;go('player')}

/* ---------- Sauvegarde des données dans le compte ---------- */
const SYNC_KEYS=['profiles','history','history2','tournaments','players','ambByName','lastSetup','lastOther','prefs'];
const Sync={t:null,busy:false,again:false,err:null,
  dirty(){if(!Cloud.session())return;clearTimeout(this.t);this.t=setTimeout(()=>this.push(),2500)},
  snapshot(){const d={v:1};SYNC_KEYS.forEach(k=>{const v=store.get(k,undefined);if(v!==undefined)d[k]=v});d.tomb=store.get('tomb',[]);return d},
  async pull(){const j=await Cloud.call('pull');if(j.data)mergeData(j.data)},
  async push(){if(!Cloud.session())return;if(this.busy){this.again=true;return}this.busy=true;
    try{await Cloud.call('push',{data:this.snapshot()});
      this.err=null;store.set('syncAt',Date.now())}catch(e){this.err=e}
    finally{this.busy=false;if(screen==='account')updateSyncBox();if(this.again){this.again=false;this.dirty()}}}
};
/* Toute écriture d'une donnée suivie déclenche une sauvegarde (regroupée, 2,5 s après) */
{const _set=store.set.bind(store),_del=store.del.bind(store);
  store.set=(k,v)=>{_set(k,v);if(SYNC_KEYS.includes(k))Sync.dirty()};
  store.del=k=>{_del(k);if(SYNC_KEYS.includes(k))Sync.dirty()}}
/* Éléments supprimés : ils ne doivent pas revenir depuis un autre appareil */
function tomb(id){if(!id)return;const t=store.get('tomb',[]);if(!t.includes(id)){t.push(id);store.set('tomb',t.slice(-3000))}Sync.dirty()}

function mergeData(d){
  const T=new Set([...store.get('tomb',[]),...(d.tomb||[])]);store.set('tomb',[...T].slice(-3000));
  const fresh=!store.get('history',[]).length&&!store.get('history2',[]).length;
  const byId=(loc,rem)=>{const m=new Map();for(const x of rem||[])if(x&&x.id&&!T.has(x.id))m.set(x.id,x);for(const x of loc||[])if(x&&x.id&&!T.has(x.id))m.set(x.id,x);return [...m.values()]};
  /* Joueurs : fusion, puis un seul profil par code et par prénom */
  let P=byId(store.get('profiles',[]),d.profiles);const remap={},keep=[];
  for(const p of P){const twin=keep.find(q=>(p.code&&q.code===p.code)||q.name.trim().toLowerCase()===p.name.trim().toLowerCase());
    if(twin){remap[p.id]=twin.id;if(!twin.code&&p.code)twin.code=p.code;if(!twin.photo&&p.photo)twin.photo=p.photo;twin.last=Math.max(twin.last||0,p.last||0)}else keep.push(p)}
  const fix=v=>{if(!Object.keys(remap).length||v==null)return v;let s=JSON.stringify(v);for(const [a,b] of Object.entries(remap))s=s.split('"'+a+'"').join('"'+b+'"');return JSON.parse(s)};
  store.set('profiles',keep);profilesCache=null;
  const H=fix(byId(store.get('history',[]),d.history)).sort((a,b)=>(b.finishedAt||b.created||0)-(a.finishedAt||a.created||0));store.set('history',H.slice(0,500));
  store.set('history2',byId(store.get('history2',[]),d.history2).sort((a,b)=>(b.date||0)-(a.date||0)).slice(0,300));
  store.set('tournaments',fix(byId(store.get('tournaments',[]),d.tournaments)));
  if(game)game=fix(game);
  store.set('players',[...new Set([...(store.get('players',[])),...(d.players||[])])].slice(0,16));
  store.set('ambByName',Object.assign({},d.ambByName||{},store.get('ambByName',{})));
  if(d.lastSetup&&!store.get('lastSetup',null))store.set('lastSetup',d.lastSetup);
  if(d.lastOther&&!store.get('lastOther',null))store.set('lastOther',d.lastOther);
  if(fresh&&d.prefs){Object.assign(prefs,d.prefs);savePrefs()}
}

/* ---------- Statistiques envoyées par code joueur ---------- */
const Inbox={at:0,
  async check(){if(!Cloud.session())return;this.at=Date.now();
    const j=await Cloud.call('inbox');const rows=j.items||[];if(!rows.length)return;
    let n=0;const from=new Set();for(const r of rows){try{n+=importPayload(r.payload);if(r.from_name)from.add(r.from_name)}catch(e){}}
    await Cloud.call('inbox_done',{ids:rows.map(r=>r.id)});
    if(n){toastMsg(`${n} partie${n>1?'s':''} reçue${n>1?'s':''}${from.size?' de '+[...from].join(', '):''}`);if(['home','history','players','player'].includes(screen))render()}},
  async flush(){if(!Cloud.session())return;const box=outbox(),codes=Object.keys(box);if(!codes.length)return;
    const hist=gameHistory(),o=owner();let sent=0;
    for(const code of codes){const games=box[code].map(id=>hist.find(g=>g.id===id)).filter(Boolean);
      try{if(games.length){const j=await Cloud.call('send',{to_code:code,payload:{v:1,to:code,from:o?o.name:'',games:games.map(packGame)}});if(j.unknown)continue;sent+=games.length}
        const b=outbox();delete b[code];store.set('outbox',b)}catch(e){}}
    if(sent&&screen==='end')render()}
};

  if(k==='chpw'){const old=val('cOld'),pw=val('cNew');if(!old)return formErr('Indiquez votre mot de passe actuel.');if(pw.length<8)return formErr('Le nouveau mot de passe doit faire au moins 8 caractères.');
    formBusy(f,true);try{await Auth.changePassword(old,pw);f.innerHTML='<p class="form-msg ok">Mot de passe changé.</p>'}catch(err){formBusy(f,false);formErr(err.code==='invalid_credentials'?'Le mot de passe actuel est incorrect.':niceCloud(err))}}
});
let resetToken=null;

/* =========================================================
   Autres jeux de lancer : compteur de points
   Pétanque, palet breton, Tossit (par mènes), Cornhole (manches avec annulation),
   Mölkky (quilles, 50 exact). Même principe que les fléchettes : la partie est
   une liste d'évènements, le score est recalculé, annuler = retirer le dernier.
   ========================================================= */
const OTHER={
  petanque:{name:'Pétanque',sub:'Boules et cochonnet',kind:'menes',
    rules:o=>`Deux équipes lancent leurs boules le plus près possible du cochonnet. À chaque mène, seule l'équipe la mieux placée marque : un point par boule plus proche que la meilleure boule adverse (jusqu'à ${o.max} points). La première équipe à ${o.target} points gagne. ${o.target} à 0, c'est « fanny » !`,
    opts:[{k:'format',label:'Formule',vals:[['tat','Tête-à-tête'],['dbl','Doublette'],['tri','Triplette']],def:'dbl',help:v=>({tat:'1 contre 1, 3 boules chacun : jusqu\'à 3 points par mène.',dbl:'2 contre 2, 3 boules chacun : jusqu\'à 6 points par mène.',tri:'3 contre 3, 2 boules chacun : jusqu\'à 6 points par mène.'})[v]},
          {k:'target',label:'Partie en',vals:[[11,'11'],[13,'13'],[15,'15'],[21,'21']],def:13}],
    max:o=>o.format==='tat'?3:6,fanny:true,unit:'mène'},
  palet:{name:'Palet breton',sub:'Palets sur planche en bois',kind:'menes',
    rules:o=>`Sur une planche en bois, chaque équipe lance ses palets en fonte au plus près du petit palet, le « maître ». À chaque mène, l'équipe la mieux placée marque un point par palet plus proche que le meilleur palet adverse. Un palet tombé de la planche ne compte pas. La première équipe à ${o.target} points gagne.`,
    opts:[{k:'max',label:'Palets par équipe',vals:[[4,'4'],[6,'6'],[8,'8'],[12,'12']],def:6,help:()=>'C\'est aussi le nombre maximal de points d\'une mène.'},
          {k:'target',label:'Partie en',vals:[[11,'11'],[12,'12'],[13,'13'],[21,'21']],def:12}],
    max:o=>o.max,fanny:true,unit:'mène',
    /* field : saisie sur la planche en 3D (scene.js, PL3) en plus du pavé */
    field:{pieces:'Palets',aria:'Planche de palet : gardez le doigt appuyé pour viser, relâchez pour poser le maître puis chaque palet',hint:'Doigt appuyé pour viser, relâché pour poser · à côté de la planche = raté'}},
  tossit:{name:'Tossit',sub:'Fléchettes à ventouse et Jack',kind:'menes',
    rules:o=>`Comme à la pétanque, avec des fléchettes à ventouse : on lance d'abord le Jack, puis chacun tente de coller ses Tossit au plus près. Tant qu'une équipe est la plus proche, l'autre continue de lancer. À la fin de la manche, l'équipe la mieux placée marque un point par Tossit plus proche que le meilleur adverse. La première à ${o.target} points gagne.`,
    opts:[{k:'max',label:'Tossit par équipe',vals:[[3,'3'],[6,'6']],def:3},{k:'target',label:'Partie en',vals:[[11,'11'],[13,'13'],[21,'21']],def:13}],
    max:o=>o.max,fanny:false,unit:'manche'},
  /* Réglages par défaut = règles officielles (American Cornhole Organization) ;
     les autres valeurs sont des variantes « maison » courantes. */
  cornhole:{name:'Cornhole',sub:'Sacs sur planche percée',kind:'cornhole',official:true,
    rules:o=>`Deux équipes lancent chacune 4 sacs, un sac à tour de rôle, vers une planche inclinée percée d'un trou. Sac dans le trou : 3 points. Sac resté sur la planche : 1 point. Sac au sol, ou qui touche à la fois le sol et la planche, ou qui a rebondi par terre avant de monter sur la planche : 0 point. ${o.cancel?'Annulation : seule l\'équipe qui a fait le plus marque, et seulement la différence.':'Sans annulation : chaque équipe marque tous ses points.'} L'équipe qui a marqué commence la manche suivante ; si personne n'a marqué, l'ordre ne change pas. La partie se gagne à la fin d'une manche, avec ${o.exact?'exactement '+o.target+' points : au-delà, '+(o.exact==='prev'?'le score revient à celui d\'avant la manche':'le score retombe à '+chFall(o)):o.target+' points ou plus'}${o.win2?' et au moins 2 points d\'écart':''}.${o.skunk?' Victoire immédiate à 11-0.':''}`,
    opts:[{k:'target',label:'Partie en',vals:[[21,'21 (officiel)'],[15,'15'],[11,'11']],def:21},
          {k:'cancel',label:'Annulation des points',vals:[[true,'Oui (officiel)'],[false,'Non']],def:true},
          {k:'exact',label:'Score dépassé',vals:[[false,'Sans effet (officiel)'],[true,'Retour à 15'],['b11','Retour à 11'],['prev','Score d\'avant']],def:false,
            help:v=>v?'Variante « bust » : il faut tomber juste. Pour une partie en 15 ou en 11, le retour est réduit en proportion.':'Règle officielle : atteindre ou dépasser le score suffit.'},
          {k:'win2',label:'2 points d\'écart pour gagner',vals:[[false,'Non (officiel)'],[true,'Oui']],def:false},
          {k:'skunk',label:'Victoire éclair à 11-0',vals:[[false,'Non (officiel)'],[true,'Oui']],def:false,help:v=>v?'Variante « skunk » : la partie s\'arrête si une équipe mène 11 à 0.':''}]},
  molkky:{name:'Mölkky',sub:'Quilles finlandaises',kind:'molkky',
    rules:o=>`On lance le bâton sur 12 quilles numérotées. Une seule quille tombée : on marque son numéro. Plusieurs quilles : on marque le nombre de quilles tombées. Il faut atteindre exactement 50 points : au-delà, on retombe à 25. ${o.elim?'Trois lancers ratés de suite : le joueur est éliminé.':'Trois lancers ratés de suite : le score retombe à 0.'}`,
    opts:[{k:'elim',label:'Après 3 ratés de suite',vals:[[true,'Éliminé'],[false,'Retour à 0']],def:true}]}
};
/* Cornhole, variante « bust » : palier de retour (15 ou 11 pour une partie en 21, réduit en proportion sinon) */
function chFall(o){return Math.round(o.target*(o.exact==='b11'?11:15)/21)}
const MK_LAYOUT=[[7,9,8],[5,11,12,6],[3,10,4],[1,2]];

/* ---------- Calcul du score ---------- */
function run2(g){const D=OTHER[g.kind],o=g.opts,n=g.teams.length;
  if(D.kind==='menes'){const sc=g.teams.map(()=>0);let winner=null;
    g.events.forEach(e=>{if(winner!=null)return;sc[e.t]+=e.pts;if(sc[e.t]>=o.target)winner=e.t});
    return {sc,winner,fanny:winner!=null&&D.fanny&&sc.some((s,i)=>i!==winner&&s===0)}}
  if(D.kind==='cornhole'){const sc=[0,0];let winner=null,skunk=false;const log=[];
    g.events.forEach(e=>{if(winner!=null)return;const a=e.a[0]*3+e.a[1],b=e.b[0]*3+e.b[1];let pa=a,pb=b;if(o.cancel){pa=Math.max(0,a-b);pb=Math.max(0,b-a)}
      const before=sc.slice();sc[0]+=pa;sc[1]+=pb;
      /* variante « bust » : score dépassé → retour à un palier, ou au score d'avant la manche */
      const bust=[false,false];if(o.exact)for(const i of [0,1])if(sc[i]>o.target){sc[i]=o.exact==='prev'?before[i]:chFall(o);bust[i]=true}
      log.push({pa,pb,bust});
      /* la partie se gagne en fin de manche ; à égalité (sans annulation) on continue */
      const gap=o.win2?2:1;
      for(const i of [0,1])if(sc[i]>=o.target&&sc[i]-sc[1-i]>=gap)winner=i;
      if(winner==null&&o.skunk)for(const i of [0,1])if(sc[i]>=11&&sc[1-i]===0){winner=i;skunk=true}});
    return {sc,winner,log,fanny:skunk}}
  if(D.kind==='molkky'){const P=g.teams.map(()=>({sc:0,miss:0,out:false}));let turn=0,winner=null;const log=[];
    const nextTurn=()=>{for(let k=1;k<=n;k++){const j=(turn+k)%n;if(!P[j].out){turn=j;return}}};
    g.events.forEach(e=>{if(winner!=null)return;const st=P[turn];let pts=e.pins.length===1?e.pins[0]:e.pins.length;let note='';
      if(!pts){st.miss++;if(st.miss>=3){if(o.elim){st.out=true;note='éliminé'}else{st.sc=0;st.miss=0;note='retour à 0'}}}
      else{st.miss=0;st.sc+=pts;if(st.sc>50){st.sc=25;note='au-delà de 50 : retour à 25'}}
      log.push({p:turn,pts,note,pins:e.pins});
      if(st.sc===50)winner=turn;else{const alive=P.map((x,i)=>x.out?-1:i).filter(i=>i>=0);if(alive.length===1&&n>1)winner=alive[0];else nextTurn()}});
    return {P,turn,winner,log}}
}

/* ---------- Partie en cours et saisie ---------- */

   mkSel = quilles sélectionnées, mkMiss = point de pelouse touché pour un raté ({x,z}) ;

  if(typeof CH3!=='undefined'){CH3.hist=[];CH3.pending=null}if(typeof PL3!=='undefined'){PL3.hist=[];PL3.moving=PL3.pending=null}}
function saveG2(){if(g2)store.set('current2',g2);else store.del('current2')}
function newODraft(kind){const D=OTHER[kind],o={};D.opts.forEach(x=>o[x.k]=x.def);const last=store.get('lastOther',{})[kind];

/* ---------- Écran de score ---------- */
/* Écran de partie des autres jeux. En cours de partie, tout tient sur l'écran :
   panneau des scores (couleur d'équipe, pièces jouées), outils (équipe qui lance,
   interrupteur 3D, historique), terrain 3D ou pavé de saisie, puis les boutons.
   L'interrupteur 3D (prefs.view3d) est mémorisé d'une partie à l'autre. */
const HAS3D=k=>k==='molkky'||k==='cornhole'||k==='palet';
function view3d(){return prefs.view3d!==false&&HAS3D(g2.kind)}
function renderOPlay(){
  const D=OTHER[g2.kind],S=run2(g2),o=g2.opts,over=S.winner!=null;
  if(over)return renderOEnd(D,S);
  const v3=view3d(),tc=i=>i?'b':'a';
  const sw=HAS3D(g2.kind)?`<button class="sw3d" data-act="v3d" role="switch" aria-checked="${v3}" aria-label="Terrain en 3D"><span class="sw3d-track"><i></i></span>3D</button>`:'';
  const histBtn=`<button class="icon-btn" data-act="mhist" aria-label="Historique de la partie">${I.list}</button>`;
  /* tuile d'une équipe : couleur, nom, score, pièces jouées */
  const tile=(i,sub)=>`<section class="op-team ${tc(i)}" id="mt${i}"><span class="op-name"><i class="bagdot ${tc(i)}"></i>${esc(g2.teams[i].name)}</span>
    <span class="op-sc">${S.sc[i]}</span><span class="op-sub" id="opSub${i}">${sub(i)}</span><span class="mt-bar"><i style="width:${Math.min(100,S.sc[i]/o.target*100)}%"></i></span></section>`;
  let score='',tools='',stage='',sum='',actions='';
  if(D.kind==='menes'){const max=D.max(o),field=!!D.field&&v3,what=D.field?D.field.pieces.toLowerCase():'';
    const pad=i=>`<div class="mt-pts">${[...Array(max)].map((_,k)=>`<button data-act="mpt" data-v="${i}|${k+1}">+${k+1}</button>`).join('')}</div>`;
    score=`<div class="op-score">${[0,1].map(i=>tile(i,i=>field?`${plDraft.pieces.filter(p=>p.t===i).length}/${max} ${what}`:`objectif ${o.target}`)).join('')}</div>`;
    tools=field?`<div class="ch-teams" role="group" aria-label="Quelle équipe lance ?">${[0,1].map(i=>`<button class="chip" data-act="plteam" data-v="${i}" aria-pressed="${PL3.team===i}"><i class="bagdot ${tc(i)}"></i>${esc(g2.teams[i].name)}</button>`).join('')}</div>`
      :`<p class="op-hint">Points gagnés par l'équipe à la fin de la ${D.unit}</p>`;
    if(field){stage=`<div class="scene fill"><canvas id="plCv" aria-label="${D.field.aria}"></canvas><span class="scene-hint">${D.field.hint}</span></div>`;
      sum='<p class="ch-sum" id="plSum"></p>';
      actions=`<button class="btn btn-ghost" data-act="plundo" ${PL3.hist.length?'':'disabled'} aria-label="Annuler le dernier palet">${I.undo}</button><button class="btn btn-primary" id="plVal" data-act="plval">Valider la ${D.unit}</button>`}
    else stage=`<div class="op-pads">${[0,1].map(i=>`<div class="op-pad"><p class="cat-lbl"><i class="bagdot ${tc(i)}"></i>${esc(g2.teams[i].name)}</p>${pad(i)}</div>`).join('')}</div>`}
  if(D.kind==='cornhole'){const bags=t=>(chDraft.bags||[]).filter(b=>b.t===t).length;
    score=`<div class="op-score">${[0,1].map(i=>tile(i,i=>v3?`${bags(tc(i))}/4 sacs`:`objectif ${o.target}`)).join('')}</div>`;
    tools=v3?`<div class="ch-teams" role="group" aria-label="Sacs de quelle équipe ?">${['a','b'].map((t,i)=>`<button class="chip" data-act="chteam" data-v="${t}" aria-pressed="${CH3.team===t}"><i class="bagdot ${t}"></i>${esc(g2.teams[i].name)}</button>`).join('')}</div>`:'<p class="op-hint">Sacs de la manche</p>';
    stage=v3?`<div class="scene fill"><canvas id="chCv" aria-label="Planche de cornhole : touchez l'endroit où le sac s'est arrêté ; gardez le doigt appuyé pour viser à la loupe"></canvas><span class="scene-hint">Touchez pour poser · restez appuyé = loupe · gazon = raté</span></div>`
      :`<div class="op-pads">${['a','b'].map((k,i)=>`<div class="op-pad"><p class="cat-lbl"><i class="bagdot ${k}"></i>${esc(g2.teams[i].name)}</p><div class="ch-row"><span>Dans le trou <small>3 pts</small></span>${stepper(k,0)}</div><div class="ch-row"><span>Sur la planche <small>1 pt</small></span>${stepper(k,1)}</div></div>`).join('')}</div>`;
    sum='<p class="ch-sum" id="chSum"></p>';
    actions=`${v3?`<button class="btn btn-ghost" data-act="chundo" ${CH3.hist.length?'':'disabled'} aria-label="Annuler le dernier sac">${I.undo}</button>`:''}<button class="btn btn-primary" id="chVal" data-act="chval">${chLabel()}</button>`}
  if(D.kind==='molkky'){const cur=S.turn;
    score=`<div class="op-mk">${g2.teams.map((t,i)=>{const p=S.P[i];return `<div class="mkp ${i===cur?'on':''} ${p.out?'out':''}"><span class="mkp-name">${esc(t.name)}</span><span class="mkp-sc">${p.sc}</span><span class="mkp-miss">${[0,1,2].map(k=>`<i class="${k<p.miss?'x':''}"></i>`).join('')}</span></div>`}).join('')}</div>`;
    tools=`<p class="mk-turn">Au tour de <b>${esc(g2.teams[cur].name)}</b> · reste ${50-S.P[cur].sc}</p>`;
    stage=v3?`<div class="scene fill"><canvas id="mkCv" aria-label="Quilles de Mölkky : touchez les quilles tombées"></canvas><span class="scene-hint">Touchez les quilles tombées, ou la pelouse pour un raté</span></div>`
      :`<div class="op-pads"><div class="mk-pins">${MK_LAYOUT.map(r=>`<div class="mk-row">${r.map(n=>`<button class="pin" data-act="mkpin" data-v="${n}" aria-pressed="${mkSel.includes(n)}">${n}</button>`).join('')}</div>`).join('')}</div></div>`;
    actions=`<button class="btn btn-primary" data-act="mkval">${mkLabel()}</button>`}
  frame(esc(D.name)+`<small>${D.kind==='molkky'?'50 points':o.target+' points'}</small>`,`<div class="op" id="oplay">
    ${score}<div class="op-tools">${tools}<span class="op-tools-r">${sw}${histBtn}</span></div>
    <div class="op-stage">${stage}</div>${sum}
    ${actions?`<div class="op-actions">${actions}</div>`:''}
  </div>`,{fixed:true});
  if(v3&&D.kind==='molkky')MK3.mount();
  if(D.kind==='cornhole'){if(v3)CH3.mount();chUpdate()}
  if(v3&&D.field)PL3.mount();
}
/* Fin de partie : vainqueur, revanche, historique (cet écran peut défiler) */
function renderOEnd(D,S){const o=g2.opts;
  frame(esc(D.name)+`<small>${D.kind==='molkky'?'50 points':o.target+' points'}</small>`,`<div class="col" id="oplay">
    <div class="win ow"><span class="crown">${S.fanny?'Fanny !':'Victoire'}</span><h1>${esc(g2.teams[S.winner].name)} gagne</h1><p>${D.kind==='molkky'?'':S.sc.join(' à ')}</p></div>
    <div class="stack"><button class="btn btn-primary" data-act="mrematch">Revanche</button><button class="btn btn-silver" data-act="more">Autres jeux</button></div>
    <section><h2 class="sec-title">Historique</h2>${histOther(D,S)}
      <div class="row2" style="margin-top:8px"><button class="btn btn-ghost" data-act="mundo">${I.undo} Annuler la dernière saisie</button></div></section>
  </div>`)}
/* Historique de la partie en cours, dans une feuille */
function openOHist(){const D=OTHER[g2.kind],S=run2(g2);
  openSheet(`<div class="sheet-head"><h2>Historique</h2><button class="icon-btn" data-act="closesheet" aria-label="Fermer">${I.x}</button></div>
    ${histOther(D,S)}${g2.events.length?`<button class="btn btn-ghost" data-act="mundo">${I.undo} Annuler la dernière saisie</button>`:''}`,'Historique')}
function chLabel(){const o=g2.opts,a=chDraft.a,b=chDraft.b,pa=a[0]*3+a[1],pb=b[0]*3+b[1],na=o.cancel?Math.max(0,pa-pb):pa,nb=o.cancel?Math.max(0,pb-pa):pb;
  return 'Valider la manche · '+(o.cancel?(na?g2.teams[0].name+' +'+na:nb?g2.teams[1].name+' +'+nb:'aucun point'):'+'+pa+' / +'+pb)}
function chUpdate(){const sum=document.getElementById('chSum');if(!sum)return;
  sum.innerHTML=['a','b'].map((t,i)=>{const [h,bd]=chDraft[t];const out=(chDraft.bags||[]).filter(b=>b.t===t&&b.miss).length;return `<span><i class="bagdot ${t}"></i><b>${esc(g2.teams[i].name)}</b> ${h} trou · ${bd} planche${out?' · '+out+' dehors':''} = <b>${h*3+bd} pts</b></span>`}).join('');
  const v=document.getElementById('chVal'),u=document.querySelector('[data-act="chundo"]');if(u)u.disabled=!CH3.hist.length;

function stepper(k,j){const v=chDraft[k][j];return `<div class="stepper"><button data-act="chs" data-v="${k}|${j}|-1" aria-label="Moins">−</button><output>${v}</output><button data-act="chs" data-v="${k}|${j}|1" aria-label="Plus">+</button></div>`}

function sayGame(cat,delay=450){const L=GAME_LINES[cat];if(!L||!L.length)return '';
  const rec=Pack.has('jeux')?L.map((_,i)=>i).filter(i=>Pack.files.jeux.has(`jeux_${cat}_${i+1}`)):[];

function o2react(pts,max,teamIdx){const S=run2(g2),D=OTHER[g2.kind];
  /* score de la mène (ou du lancer au Mölkky) en haut de l'écran */
  if(D.kind==='molkky'){const l=S.log[S.log.length-1];scoreFlash(g2.teams[l.p].name,l.pts?'+'+l.pts:'Raté',l.note||'',l.pts?'':'bad')}
  else if(teamIdx>=0&&pts>0)scoreFlash(g2.teams[teamIdx].name,'+'+pts,pts>1?'points':'point');
  else scoreFlash('',D.kind==='cornhole'?'Manche nulle':'Mène blanche','','bad');
  const cat=S.winner!=null?'checkout':pts>=max?'huge':pts>=Math.ceil(max/2)?'big':pts>0?'mid':'zero';

    if(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}}

    /* la phrase « Fanny ! Treize à zéro » ne vaut que pour la pétanque et le palet, pas pour le 11-0 du cornhole */
    const vc=S.fanny&&D.kind!=='cornhole'?'fanny':D.kind==='molkky'&&S.P[S.winner].sc===50?(Math.random()<.5?'win50':'winner'):'winner';
    g2.endPhrase=sayGame(vc,900);

  let vc=null;

  else if(D.kind==='cornhole'){const e=g2.events[g2.events.length-1];vc=e.a[0]+e.b[0]>0?'hole':pts>=6?'big':pts>0?(Math.random()<.5?'mene':null):'zero'}
  else vc=pts===0?'blanche':pts>=3?'big':Math.random()<.6?'mene':null;
