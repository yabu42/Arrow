function setupBoard(){
  const cv=document.getElementById('cv');const board=document.getElementById('board');
  const draw=()=>drawBoard(cv).then(()=>{const ph=board.querySelector('.ph');if(ph&&cv.dataset.drawn)ph.remove()});
  let t;const ro=new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(draw,90)});ro.observe(board);
  let lp=null;
  const toMM=e=>{const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left-r.width/2)/(r.width/2)*G.rim,y:(e.clientY-r.top-r.height/2)/(r.height/2)*G.rim,r}};
  const showLoupe=e=>{
    const m=toMM(e),hit=hitTest(m.x,m.y);
    if(!lp){lp={c:document.createElement('canvas'),l:document.createElement('div')};lp.c.className='loupe';lp.l.className='loupe-lbl';document.body.append(lp.c,lp.l)}
    const S=136,dpr=Math.min(window.devicePixelRatio||1,3);if(lp.c.width!==S*dpr){lp.c.width=lp.c.height=S*dpr}
    const off=e.pointerType==='mouse'?90:120;
    let lx=e.clientX-S/2,ly=e.clientY-off-S;if(ly<6)ly=e.clientY+40;lx=Math.max(6,Math.min(window.innerWidth-S-6,lx));
    lp.c.style.left=lx+'px';lp.c.style.top=ly+'px';
    const ctx=lp.c.getContext('2d'),z=3,k=cv.width/m.r.width;
    const sx=(e.clientX-m.r.left)*k,sy=(e.clientY-m.r.top)*k,sw=S/z*k;
    ctx.fillStyle='#111';ctx.fillRect(0,0,lp.c.width,lp.c.height);
    ctx.save();ctx.beginPath();ctx.arc(S*dpr/2,S*dpr/2,S*dpr/2,0,7);ctx.clip();
    ctx.drawImage(cv,sx-sw/2,sy-sw/2,sw,sw,0,0,S*dpr,S*dpr);ctx.restore();
    const c=S*dpr/2;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.lineWidth=3*dpr/2;ctx.beginPath();ctx.moveTo(c-14*dpr,c);ctx.lineTo(c-3*dpr,c);ctx.moveTo(c+3*dpr,c);ctx.lineTo(c+14*dpr,c);ctx.moveTo(c,c-14*dpr);ctx.lineTo(c,c-3*dpr);ctx.moveTo(c,c+3*dpr);ctx.lineTo(c,c+14*dpr);ctx.stroke();
    ctx.strokeStyle='#fff';ctx.lineWidth=1*dpr;ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(c,c,1.2*dpr,0,7);ctx.fill();
    lp.l.textContent=dLong(hit);lp.l.style.left=(lx+S/2)+'px';lp.l.style.top=(ly+S+8)+'px';
    return {m,hit};
  };
  const hideLoupe=()=>{if(lp){lp.c.remove();lp.l.remove();lp=null}};
  let active=null;
  board.addEventListener('pointerdown',e=>{if(!cv.dataset.drawn||e.button>0)return;e.preventDefault();board.setPointerCapture(e.pointerId);active=e.pointerId;showLoupe(e)});
  board.addEventListener('pointermove',e=>{if(e.pointerId===active)showLoupe(e)});
  board.addEventListener('pointerup',e=>{if(e.pointerId!==active)return;const {m,hit}=showLoupe(e);hideLoupe();active=null;
    if(hit)addDart({seg:hit.seg,mult:hit.mult,x:+m.x.toFixed(2),y:+m.y.toFixed(2)})});
  board.addEventListener('pointercancel',()=>{active=null;hideLoupe()});
  board.addEventListener('contextmenu',e=>e.preventDefault());
}
function updateGame(){
  if(screen!=='game'||!game)return;
  const m=GAMES[game.type||'x01'],S=m.run(game);const pend=pendingTurn(S);
  const p=pend?pend.p:S.over&&S.winner!=null?S.winner:S.p;const pl=game.players[p];
  const cur=pend||(S.cur&&S.cur.p===p?S.cur:null);const cd=cur?cur.darts:[];
  document.getElementById('gPlayers').innerHTML=game.players.map((q,i)=>`<div class="pl ${i===p?'on':''}" ${i===p?'aria-current="true"':''}>${avatar(q,i)}<div style="min-width:0;flex:1"><div class="nm">${esc(q.name)}</div><div class="avg">${m.chipSub(S,i,game)}</div></div><div class="rm">${m.chip(S,i,game)}</div></div>`).join('');
  const onEl=document.querySelector('.pl.on');if(onEl&&window.matchMedia('(max-width:859px)').matches)onEl.scrollIntoView({inline:'nearest',block:'nearest'});
  const nTurn=S.turns.filter(t=>t.p===p).length+(pend?0:1);const last=pend?S.turns[game.validated-1]:S.turns[S.turns.length-1];
  const slots=[0,1,2].map(i=>{const d=cd[i];if(d)return `<div class="slot fill">${dLabel(d)}</div>`;return `<div class="slot ${i===cd.length?'next':''}">${i+1}</div>`}).join('');
  let co;
  if(pend)co=`<b>Volée terminée : ${m.fmt(pend)}.</b> Touchez « Valider », ou corrigez avec ↶.`;
  else if(S.over)co=S.winner!=null?`<b>Victoire de ${esc(pl.name)} !</b>`:'<b>Égalité !</b>';
  else co=m.hint(S,p,game,cd);
  const muted=prefs.muted;
  document.getElementById('gAct').innerHTML=`<div class="act-who">${avatar(pl,p)}<span class="act-name">${pend?esc(pl.name)+' · à valider':S.over?(S.winner!=null?'Gagnant : '+esc(pl.name):'Partie terminée'):'À toi, '+esc(pl.name)}</span><span class="act-turn">Volée ${nTurn}</span>
      <button class="icon-btn sm" data-act="mute" aria-pressed="${muted}" aria-label="${muted?'Réactiver le son':'Couper le son'}">${muted?I.mute:I.snd}</button>
      <button class="icon-btn sm hist-btn" data-act="hist" aria-label="Historique">${I.list}</button></div>
    <div class="act-score" aria-live="polite">${m.big(S,p,game)}</div>
    <div class="act-darts"><div class="slots">${slots}<div class="slot tot">${m.curTotal(cd)}</div></div>
      <div class="prev">${last?`Précédente : <b>${esc(game.players[last.p].name)}</b> ${m.fmt(last)} (${last.darts.map(dLabel).join(', ')})`:'Première volée de la partie'}</div></div>
    <div class="act-co">${co}</div>`;
  const tb=document.getElementById('gTable');if(tb&&m.table)tb.innerHTML=m.table(S,game);
  document.getElementById('gHist').innerHTML=histList(S,8);
  const sh=document.getElementById('sheetHist');if(sh)sh.innerHTML=histList(S,30);
  const st=document.getElementById('sheetTable');if(st&&m.table)st.innerHTML=m.table(S,game);
  const tg=m.target?m.target(S,p):null;
  document.getElementById('marks').innerHTML=(tg?targetOutline(tg):'')+cd.map((d,i)=>{const pt=d.x!=null?{x:d.x,y:d.y}:zoneCenter(d.seg,d.mult);if(!pt)return '';const L=3.6;
    return `<g transform="translate(${pt.x} ${pt.y})"><path d="M${-L} 0H${L}M0 ${-L}V${L}" stroke="rgba(0,0,0,.75)" stroke-width="1.6" stroke-linecap="round"/><path d="M${-L} 0H${L}M0 ${-L}V${L}" stroke="#fff" stroke-width=".6" stroke-linecap="round"/><text x="3.4" y="-3" font-size="6.5" font-weight="800" fill="#fff" stroke="rgba(0,0,0,.8)" stroke-width="1.6" paint-order="stroke" font-family="Figtree,sans-serif">${i+1}</text></g>`}).join('');
  if(prefs.input==='pad')renderPad(tg);
  renderCtrl(S,cd,pend);
}
/* Barre de commandes : mode de saisie, Raté, Valider, Annuler */
function needConfirm(){return prefs.input==='pad'||prefs.confirmBoard}
function pendingTurn(S){return needConfirm()&&game.validated!=null&&S.turns.length>game.validated?S.turns[game.validated]:null}
function renderCtrl(S,cd,pend){
  const el=document.getElementById('gCtrl');if(!el)return;const m=GAMES[game.type||'x01'];
  const conf=needConfirm();const canVal=!!pend||(cd.length>0&&!S.over);
  el.className='g-ctrl'+(conf&&prefs.input==='board'?' four':'');
  el.innerHTML=`<div class="seg"><button data-act="mode" data-v="board" aria-pressed="${prefs.input==='board'}">Cible</button><button data-act="mode" data-v="pad" aria-pressed="${prefs.input==='pad'}">Pavé</button></div>
    ${prefs.input==='board'?'<button class="btn btn-miss" data-act="miss">Raté</button>':''}
    ${conf?`<button class="btn btn-primary btn-val${pend?' ready':''}" data-act="validate" ${canVal?'':'disabled'}>Valider<small>${pend?m.fmt(pend):cd.length?m.curTotal(cd):''}</small></button>`:''}
    <button class="btn btn-undo" data-act="undo" aria-label="Annuler la dernière fléchette">${I.undo}</button>`;
}
/* Contour fin du numéro à viser (ne masque pas la cible) */
function targetOutline(seg){
  if(seg===25)return `<circle r="${G.b+1}" fill="none" stroke="rgba(0,0,0,.6)" stroke-width="2.6"/><circle r="${G.b+1}" fill="none" stroke="#f3dec2" stroke-width="1.3"/>`;
  const i=SECTORS.indexOf(seg),a0=(-99+i*18)*Math.PI/180,a1=(-81+i*18)*Math.PI/180,r0=G.b,r1=G.do+1.5;
  const P=(r,a)=>`${(r*Math.cos(a)).toFixed(2)} ${(r*Math.sin(a)).toFixed(2)}`;
  const d=`M${P(r0,a0)}L${P(r1,a0)}A${r1} ${r1} 0 0 1 ${P(r1,a1)}L${P(r0,a1)}A${r0} ${r0} 0 0 0 ${P(r0,a0)}Z`;
  return `<path d="${d}" fill="none" stroke="rgba(0,0,0,.6)" stroke-width="2.6" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#f3dec2" stroke-width="1.3" stroke-linejoin="round"/>`;
}
function histList(S,max){
  const m=GAMES[game.type||'x01'];
  if(!S.turns.length)return '<p class="empty">Les volées apparaîtront ici.</p>';
  return `<ul class="hist-list">${S.turns.slice(-max).reverse().map(t=>`<li class="${t.bust?'bust':t.win?'co':''}"><div class="h-who"><b>${esc(game.players[t.p].name)}</b><span>${t.darts.map(dLabel).join(' · ')}</span></div><div class="h-tot">${m.fmt(t)}</div><div class="h-rem">${game.type==='x01'?t.endRem:''}</div></li>`).join('')}</ul>`;
}
let padTarget=null;
function renderPad(tg){
  if(tg===undefined)tg=padTarget;else padTarget=tg;
  const pad=document.getElementById('pad');if(!pad)return;
  const nums=[];for(let n=1;n<=20;n++)nums.push(`<button data-act="pnum" data-v="${n}" aria-pressed="${padNum===n}" ${tg===n?'class="tgt"':''}>${n}</button>`);
  const dis=padNum?'':'disabled';
  pad.innerHTML=`<div class="pad-nums">${nums.join('')}</div>
    <div class="pad-mult"><button data-act="pm" data-v="1" ${dis}>Simple<span>${padNum?padNum:'choisir un n°'}</span></button><button data-act="pm" data-v="2" ${dis}>Double<span>${padNum?padNum*2:'×2'}</span></button><button data-act="pm" data-v="3" ${dis}>Triple<span>${padNum?padNum*3:'×3'}</span></button></div>
    <div class="pad-bull"><button class="b25" data-act="pb" data-v="1">Bull 25</button><button class="b50" data-act="pb" data-v="2">Bull 50</button><button data-act="miss">Raté · 0</button></div>`;
}

let toastT=null,endT=null;
function addDart(d){
  if(!game||game.finishedAt)return;
  const m=GAMES[game.type||'x01'];const before=m.run(game);if(before.over&&!pendingTurn(before))return;
  if(game.validated==null)game.validated=before.turns.length;
  if(pendingTurn(before)){toastMsg('Validez d\'abord la volée (ou corrigez avec ↶)');return}
  if(before.over)return;
  game.darts.push(d);saveGame();
  try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}
  const S=m.run(game);
  if(S.turns.length>before.turns.length&&!needConfirm())validate();
  else updateGame();
}
/* Valider la volée : moins de 3 fléchettes → les manquantes comptent comme ratées */
function validate(){
  const m=GAMES[game.type||'x01'];let S=m.run(game);
  if(S.turns.length<=game.validated){
    if(!S.cur||!S.cur.darts.length||S.over){updateGame();return}
    let guard=0;while(S.turns.length<=game.validated&&guard++<3){game.darts.push({seg:0,mult:0});S=m.run(game)}
  }
  while(game.validated<S.turns.length){react(S.turns[game.validated],S);game.validated++}
  saveGame();updateGame();
  if(S.over){clearTimeout(endT);endT=setTimeout(()=>{if(game&&GAMES[game.type||'x01'].run(game).over)finishGame()},2400)}
}
/* Fin de volée : signal sonore puis réaction de l'ambiance */
function ambOf(i){const pl=game.players[i];return (game.amb&&pl&&game.amb[pl.id])||(game.amb?'standard':(game.ambiance&&AMBIANCES[game.ambiance]?game.ambiance:'standard'))}
function react(t,S){
  const m=GAMES[game.type||'x01'],amb=ambOf(t.p),cat=m.cat(t,S),name=game.players[t.p].name;
  const choice=choosePhrase(amb,cat,{n:name,r:t.endRem!=null?t.endRem:''});
  showToast(t,cat,choice.text,m);
  Fx.run(cat);
  const dur=Sound.play(cat);
  const prefix=prefs.announce&&!Pack.has(amb)?m.say(t):'';
  setTimeout(()=>Voice.react(choice,prefix,amb),Math.round(dur*550)+60);
}
function showToast(t,cat,phrase,m){
  const el=document.getElementById('toast');if(!el)return;
  const tag=TAGS[cat]||'';
  el.className='toast'+(t.bust?' bust':'');
  el.innerHTML=`<div class="t-head"><span class="t-name">${esc(game.players[t.p].name)}</span><span class="t-val${m.fmt(t).length>4?' sm':''}">${m.fmt(t)}</span>${tag&&!t.bust?`<span class="t-tag">${tag}</span>`:''}</div><div class="t-say">${esc(phrase)}</div>`;
  requestAnimationFrame(()=>el.classList.add('show'));
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2400);
}
function undoDart(){
  if(!game||!game.darts.length)return;
  clearTimeout(endT);game.darts.pop();
  const n=GAMES[game.type||'x01'].run(game).turns.length;if(game.validated==null||game.validated>n)game.validated=n;
  if(game.finishedAt){unrecordTournament(game);delete game.finishedAt;store.set('history',store.get('history',[]).filter(h=>h.id!==game.id))}
  saveGame();
}
function undoTurn(){
  if(!game)return;const r=GAMES[game.type||'x01'].run(game);
  let k=r.cur&&r.cur.darts.length?r.cur.darts.length:r.turns.length?r.turns[r.turns.length-1].darts.length:0;
  while(k-->0)undoDart();
}
function finishGame(){
  game.finishedAt=Date.now();
  const S=GAMES[game.type||'x01'].run(game);
  if(S.winner!=null){const amb=ambOf(S.winner);const c=choosePhrase(amb,'winner',{n:game.players[S.winner].name,r:''});game.endPhrase={amb,...c}}
  else if(S.tie){const amb=ambOf(S.tie[0]);const c=choosePhrase(amb,'tie',{n:'',r:''});game.endPhrase={amb,...c}}
  saveGame();recordTournament(game,S);announceEnd();
  const h=store.get('history',[]).filter(x=>x.id!==game.id);h.unshift(game);store.set('history',h.slice(0,200));
  go('end');setTimeout(()=>Fx.celebrate(),250);
}
function announceEnd(){const e=game.endPhrase;if(!e)return;const d=Sound.play('checkout');setTimeout(()=>Voice.react(e,'',e.amb),Math.round(d*500)+100)}

/* ---------- Fin de partie ---------- */
function renderEnd(){
  const m=GAMES[game.type||'x01'],S=m.run(game),w=S.winner;const rows=m.statRows(S,game);
  const order=S.ranking||game.players.map((_,i)=>i);
  const head=w!=null?`${esc(game.players[w].name)} gagne`:`Égalité : ${(S.tie||[]).map(i=>esc(game.players[i].name)).join(' et ')}`;
  frame('Résultats',`<div class="col">
    <div class="win"><span class="crown">${esc(m.name)}${game.type==='x01'?' · '+game.start+' · '+OUT_LABEL[game.outRule]:''}</span><h1>${head}</h1>
      <p>${m.endLine(S,game)}</p>${game.endPhrase?`<p class="end-say">« ${esc(game.endPhrase.text)} »</p>`:''}</div>
    <div class="stats-wrap"><table class="stats"><thead><tr><th>#</th><th>Joueur</th>${m.statCols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
      <tbody>${order.map((i,k)=>`<tr class="${i===w?'w':''}"><td>${k+1}</td><td>${esc(game.players[i].name)}</td>${rows[i].map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    ${m.table?m.table(S,game):''}
    <p class="note">${m.statNote}</p>
    <div class="stack">${game.tournament?`<button class="btn btn-primary" data-act="topen" data-v="${game.tournament.tid}">Retour au tournoi</button>`:`<button class="btn btn-primary" data-act="rematch">Revanche</button><button class="btn btn-silver" data-act="new">Nouvelle partie</button>`}
      <button class="btn btn-ghost" data-act="endundo">Annuler la dernière fléchette</button></div>
  </div>`);
}

/* ---------- Fenêtres du bas ---------- */
function openSheet(html,label){

  bg.innerHTML=`<div class="sheet" role="dialog" aria-label="${label}">${html}</div>`;document.body.appendChild(bg);

function closeSheet(){document.querySelectorAll('.sheet-bg').forEach(e=>e.remove())}
function openHist(){

/* ---------- Écran toujours allumé pendant la partie ---------- */
async function requestWake(){try{if('wakeLock' in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){wakeLock=null}}
function releaseWake(){try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&screen==='game')requestWake()});

/* =========================================================
   Actions
   ========================================================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.classList.contains('sheet-bg')&&e.target!==b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='listen')e.stopPropagation();
  switch(a){
    case 'home':go('home');break;
    case 'players':go('players');break;
    case 'player':curPid=v;go('player');break;
    case 'history':go('history');break;
    case 'hgame':openGameSummary(v);break;
    case 'pcolor':{const pr=profById(curPid);pr.color=v;saveProfiles();renderPlayer();break}
    case 'pphotodel':{const pr=profById(curPid);delete pr.photo;saveProfiles();renderPlayer();break}
    case 'pdelask':document.getElementById('delBox').innerHTML='<p class="note" style="margin-bottom:8px">Le profil sera supprimé. Les parties passées restent dans l\'historique.</p><div class="row2"><button class="btn btn-danger" data-act="pdelyes">Confirmer la suppression</button><button class="btn btn-ghost" data-act="pdelno">Annuler</button></div>';break;
    case 'pdelno':renderPlayer();break;
    case 'pdelyes':profilesCache=profiles().filter(x=>x.id!==curPid);saveProfiles();go('players');break;
    case 'tournaments':go('tournaments');break;
    case 'tnew':tdraft=newTDraft();go('tnew');break;
    case 'topen':curTid=v;go('tournament');break;
    case 'tformat':tdraft.format=v;renderTNew();break;
    case 'tlegs':tdraft.legs=+v;renderTNew();break;
    case 'topt':tdraft.opts[b.dataset.k]=JSON.parse(v);renderTNew();break;
    case 'tpick':{const i=tdraft.pids.indexOf(v);if(i>=0)tdraft.pids.splice(i,1);else tdraft.pids.push(v);renderTNew();break}
    case 'tcreate':{const d=tdraft;const ids=shuffleSeeded(d.pids,Date.now()|0);const players=ids.map(id=>{const p=profById(id);return {id,name:p.name,color:p.color}});
      const t={id:uid(),name:(d.name||'Tournoi').trim(),format:d.format,legs:d.legs,game:{type:d.type,opts:d.opts},players,created:Date.now(),
        matches:d.format==='ko'?buildKO(ids):buildLeague(ids,d.legs)};saveT(t);curTid=t.id;go('tournament');break}
    case 'tplay':playMatch(v);break;
    case 'tdelask':document.getElementById('tDelBox').innerHTML='<div class="row2"><button class="btn btn-danger" data-act="tdelyes">Confirmer la suppression</button><button class="btn btn-ghost" data-act="tdelno">Annuler</button></div>';break;
    case 'tdelno':renderTournament();break;
    case 'tdelyes':saveTournaments(tournaments().filter(x=>x.id!==curTid));go('tournaments');break;
    case 'settings':go('settings');break;
    case 'quit':
      if(screen==='game'&&game&&!game.finishedAt&&game.darts.length)openQuit();
      else go('home');break;
    case 'pause':closeSheet();go('home');break;
    case 'abandon':game=null;saveGame();closeSheet();go('home');break;
    case 'new':draft=newDraft();go('setup');break;
    case 'resume':go('game');break;
    case 'gtype':draft.type=v;draft.opts=Object.assign(defaultOpts(v),(store.get('lastSetup',{}).opts||{})[v]||{});renderSetup();break;
    case 'opt':draft.opts[b.dataset.k]=JSON.parse(v);renderSetup();break;
    case 'pin':prefs.input=v;savePrefs();render();break;
    case 'padd':{const n=draft.players.length;draft.players.push({id:uid(),name:'Joueur '+(n+1),color:AV_COLORS[n%AV_COLORS.length]});renderSetup();const inp=document.getElementById('pn-'+draft.players[n].id);inp&&(inp.focus(),inp.select());break}
    case 'prec':{const n=draft.players.length;draft.players.push({id:uid(),name:v,color:AV_COLORS[n%AV_COLORS.length]});renderSetup();break}
    case 'pdel':draft.players.splice(+v,1);renderSetup();break;
    case 'pup':{const i=+v;[draft.players[i-1],draft.players[i]]=[draft.players[i],draft.players[i-1]];renderSetup();break}
    case 'shuffle':for(let i=draft.players.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[draft.players[i],draft.players[j]]=[draft.players[j],draft.players[i]]}renderSetup();break;
    case 'toamb':go('ambiance');break;
    case 'tosetup':go('setup');break;
    case 'pamb':{const pl=draft.players.find(x=>x.id===b.dataset.pid);if(!pl)break;const m=store.get('ambByName',{});
      m[pl.name]=(draftAmb(pl)===v&&v!=='standard')?'standard':v;store.set('ambByName',m);
      document.querySelectorAll(`.pchip[data-pid="${pl.id}"]`).forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===m[pl.name]));break}
    case 'ambreset':{const m=store.get('ambByName',{});draft.players.forEach(p=>m[p.name]='standard');store.set('ambByName',m);
      document.querySelectorAll('.pchip').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v==='standard'));break}
    case 'skin':prefs.skin=v;savePrefs();document.querySelectorAll('.skin').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v));break;
    case 'listen':Sound.unlock();Voice.warm();demo(v);break;
    case 'vtest':Sound.unlock();Voice._testing=true;Voice.runTest();break;
    case 'tog':prefs[v]=!prefs[v];savePrefs();b.setAttribute('aria-pressed',prefs[v]);if(v==='sounds'&&prefs.sounds)Sound.play('mid');break;
    case 'thr':{const [k,dv]=v.split(':');const t=prefs.thr.x01;t[k]=Math.max(k==='big'?40:0,Math.min(k==='big'?170:90,t[k]+ +dv));if(t.low>=t.big)t.low=t.big-10;savePrefs();renderSettings();break}
    case 'launch':{
      Sound.unlock();Voice.warm();
      const used=new Set();const pls=draft.players.map((p,i)=>{let nm=(p.name||'').trim()||('Joueur '+(i+1));let k=2;while(used.has(nm.toLowerCase()))nm=((p.name||'').trim()||'Joueur')+' '+k++;used.add(nm.toLowerCase());
        const pr=ensureProfile(nm,p.color);return {id:pr.id,name:pr.name,color:pr.color}});
      game=Object.assign({id:uid(),created:Date.now(),amb:Object.fromEntries(draft.players.map((p,i)=>[pls[i].id,draftAmb(p)])),players:pls,darts:[],validated:0},asGame(draft));if(GAMES[game.type].setup)GAMES[game.type].setup(game);
      const ls=store.get('lastSetup',{});store.set('lastSetup',{type:draft.type,opts:Object.assign({},ls.opts||{},{[draft.type]:draft.opts})});
      rememberPlayers(pls.map(p=>p.name));saveGame();go('game');break}
    case 'mode':{const wasPend=pendingTurn(GAMES[game.type||'x01'].run(game));prefs.input=v;savePrefs();padNum=null;if(wasPend&&!needConfirm())validate();}
      document.getElementById('board').hidden=v!=='board';document.getElementById('pad').hidden=v!=='pad';
      document.querySelectorAll('[data-act="mode"]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v));
      if(v==='board')drawBoard(document.getElementById('cv'));updateGame();break;
    case 'mute':prefs.muted=!prefs.muted;savePrefs();if(prefs.muted&&Voice.ok)try{speechSynthesis.cancel()}catch(e){}updateGame();break;
    case 'miss':padNum=null;addDart({seg:0,mult:0});break;
    case 'validate':padNum=null;validate();break;
    case 'undo':padNum=null;undoDart();updateGame();break;
    case 'undoturn':undoTurn();updateGame();break;
    case 'pnum':padNum=padNum===+v?null:+v;renderPad();break;
    case 'pm':if(padNum){const n=padNum;padNum=null;addDart({seg:n,mult:+v})}break;
    case 'pb':padNum=null;addDart({seg:25,mult:+v});break;
    case 'hist':openHist();break;
    case 'closesheet':closeSheet();break;
    case 'endundo':undoDart();go('game');break;
    case 'rematch':{const pls=game.players.slice(1).concat(game.players[0]);
      const old=game;game={id:uid(),created:Date.now(),type:old.type||'x01',opts:old.opts||{},amb:old.amb,ambiance:old.ambiance,players:pls,darts:[],validated:0};
      if(game.type==='x01'){game.start=old.start;game.outRule=old.outRule;game.inRule=old.inRule}if(GAMES[game.type].setup)GAMES[game.type].setup(game);saveGame();go('game');break}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){const t=e.target;if(false){e.preventDefault();t.click()}}
  if(screen!=='game')return;
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undoDart();updateGame()}
  if(e.key==='Escape')closeSheet();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='vol'){prefs.volume=+t.value;savePrefs();return}
  if(t.id==='tName'&&tdraft){tdraft.name=t.value;return}
  if(t.id==='rate'){prefs.rate=+t.value;savePrefs();return}
  const id=t.dataset&&t.dataset.pid;if(!id||!draft)return;
  const p=draft.players.find(x=>x.id===id);if(p){p.name=t.value;const av=t.previousElementSibling;if(av)av.textContent=(p.name.trim().charAt(0)||'?').toUpperCase()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='photoIn'&&e.target.files[0])setPhoto(e.target.files[0]);
  if(e.target.id==='tType'){tdraft.type=e.target.value;tdraft.opts=defaultOpts(tdraft.type);renderTNew()}
  if(e.target.id==='profName'){const pr=profById(curPid),nm=e.target.value.trim();if(pr&&nm&&!profiles().some(x=>x!==pr&&x.name.toLowerCase()===nm.toLowerCase())){pr.name=nm;saveProfiles();renderPlayer()}}
  if(e.target.id==='voiceSel'){prefs.voiceURI=e.target.value;savePrefs();updateVoiceBox()}
  if(e.target.id==='vol'||e.target.id==='rate')Sound.play('mid');
});

/* Démarrage : animation, puis reprise directe d'une partie interrompue */
if(game&&!game.finishedAt&&game.darts&&game.darts.length)screen='game';
render();splash();

/* Formulaires : ajout de joueur (écran Joueurs, création de tournoi) */
document.addEventListener('submit',e=>{const f=e.target.dataset&&e.target.dataset.form;if(!f)return;e.preventDefault();
  if(f==='addprof'){const v=document.getElementById('newProf').value.trim();if(!v)return;const pr=ensureProfile(v);curPid=pr.id;renderPlayers()}
  if(f==='taddp'){const v=document.getElementById('tNewP').value.trim();if(!v)return;const pr=ensureProfile(v);if(!tdraft.pids.includes(pr.id))tdraft.pids.push(pr.id);renderTNew()}
});
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}</script>
</body>
