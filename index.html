    case 'pb':padNum=null;addDart({seg:25,mult:+v});break;
    case 'hist':openHist();break;
    case 'closesheet':closeSheet();break;
    case 'endundo':undoDart();go('game');break;
    case 'rematch':{const pls=game.players.slice(1).concat(game.players[0]);
      gate(dartsKey(game.type||'x01',{start:game.start},game.players.length),dartsLabel(game.type||'x01',{start:game.start}),()=>{
      const old=game;game={id:uid(),created:Date.now(),type:old.type||'x01',opts:old.opts||{},amb:old.amb,ambiance:old.ambiance,players:pls,darts:[],validated:0};
      if(game.type==='x01'){game.start=old.start;game.outRule=old.outRule;game.inRule=old.inRule}if(GAMES[game.type].setup)GAMES[game.type].setup(game);saveGame();go('game');announceStart()});break}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){const t=e.target;if(false){e.preventDefault();t.click()}}
  if(screen!=='game')return;
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undoDart();updateGame()}
  if(e.key==='Escape')closeSheet();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='vol'){prefs.volume=+t.value;savePrefs();return}
  if(t.id==='tName'&&tdraft){tdraft.name=t.value;return}
  if(t.dataset&&t.dataset.free){const o=t.dataset.free==='opt'?draft.opts:tdraft.opts;const v=parseInt(t.value,10);
    if(v>=+t.min&&v<=+t.max){o[t.dataset.k]=v;t.closest('.opt-row').querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed','false'));
      const r=document.querySelector('.rule-text');if(r&&t.dataset.free==='opt')r.innerHTML=GAMES[draft.type].rules(asGame(draft))}return}
  if(t.dataset&&t.dataset.tname!=null&&odraft){odraft.teams[+t.dataset.tname].name=t.value;return}
  if(t.id==='rate'){prefs.rate=+t.value;savePrefs();return}
  const id=t.dataset&&t.dataset.pid;if(!id||!draft)return;
  const p=draft.players.find(x=>x.id===id);if(p){p.name=t.value;const av=t.previousElementSibling;if(av)av.textContent=(p.name.trim().charAt(0)||'?').toUpperCase()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='photoIn'&&e.target.files[0])setPhoto(e.target.files[0]);
  if(e.target.id==='tType'){tdraft.type=e.target.value;tdraft.opts=defaultOpts(tdraft.type);renderTNew()}
  if(e.target.id==='profName'){const pr=profById(curPid),nm=e.target.value.trim();if(pr&&nm&&!profiles().some(x=>x!==pr&&x.name.toLowerCase()===nm.toLowerCase())){pr.name=nm;saveProfiles();renderPlayer()}}
  if(e.target.id==='voiceSel'){prefs.voiceURI=e.target.value;savePrefs();updateVoiceBox()}
  if(e.target.id==='vol'||e.target.id==='rate')Sound.play('mid');
});

/* Démarrage : lien de mot de passe, compte, puis reprise d'une partie interrompue */
let recovery=false;
{const m=/^#reset=([a-f0-9]{20,})$/.exec(location.hash||'');if(m){resetToken=m[1];recovery=true}}
if(recovery)screen='reset';
else if(!Cloud.session())screen='auth';
else if(!owner())screen='welcome';
else if(game&&!game.finishedAt&&game.darts&&game.darts.length)screen='game';
{const m=/^#imp=(.+)$/.exec(location.hash||'');
  if(m){
    readImport(m[1]).then(()=>{screen='import';render()});screen='import'}}
armBack();render();splash();
if(!recovery)setTimeout(()=>Account.resume(),1200);
/* Lien de statistiques ouvert alors que l'appli est déjà ouverte */
window.addEventListener('hashchange',()=>{const m=/^#imp=(.+)$/.exec(location.hash||'');if(!m)return;
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}readImport(m[1]).then(()=>go('import'))});

/* Formulaires : ajout de joueur (écran Joueurs, création de tournoi) */
document.addEventListener('submit',e=>{const f=e.target.dataset&&e.target.dataset.form;if(!f)return;e.preventDefault();
  if(f==='welcome'){const v=document.getElementById('wName').value.trim();if(!v)return;const pr=ensureProfile(v);makeOwner(pr);go('home');return}
  if(f==='addprof'){const v=document.getElementById('newProf').value.trim();if(!v)return;const code=normCode(document.getElementById('newCode').value);
    if(code&&code.length!==6){toastMsg('Le code utilisateur fait 6 caractères');return}
    const other=code&&profByCode(code);if(other&&other.name.toLowerCase()!==v.toLowerCase()){toastMsg('Ce code est déjà celui de '+other.name);return}
    const pr=ensureProfile(v);if(code)pr.code=code;saveProfiles();renderPlayers()}
  if(f==='taddp'){const v=document.getElementById('tNewP').value.trim();if(!v)return;const pr=ensureProfile(v);if(!tdraft.pids.includes(pr.id))tdraft.pids.push(pr.id);renderTNew()}
});</script>
