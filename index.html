<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="ARROW by Elmagination : application de fléchettes entre amis.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARROW">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ARROW</title>
<meta name="theme-color" content="#0f1b2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout : barre fixe en haut, contenu défilant au milieu, barre de marque en bas. Jeu : cible au centre (téléphone), cible à gauche + panneau à droite (tablette/ordinateur). */
:root{
  /* Identité Elmagination : Deep Navy, Titanium Grey, Warm Bronze, champagne (Envy) */
  --bg:#0f1b2e; --bg-deep:#0a1322; --surface:#13233b; --surface-2:#1a2d4a; --surface-3:#22385a; --bar:#0c1627;
  --line:rgba(184,194,204,.13); --line-2:rgba(184,194,204,.26);
  --silver:#eef1f5; --silver-2:#b8c2cc; --muted:#7c8a9d;
  --copper:#d9a47e; --copper-hi:#f3dec2; --copper-lo:#9c5d34; --on-copper:#2a1408; --champagne:#f3dec2;
  --danger:#e9867b; --ok:#93d6b0;
  --ff-ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ff-num:'Jost','Futura','Avenir Next',system-ui,sans-serif;
  --ff-mark:'Jost','Futura','Avenir Next',system-ui,sans-serif;
  --r-md:14px; --r-lg:20px;
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(900px 520px at 50% 0%,var(--surface-2) 0%,transparent 70%);color:var(--silver);font-family:var(--ff-ui);font-size:15px;line-height:1.45;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--copper-hi);outline-offset:2px}
button:disabled{cursor:default}
input,select{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}

/* ---------- Barres fixes ---------- */
.appbar{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:58px;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:6px;background:var(--bar);border-bottom:1px solid var(--line);position:relative;z-index:20}
.bar-btn{display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 12px 0 10px;border-radius:12px;border:1px solid var(--line);color:var(--silver-2);font-weight:700;font-size:14px;justify-self:start}
.bar-btn svg{width:19px;height:19px;flex:none}
.bar-btn:hover{color:var(--silver);border-color:var(--line-2)}
.bar-btn[aria-current="page"]{color:var(--copper-hi);border-color:rgba(217,164,126,.45)}
.bar-btn.right{justify-self:end}
.bar-btn.quit{color:#ffc7bf;border-color:rgba(233,134,123,.35)}
.bar-title{text-align:center;font-family:var(--ff-mark);font-weight:500;font-size:16px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:52vw}
.bar-title .wm{font-weight:400;font-size:17px;letter-spacing:.34em;margin-right:-.34em}
.bar-title small{font-family:var(--ff-ui);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--copper-hi);margin-left:8px}
.view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-left:var(--gut-l);padding-right:var(--gut-r);position:relative}
.view.fixed{overflow:hidden}
.brandbar{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:6px;background:var(--bar);border-top:1px solid var(--line)}
.brandbar svg{width:22px;height:22px;flex:none}
.brand-name{font-family:var(--ff-mark);font-weight:500;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--silver-2)}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.04em}

/* ---------- Logo et lancement ---------- */
.logo-svg{display:block;width:100%;height:auto;overflow:visible}
.logo-svg .crack{opacity:.75}
.logo-svg.anim .fly{animation:fly .5s cubic-bezier(.18,.9,.3,1.12) both}
.logo-svg.anim .f1{animation-delay:.45s}
.logo-svg.anim .f2{animation-delay:.95s}
.logo-svg.anim .crack{opacity:0;animation:crack .25s ease-out forwards}
.logo-svg.anim .c1{animation-delay:.9s}
.logo-svg.anim .c2{animation-delay:1.4s}
.logo-svg.anim .lg-body{animation:thud .22s ease-out .9s,thud2 .22s ease-out 1.4s}
.logo-svg.anim .star{transform-box:view-box;transform-origin:150px 40px;animation:star .7s cubic-bezier(.2,1.4,.4,1) 1.65s both,twinkle 2.6s ease-in-out 2.4s infinite}
@keyframes fly{0%{transform:translateX(460px);opacity:0}12%{opacity:1}100%{transform:translateX(0);opacity:1}}
@keyframes crack{to{opacity:.75}}
@keyframes thud{40%{transform:translate(-2px,2px)}75%{transform:translate(1px,-1px)}}
@keyframes thud2{40%{transform:translate(-2px,1.5px)}75%{transform:translate(1px,-1px)}}
@keyframes star{0%{transform:scale(0) rotate(-90deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes twinkle{50%{transform:scale(.88) rotate(8deg);opacity:.85}}
.splash{position:fixed;inset:0;z-index:200;background:var(--bg);background-image:radial-gradient(700px 500px at 50% 40%,var(--surface-2),transparent 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;transition:opacity .45s ease}
.splash.out{opacity:0;pointer-events:none}
.splash .logo-wrap{width:min(320px,68vw)}
.splash .mark{font-size:clamp(40px,12vw,60px);opacity:0;animation:rise .6s ease-out 1.7s forwards}
.splash .byline{opacity:0;animation:rise .6s ease-out 1.95s forwards}
.splash .skip{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);letter-spacing:.06em}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mark{font-family:var(--ff-mark);font-weight:300;letter-spacing:.32em;margin-right:-.32em;line-height:1.05;background:linear-gradient(180deg,#ffffff 0%,#d6dce3 50%,#9aa5b1 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.byline{font-size:15px;letter-spacing:.02em;color:var(--silver-2)}
.hero{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.hero .logo-wrap{width:min(190px,52vw)}
.hero .mark{font-size:clamp(36px,10vw,50px)}

/* ---------- Mise en page des écrans défilants ---------- */
.col{max-width:560px;margin:0 auto;padding-block:20px 28px;display:flex;flex-direction:column;gap:22px}

/* ---------- Boutons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 20px;border-radius:var(--r-md);font-weight:700;font-size:16px;letter-spacing:.01em;transition:transform .08s ease,filter .15s;text-align:center}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,#f0c7b3 0%,#d9a47e 45%,#a86a55 100%);color:var(--on-copper);box-shadow:0 8px 24px -10px rgba(217,164,126,.6),inset 0 1px 0 rgba(255,255,255,.45)}
.btn-silver{background:linear-gradient(180deg,#f2f4f7 0%,#c4ccd5 55%,#9aa4af 100%);color:#16202e;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 18px -10px rgba(0,0,0,.6)}
.btn-ghost{border:1px solid var(--line-2);background:rgba(255,255,255,.02)}
.btn-ghost:hover{background:rgba(255,255,255,.05)}
.btn-danger{border:1px solid rgba(233,134,123,.45);color:#ffc7bf}
.btn[disabled]{opacity:.42}
.btn svg{width:18px;height:18px;flex:none}
.btn small{font-weight:600;font-size:12px;color:inherit;opacity:.7}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);color:var(--silver-2);flex:none}
.icon-btn:hover{color:var(--silver);border-color:var(--line-2)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.sm{width:36px;height:36px;border-radius:10px}
.icon-btn.sm svg{width:17px;height:17px}

/* ---------- Cartes / sections ---------- */
.sec-title{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--silver-2);font-weight:700;margin:0 0 10px}
.card{background:linear-gradient(180deg,var(--surface) 0%,rgba(19,35,59,.6) 100%);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.resume{display:flex;align-items:center;gap:14px;text-align:left;width:100%}
.resume .big{font-family:var(--ff-num);font-weight:400;font-size:34px;line-height:1;color:var(--copper-hi)}
.resume .meta{flex:1;min-width:0}
.resume .meta b{display:block}
.resume .meta span{color:var(--silver-2);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume svg{width:20px;height:20px;color:var(--silver-2)}
.roadmap{list-style:none;margin:0;padding:0;display:grid}
.roadmap li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.roadmap li:first-child{border-top:0}
.roadmap .dot{width:10px;height:10px;border-radius:50%;margin-top:5px;border:1.5px solid var(--muted)}
.roadmap .done .dot{background:var(--copper);border-color:var(--copper)}
.roadmap .now .dot{border-color:var(--copper);box-shadow:0 0 0 3px rgba(217,164,126,.2)}
.roadmap span{color:var(--silver-2)}
.stack{display:flex;flex-direction:column;gap:10px}
.note{font-size:13px;color:var(--muted);margin:0}

/* ---------- Préparation ---------- */
.games{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.game-opt{border:1px solid var(--line-2);border-radius:var(--r-md);padding:12px 6px;text-align:center;background:rgba(255,255,255,.02)}
.game-opt b{display:block;font-family:var(--ff-num);font-size:28px;line-height:1.1;font-weight:400}
.game-opt span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.game-opt[aria-pressed="true"]{border-color:var(--copper);background:rgba(217,164,126,.12)}
.game-opt[aria-pressed="true"] b{color:var(--copper-hi)}
.rule-text{margin:12px 0 0;color:var(--silver-2);font-size:14px}
.seg{display:flex;gap:4px;padding:4px;border-radius:var(--r-md);background:var(--bg-deep);border:1px solid var(--line)}
.seg button{flex:1;min-height:42px;border-radius:10px;font-weight:700;font-size:14px;color:var(--silver-2)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--silver);box-shadow:inset 0 0 0 1px var(--line-2)}
.opt-row{display:grid;gap:8px}
.opt-row+.opt-row{margin-top:16px}
.opt-row>label,.opt-row>.lbl{font-weight:700;font-size:14px}
.opt-row p{margin:0;font-size:13px;color:var(--muted)}
.players-list{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:8px}
.prow .ord{width:20px;text-align:center;font-family:var(--ff-num);font-size:17px;color:var(--muted)}
.prow input{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg-deep);padding:0 12px;font-weight:600}
.prow .icon-btn{width:40px;height:48px}
.av{--tone:#9c5d34;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--ff-mark);font-weight:500;font-size:15px;flex:none;color:var(--champagne);text-shadow:0 1px 1px rgba(0,0,0,.3);background:linear-gradient(180deg,rgba(255,255,255,.24) 0%,rgba(255,255,255,.04) 48%,rgba(0,0,0,.1) 100%),linear-gradient(135deg,color-mix(in oklab,var(--tone) 85%,white) 0%,var(--tone) 55%,color-mix(in oklab,var(--tone) 80%,black) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.08),0 3px 10px color-mix(in oklab,var(--tone) 35%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--silver-2)}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2 .btn{flex:1;min-height:46px;font-size:14px}
.soon{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.soon div{padding:10px 12px;border-radius:12px;border:1px dashed var(--line-2);font-size:13px;color:var(--muted)}
.soon div b{color:var(--silver-2);display:block;font-weight:700}

/* ---------- Ambiances et audio ---------- */
.amb-list{display:flex;flex-direction:column;gap:10px}
.amb{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start;text-align:left;width:100%;padding:16px;border-radius:var(--r-lg);border:1px solid var(--line-2);background:rgba(255,255,255,.02)}
.amb[aria-pressed="true"]{border-color:var(--copper);background:linear-gradient(160deg,rgba(217,164,126,.16),rgba(217,164,126,.04))}
.amb-name{font-family:var(--ff-mark);font-weight:500;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.amb[aria-pressed="true"] .amb-name{color:var(--copper-hi)}
.amb-tone{grid-column:1/-1;font-size:13px;color:var(--silver-2);margin-top:-4px}
.amb-ex{grid-column:1/-1;font-family:var(--ff-mark);font-style:italic;font-size:15px;color:var(--silver)}
.amb .listen{font-size:13px;font-weight:700;color:var(--copper-hi);border:1px solid rgba(217,164,126,.45);border-radius:999px;padding:7px 12px;display:inline-flex;gap:6px;align-items:center}
.amb .listen svg{width:15px;height:15px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0;padding-top:0}
.set-row .txt{min-width:0}
.set-row .txt b{display:block;font-size:14px}
.set-row .txt span{display:block;font-size:12.5px;color:var(--muted)}
.switch{width:52px;height:32px;border-radius:16px;padding:3px;display:flex;background:var(--surface-3);flex:none;justify-content:flex-start;transition:background .15s;border:1px solid var(--line-2)}
.switch::after{content:"";width:24px;height:24px;border-radius:12px;background:var(--silver-2);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.switch[aria-pressed="true"]{background:var(--copper);justify-content:flex-end;border-color:var(--copper)}
.switch[aria-pressed="true"]::after{background:#fff}
input[type=range]{width:100%;accent-color:var(--copper);height:28px}
select{width:100%;height:46px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg-deep);padding:0 10px}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);font-weight:800;font-size:18px}
.stepper output{min-width:44px;text-align:center;font-family:var(--ff-num);font-size:20px;font-variant-numeric:tabular-nums}
.voice-status{font-size:13px;color:var(--silver-2);padding:10px 12px;border-radius:12px;background:var(--bg-deep);border:1px solid var(--line)}
.voice-status.warn{color:#ffd6b8;border-color:rgba(217,164,126,.4)}

/* ---------- Écran de jeu ---------- */
.g{height:100%;display:grid;gap:10px;padding-block:10px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"players" "active" "stage" "ctrl"}
.g-side{display:contents}
.g-players{grid-area:players;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.g-players::-webkit-scrollbar{display:none}
.pl{flex:none;min-width:94px;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.pl .av{width:26px;height:26px;font-size:12px}
.pl .nm{font-size:12px;font-weight:700;color:var(--silver-2);max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.pl .rm{font-family:var(--ff-num);font-weight:500;font-size:19px;line-height:1;font-variant-numeric:tabular-nums}
.pl .avg{display:none}
.pl.on{border-color:var(--copper);background:rgba(217,164,126,.1)}
.pl.on .nm{color:var(--copper-hi)}
.act{grid-area:active;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"who who" "score darts" "co co";column-gap:14px;row-gap:4px;align-items:center;padding:10px 14px 10px;border-radius:var(--r-lg);background:linear-gradient(160deg,var(--surface-2) 0%,var(--surface) 100%);border:1px solid var(--line-2);position:relative;overflow:hidden}
.act::after{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,transparent,var(--copper),transparent);opacity:.7}
.act-who{grid-area:who;display:flex;align-items:center;gap:8px;min-width:0}
.act-who .av{width:28px;height:28px;font-size:12px}
.act-name{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.act-turn{font-size:12px;color:var(--silver-2);white-space:nowrap}
.act-score{grid-area:score;font-family:var(--ff-num);font-weight:500;font-size:clamp(56px,17vw,96px);line-height:.95;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 2px 24px rgba(160,190,240,.18)}
.act-darts{grid-area:darts;display:flex;flex-direction:column;gap:6px;min-width:0}
.slots{display:grid;grid-template-columns:repeat(3,1fr) 1.1fr;gap:5px}
.slot{height:40px;border-radius:10px;border:1px dashed var(--line-2);display:grid;place-items:center;font-family:var(--ff-num);font-weight:500;font-size:18px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot.fill{border-style:solid;background:var(--bg-deep);color:var(--silver)}
.slot.next{border-color:var(--copper);color:var(--copper)}
.slot.tot{border:0;background:rgba(217,164,126,.14);color:var(--copper-hi)}
.prev{font-size:12px;color:var(--silver-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev b{color:var(--silver)}
.act-co{grid-area:co;font-size:13px;color:var(--silver-2);min-height:18px}
.act-co b{color:var(--copper-hi);font-weight:800}
.stage{grid-area:stage;position:relative;container-type:size;min-height:0}
.board{position:absolute;inset:0;margin:auto;width:min(100cqw,100cqh);height:min(100cqw,100cqh);touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.board canvas,.board svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.board canvas{border-radius:50%;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
.board svg{pointer-events:none;overflow:visible}
.board .ph{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#2a2622 0 74%,#121212 75%);display:grid;place-items:center;color:var(--silver-2);font-size:13px}
.pad{position:absolute;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:8px;max-width:620px;margin:0 auto}
.pad-nums{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:minmax(0,1fr);gap:6px}
.pad button{border-radius:12px;background:var(--surface);border:1px solid var(--line);font-family:var(--ff-num);font-weight:500;font-size:clamp(19px,4.6vw,26px);min-height:38px;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--surface-3)}
.pad-nums button[aria-pressed="true"]{background:var(--copper);color:var(--on-copper);border-color:var(--copper)}
.pad-mult,.pad-bull{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad-mult button{min-height:52px;font-family:var(--ff-ui);font-size:15px;font-weight:800}
.pad-mult button span{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.pad-mult button:not(:disabled){border-color:rgba(217,164,126,.55)}
.pad-mult button:disabled{opacity:.4}
.pad-bull button{min-height:48px;font-family:var(--ff-ui);font-size:15px;font-weight:800}
.pad-bull .b25{color:#7fd3a0}
.pad-bull .b50{color:#ff8f86}

/* =========================================================
   Géométrie réglementaire de la cible (millimètres, norme WDF)
   ========================================================= */
const SECTORS=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const G={db:6.35,b:15.9,ti:99,to:107,di:162,do:170,num:196,rim:225};

function hitTest(x,y){
  const r=Math.hypot(x,y);
  if(r>G.rim) return null;                 // en dehors de la cible : annuler
  if(r<=G.db) return {seg:25,mult:2};
  if(r<=G.b)  return {seg:25,mult:1};
  if(r>G.do)  return {seg:0,mult:0};       // anneau des numéros : raté
  const a=Math.atan2(x,-y)*180/Math.PI;    // 0° en haut, sens horaire
  const idx=Math.floor((((a+9)%360)+360)%360/18);
  const mult=r<G.ti?1:r<=G.to?3:r<G.di?1:2;
  return {seg:SECTORS[idx],mult};
}
function zoneCenter(seg,mult){
  if(!seg) return null;
  if(seg===25) return mult===2?{x:0,y:0}:{x:0,y:-11.1};
  const ang=SECTORS.indexOf(seg)*18*Math.PI/180;
  const r=mult===3?103:mult===2?166:134;
  return {x:r*Math.sin(ang),y:-r*Math.cos(ang)};
}
const dScore=d=>d.seg*d.mult;
function dLabel(d){
  if(!d.seg) return 'Raté';
  if(d.seg===25) return d.mult===2?'Bull':'25';
  return (d.mult===3?'T':d.mult===2?'D':'')+d.seg;
}
function dLong(d){
  if(!d) return 'Annuler';
  if(!d.seg) return 'Hors zone · 0';
  if(d.seg===25) return d.mult===2?'Bull (centre) · 50':'Bull extérieur · 25';
  const n=['','Simple','Double','Triple'][d.mult];
  return d.mult===1?`Simple ${d.seg}`:`${n} ${d.seg} · ${dScore(d)}`;
}

/* =========================================================
   Dessin réaliste de la cible (canvas)
   ========================================================= */
function h2(x,y){let n=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)|0;n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967296}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=h2(xi,yi),b=h2(xi+1,yi),c=h2(xi,yi+1),d=h2(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  // éclairage et biseau extérieur

  ctx.fillStyle=lg;ctx.beginPath();ctx.arc(0,0,G.rim,0,7);ctx.fill();

/* =========================================================
   Moteur X01 (301 / 501 / 701 / 901)
   L'état est recalculé à partir de la liste des fléchettes :
   annuler = retirer la dernière fléchette, toujours fiable.
   ========================================================= */
function replay(g){
  const n=g.players.length;
  const P=g.players.map(()=>({rem:g.start,open:g.inRule!=='double'}));
  const turns=[];let cur=null,p=0,winner=null;
  for(const d of g.darts){
    if(winner!==null)break;
    if(!cur)cur={p,darts:[],startRem:P[p].rem,startOpen:P[p].open,bust:false,checkout:false};
    const st=P[p];let pts=dScore(d),counted=true;
    if(!st.open){if(d.mult===2)st.open=true;else{pts=0;counted=false}}
    const nr=st.rem-pts;
    const fin=g.outRule==='single'?true:g.outRule==='master'?d.mult>=2:d.mult===2;
    cur.darts.push({...d,pts,counted});
    let end=false;
    if(nr<0||(g.outRule!=='single'&&nr===1)||(nr===0&&!fin)){cur.bust=true;st.rem=cur.startRem;st.open=cur.startOpen;end=true}
    else if(nr===0){st.rem=0;cur.checkout=true;winner=p;end=true}
    else{st.rem=nr;if(cur.darts.length===3)end=true}
    if(end){cur.endRem=st.rem;cur.total=cur.bust?0:cur.startRem-st.rem;turns.push(cur);cur=null;if(winner===null)p=(p+1)%n}
  }
  return {P,turns,cur,p,winner};
}
const OUT_LABEL={double:'Sortie double',single:'Sortie simple',master:'Sortie master'};
const OUT_LONG={double:'La dernière fléchette doit tomber dans un double (ou le Bull 50).',single:'N\'importe quelle zone peut finir la partie.',master:'La dernière fléchette doit tomber dans un double ou un triple.'};

/* Suggestion de finition */
const THROWS=(()=>{const t=[];for(let n=20;n>=1;n--)t.push({seg:n,mult:3});t.push({seg:25,mult:1});for(let n=20;n>=1;n--)t.push({seg:n,mult:1});for(let n=20;n>=1;n--)t.push({seg:n,mult:2});t.push({seg:25,mult:2});return t})();
const PREF_D=[20,16,18,10,8,12,14,6,4,2,19,17,15,13,11,9,7,5,3,1];
function finishers(out){
  if(out==='single')return THROWS.slice().sort((a,b)=>b.mult===2?1:-1);
  const f=PREF_D.map(n=>({seg:n,mult:2}));f.push({seg:25,mult:2});
  if(out==='master')for(let n=20;n>=1;n--)f.push({seg:n,mult:3});
  return f;
}
function oneThrow(v){ // meilleure fléchette « préparation » pour une valeur
  if(v<=0)return null;if(v<=20)return {seg:v,mult:1};if(v===25)return {seg:25,mult:1};if(v===50)return {seg:25,mult:2};
  if(v%3===0&&v<=60)return {seg:v/3,mult:3};if(v%2===0&&v<=40)return {seg:v/2,mult:2};return null}
function suggest(rem,left,out){
  if(left<1||rem<2&&out!=='single'||rem<1)return null;
  if(rem>(out==='single'?180:170))return null;
  const F=finishers(out);
  for(const f of F)if(dScore(f)===rem)return [f];
  if(left>=2)for(const f of F){const a=oneThrow(rem-dScore(f));if(a)return [a,f]}
  if(left>=3)for(const t of THROWS.slice(0,21)){const r=rem-dScore(t);if(r<2)continue;for(const f of F){const a=oneThrow(r-dScore(f));if(a)return [t,a,f]}}
  return null;
}

/* Statistiques (formules documentées sur l'écran de fin) */
function statsFor(g,r){
  return g.players.map((pl,i)=>{
    const ts=r.turns.filter(t=>t.p===i);
    const darts=ts.reduce((a,t)=>a+t.darts.length,0),pts=ts.reduce((a,t)=>a+t.total,0);
    const f9=ts.slice(0,3),f9d=f9.reduce((a,t)=>a+t.darts.length,0),f9p=f9.reduce((a,t)=>a+t.total,0);
    const co=ts.find(t=>t.checkout);
    return {name:pl.name,darts,points:pts,avg:darts?pts/darts*3:0,first9:f9d?f9p/f9d*3:0,
      best:ts.reduce((a,t)=>Math.max(a,t.total),0),c180:ts.filter(t=>t.total===180).length,
      c140:ts.filter(t=>t.total>=140&&t.total<180).length,c100:ts.filter(t=>t.total>=100&&t.total<140).length,
      busts:ts.filter(t=>t.bust).length,checkout:co?co.total:null,rem:r.P[i].rem};
  });
}

/* =========================================================
   Catalogue des jeux — chaque jeu est un module indépendant.
   Un module recalcule tout l'état à partir de la liste des
   fléchettes (annuler = retirer la dernière, toujours fiable).
   ========================================================= */
const CR_NUMS=[20,19,18,17,16,15,25];

/* Moteur commun : volées de 3 fléchettes, joueurs à tour de rôle */
function runTurns(g,h){
  const n=g.players.length,S=h.init(g);S.round=g.players.map(()=>0);S.over=false;S.winner=null;
  const turns=[];let cur=null,p=0;
  for(const d of g.darts){
    if(S.over)break;
    if(!cur)cur={p,darts:[],round:S.round[p]+1};
    const res=h.dart(S,p,d,cur)||{};cur.darts.push({...d,...res});
    if(S.over||cur.end||cur.darts.length===3){
      h.endTurn&&h.endTurn(S,p,cur);S.round[p]++;turns.push(cur);cur=null;
      if(!S.over){p=(p+1)%n;let k=0;while(h.skip&&h.skip(S,p)&&k++<n)p=(p+1)%n;h.check&&h.check(S,p)}
    }
  }
  S.turns=turns;S.cur=cur;S.p=p;S.n=n;return S;
}
/* Classement final : meilleur score (ou plus petit si asc), égalité possible */
function rankBy(S,vals,asc,tie){
  const idx=vals.map((_,i)=>i).sort((a,b)=>(asc?vals[a]-vals[b]:vals[b]-vals[a])||(tie?tie(b)-tie(a):0));
  S.over=true;S.ranking=idx;
  const top=idx.filter(i=>vals[i]===vals[idx[0]]&&(!tie||tie(i)===tie(idx[0])));
  S.winner=top.length===1?idx[0]:null;S.tie=top.length>1?top:null;
}
const sumPts=t=>t.darts.reduce((a,x)=>a+(x.pts||0),0);
const plural=(n,w)=>`${n} ${w}${n>1?'s':''}`;
function pointsCat(t,S){
  if(t.win)return 'checkout';const s=t.total;if(s===180)return 'c180';if(s===0)return 'zero';
  let big=prefs.thr.x01.big,low=prefs.thr.x01.low;
  if(prefs.adaptive){const prev=S.turns.filter(x=>x.p===t.p&&x!==t);const d=prev.reduce((a,x)=>a+x.darts.length,0);
    if(d>=9){const avg=prev.reduce((a,x)=>a+(x.bust?0:x.total),0)/d*3;big=Math.max(60,Math.round(avg*1.45));low=Math.min(45,Math.round(avg*.55))}}
  if(s>=140)return 'huge';if(s>=big)return 'big';if(s<=low)return 'low';return 'mid';
}
function hitsCat(t,k){if(t.win)return 'checkout';if(k>=6)return 'huge';if(k>=4)return 'big';if(k>=2)return 'mid';if(k===1)return 'low';return 'zero'}

    dart(S,p,d,cur){const tg=cur.round,hit=d.seg===tg?d.mult:0,pts=hit*tg;S.tot[p]+=pts;
      if(hit){cur.m=cur.m||{};cur.m[hit]=1}
      if(g.opts.shanghai&&cur.m&&cur.m[1]&&cur.m[2]&&cur.m[3]){cur.shanghai=true;cur.win=true;S.over=true;S.winner=p;
        S.ranking=[p,...g.players.map((_,i)=>i).filter(i=>i!==p).sort((a,b)=>S.tot[b]-S.tot[a])]}
      return {pts,hit}},
    endTurn(S,p,t){t.total=sumPts(t);t.k=t.darts.reduce((a,x)=>a+x.hit,0)},
    check(S,np){if(S.round[np]>=R)rankBy(S,S.tot)}})},
  big:(S,p)=>S.tot[p],chip:(S,i)=>S.tot[i],chipSub:(S,i)=>`manche ${Math.min(S.round[i]+1,99)}`,
  target:(S,p)=>S.over?null:S.round[p]+1,
  hint:(S,p,g)=>{const tg=S.round[p]+1;return `Cible : <b>${tg}</b> · manche ${tg} sur ${g.opts.rounds}`},
  curTotal:cd=>cd.reduce((a,d)=>a+d.pts,0),fmt:t=>t.shanghai?'SHANGHAI':String(t.total),unit:()=>'',
  cat:t=>t.shanghai?'checkout':hitsCat(t,t.k),say:t=>t.shanghai?'Shanghai ! ':(t.total?t.total+' ! ':''),
  resume:(S,p)=>`score ${S.tot[p]}`,
  statCols:['Total','Touches','Meilleure manche','Fléch.'],
  statRows(S,g){return g.players.map((_,i)=>{const ts=S.turns.filter(t=>t.p===i);return [S.tot[i],ts.reduce((a,t)=>a+t.darts.filter(d=>d.hit).length,0),ts.reduce((a,t)=>Math.max(a,t.total),0),ts.reduce((a,t)=>a+t.darts.length,0)]})},
  statNote:'Touches = fléchettes tombées dans le numéro de la manche.',
  endLine(S){const t=S.turns[S.turns.length-1];return t&&t.shanghai?`Shanghai à la manche ${t.round} !`:'Fin des manches : le plus grand total l\'emporte.'}},

/* ---------------- Tour de l'horloge ---------------- */
atc:{id:'atc',name:'Tour de l\'horloge',short:'Horloge',group:'Entraînement',sub:'De 1 à 20 dans l\'ordre',
  rules:g=>`Touchez les numéros dans l'ordre, de 1 à 20${g.opts.bull?', puis le Bull pour terminer':''}. Tant que le numéro n'est pas touché, on reste dessus. ${g.opts.mult?'Un double fait avancer de deux numéros, un triple de trois.':'Simple, double ou triple : chaque touche fait avancer d\'un numéro.'} Le premier à terminer gagne.`,
  opts:[{k:'bull',label:'Finir par le Bull',vals:[[true,'Oui'],[false,'Non']],def:true},
        {k:'mult',label:'Doubles et triples font sauter des numéros',vals:[[false,'Non'],[true,'Oui']],def:false}],
  title:g=>`Tour de l'horloge<small>${g.opts.bull?'1 → 20 → Bull':'1 → 20'}</small>`,
  run(g){const last=g.opts.bull?21:20;return runTurns(g,{
    init:g=>({pos:g.players.map(()=>1),last}),
    dart(S,p,d){const pos=S.pos[p],tg=pos<=20?pos:25;let hit=0;
      if(d.seg===tg&&d.mult){hit=1;S.pos[p]=tg===25?22:Math.min(pos+(g.opts.mult?d.mult:1),21)}
      if(S.pos[p]>last){S.over=true;S.winner=p;S.ranking=[p,...g.players.map((_,i)=>i).filter(i=>i!==p).sort((a,b)=>S.pos[b]-S.pos[a])]}
      return {hit}},
    endTurn(S,p,t){t.total=t.darts.reduce((a,x)=>a+x.hit,0);if(S.winner===p)t.win=true}})},
  big:(S,p)=>atcLabel(S,p,true),chip:(S,i)=>atcLabel(S,i,false),
  chipSub:(S,i)=>`${Math.min(S.pos[i],S.last+1)-1} validés sur ${S.last}`,
  target:(S,p)=>S.over||S.pos[p]>S.last?null:S.pos[p]>20?25:S.pos[p],
  hint:(S,p)=>S.pos[p]>S.last?'Terminé !':`Visez : <b>${S.pos[p]>20?'le Bull':S.pos[p]}</b>`,
  curTotal:cd=>cd.reduce((a,d)=>a+d.hit,0),fmt:t=>plural(t.total,'touche'),unit:()=>'',
  cat:t=>t.win?'checkout':t.total===3?'huge':t.total===2?'big':t.total===1?'mid':'zero',
  say:()=>'',resume:(S,p)=>`vise ${S.pos[p]>20?'le Bull':S.pos[p]}`,
  statCols:['Atteint','Touches','Réussite','Fléch.'],
  statRows(S,g){return g.players.map((_,i)=>{const ts=S.turns.filter(t=>t.p===i),d=ts.reduce((a,t)=>a+t.darts.length,0),h=ts.reduce((a,t)=>a+t.total,0);const v=S.pos[i];
    return [v>S.last?'Terminé':v>20?'Bull':v,h,d?Math.round(h/d*100)+' %':'–',d]})},
  statNote:'Réussite = touches ÷ fléchettes lancées.',
  endLine(S,g){const ts=S.turns.filter(t=>t.p===S.winner);return `Terminé en ${ts.reduce((a,t)=>a+t.darts.length,0)} fléchettes`}},
};

function pointsGame(id,name,group,sub,def,vals,rules){return {id,name,short:name,group,sub,rules:()=>rules,

    endTurn(S,p,t){t.total=sumPts(t)},
    check(S,np){if(S.round[np]>=R)rankBy(S,S.tot)}})},
  big:(S,p)=>S.tot[p],chip:(S,i)=>S.tot[i],
  chipSub:(S,i)=>{const ts=S.turns.filter(t=>t.p===i);return ts.length?`moy. ${(S.tot[i]/ts.length).toFixed(1)}`:'moy. –'},
  hint:(S,p,g)=>`Volée <b>${Math.min(S.round[p]+1,g.opts.rounds)}</b> sur ${g.opts.rounds}`,

  cat:(t,S)=>pointsCat(t,S),say:t=>t.total===180?'':(t.total===0?'Zéro. ':t.total+' ! '),
  resume:(S,p)=>`score ${S.tot[p]}`,
  statCols:['Total','Moy. volée','Meilleure','100+','180','Fléch.'],

  statNote:'Moyenne par volée = total ÷ nombre de volées jouées.',
  endLine:()=>'Fin des volées : le plus grand total l\'emporte.'}}

function cricketGame(cut){
  const id=cut?'cutthroat':'cricket',name=cut?'Cut-Throat Cricket':'Cricket';
  return {id,name,short:cut?'Cut-Throat':'Cricket',group:'Cricket',sub:cut?'Les points vont aux adversaires':'Fermer 15 à 20 et le Bull',
  rules:g=>cut
    ?`Même objectif que le Cricket : fermer 15, 16, 17, 18, 19, 20 et le Bull en les touchant trois fois (un double compte deux fois, un triple trois fois). Mais une fois votre numéro fermé, les points en trop sont donnés aux adversaires qui ne l'ont pas encore fermé. Le plus petit score gagne quand tous ses numéros sont fermés.`
    :`Il faut fermer 15, 16, 17, 18, 19, 20 et le Bull en les touchant trois fois chacun (un double compte deux fois, un triple trois fois). Une fois un numéro fermé, on marque des points dessus tant qu'un adversaire ne l'a pas fermé. Gagne celui qui a tout fermé avec au moins autant de points que les autres.`,
  opts:[{k:'rounds',label:'Limite de manches',vals:[[15,'15'],[20,'20'],[25,'25'],[0,'Aucune']],def:20,help:v=>v?`Après ${v} manches, ${cut?'le plus petit':'le plus grand'} score gagne.`:'La partie continue jusqu\'à la victoire.'}],
  title:g=>`${cut?'Cut-Throat':'Cricket'}<small>${g.opts.rounds?g.opts.rounds+' manches':'sans limite'}</small>`,
  run(g){const R=g.opts.rounds,n=g.players.length;
    const closedAll=(S,i)=>CR_NUMS.every(k=>S.marks[i][k]>=3);
    const marksTot=(S,i)=>CR_NUMS.reduce((a,k)=>a+S.marks[i][k],0);
    const checkWin=(S)=>{for(let i=0;i<n;i++){if(!closedAll(S,i))continue;const o=S.pts.filter((_,j)=>j!==i);
      if(cut?S.pts[i]<=Math.min(...o,Infinity):S.pts[i]>=Math.max(...o,-Infinity)){S.over=true;S.winner=i;
        S.ranking=[i,...S.pts.map((_,j)=>j).filter(j=>j!==i).sort((a,b)=>cut?S.pts[a]-S.pts[b]:S.pts[b]-S.pts[a])];return true}}return false};
    return runTurns(g,{
      init:g=>({marks:g.players.map(()=>Object.fromEntries(CR_NUMS.map(k=>[k,0]))),pts:g.players.map(()=>0)}),
      dart(S,p,d){if(!CR_NUMS.includes(d.seg)||!d.mult)return {mk:0,pts:0};
        const k=d.seg,m=S.marks[p],before=m[k],used=Math.min(d.mult,Math.max(0,3-before));m[k]=Math.min(3,before+d.mult);
        const extra=d.mult-used;let pts=0,scored=0;
        if(extra>0){const val=(k===25?25:k)*extra,open=S.pts.map((_,j)=>j).filter(j=>j!==p&&S.marks[j][k]<3);
          if(open.length){scored=extra;if(cut){open.forEach(j=>S.pts[j]+=val)}else S.pts[p]+=val;pts=val}}
        checkWin(S);return {mk:used+scored,pts}},
      endTurn(S,p,t){t.total=t.darts.reduce((a,x)=>a+x.mk,0);t.pts=sumPts(t);if(S.winner===p)t.win=true},
      check(S,np){if(R&&S.round[np]>=R)rankBy(S,S.pts,cut,i=>marksTot(S,i))}})},
  big:(S,p)=>S.pts[p],chip:(S,i)=>S.pts[i],
  chipSub:(S,i)=>{const d=S.turns.filter(t=>t.p===i).reduce((a,t)=>a+t.darts.length,0),m=S.turns.filter(t=>t.p===i).reduce((a,t)=>a+t.total,0);return d?`${(m/d*3).toFixed(2)} marques/volée`:'–'},
  hint:(S,p)=>`<div class="crow">${CR_NUMS.map(k=>`<span class="cm m${S.marks[p][k]}${CR_NUMS.every(j=>j===k)?'':''}${S.marks.some((mm,j)=>j!==p&&mm[k]<3)?'':' dead'}"><i>${k===25?'B':k}</i>${markIcon(S.marks[p][k])}</span>`).join('')}</div>`,
  table(S,g){return `<div class="ctab-wrap"><table class="ctab"><thead><tr><th></th>${g.players.map(pl=>`<th>${esc(pl.name)}</th>`).join('')}</tr></thead><tbody>${CR_NUMS.map(k=>`<tr><th>${k===25?'Bull':k}</th>${g.players.map((_,i)=>`<td class="m${S.marks[i][k]}">${markIcon(S.marks[i][k])}</td>`).join('')}</tr>`).join('')}<tr class="pts"><th>Points</th>${g.players.map((_,i)=>`<td>${S.pts[i]}</td>`).join('')}</tr></tbody></table></div>`},
  curTotal:cd=>cd.reduce((a,d)=>a+d.mk,0),fmt:t=>plural(t.total,'marque'),unit:()=>'',
  cat:t=>hitsCat(t,t.total),say:t=>t.total>=2&&!t.win?`${t.total} marques ! `:'',
  resume:(S,p)=>`${S.pts[p]} points`,
  statCols:['Points','Fermés','Marques','Marques/volée','Fléch.'],
  statRows(S,g){return g.players.map((_,i)=>{const ts=S.turns.filter(t=>t.p===i),d=ts.reduce((a,t)=>a+t.darts.length,0),m=ts.reduce((a,t)=>a+t.total,0);
    return [S.pts[i],CR_NUMS.filter(k=>S.marks[i][k]>=3).length+' / 7',m,d?(m/d*3).toFixed(2):'–',d]})},
  statNote:'Marques/volée = marques comptées ÷ fléchettes lancées × 3 (une marque = une touche utile sur 15 à 20 ou le Bull ; double = 2, triple = 3).',
  endLine(S){return S.ranking&&S.turns.length&&S.turns[S.turns.length-1].win?'Tous les numéros fermés !':'Limite de manches atteinte.'}};
}
function atcLabel(S,i,big){const v=S.pos[i];return v>S.last?'✓':v>20?(big?'Bull':'B'):v}
function markIcon(m){
  if(m>=3)return '<svg viewBox="0 0 20 20" aria-label="fermé"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5.5 14.5l9-9M5.5 5.5l9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  if(m===2)return '<svg viewBox="0 0 20 20" aria-label="2 marques"><path d="M5 15L15 5M5 5l10 10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
  if(m===1)return '<svg viewBox="0 0 20 20" aria-label="1 marque"><path d="M6 15L14 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
  return '<svg viewBox="0 0 20 20" aria-label="aucune marque"></svg>';
}

function shuffleSeeded(arr,seed){const R=rng(seed);const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function seedOf(g){let h=0;for(const c of g.id||'arrow')h=Math.imul(h^c.charCodeAt(0),16777619);return h}
const others=(g,p)=>g.players.map((_,i)=>i).filter(i=>i!==p);
/* Tentative de finition (121, finitions au hasard) : double obligatoire pour finir */
function finishDart(cur,d){const pts=dScore(d),nr=cur.rem-pts;
  if(nr<0||nr===1||(nr===0&&d.mult!==2)){cur.bust=true;cur.end=true;return {pts:0}}
  cur.rem=nr;if(nr===0){cur.ok=true;cur.end=true}return {pts}}

GAMES.baseball={id:'baseball',name:'Baseball',short:'Baseball',group:'Points',sub:'9 manches, un numéro par manche',
  rules:g=>`Neuf manches : à la manche 1 on vise le 1, à la manche 2 le 2, et ainsi de suite. Seul le numéro de la manche rapporte : simple = 1 point, double = 2, triple = 3. ${g.opts.bull?'Le Bull vaut un « home run » : 4 points à chaque manche. ':''}Le plus grand total après ${g.opts.rounds} manches gagne.`,
  opts:[{k:'rounds',label:'Nombre de manches',vals:[[9,'9'],[5,'5'],[20,'20']],def:9},{k:'bull',label:'Bull = home run (4 points)',vals:[[false,'Non'],[true,'Oui']],def:false}],
  title:g=>`Baseball<small>${g.opts.rounds} manches</small>`,

    init:g=>({tot:g.players.map(()=>0)}),
    dart(S,p,d,cur){const tg=cur.round;let pts=0;if(d.seg===tg&&d.mult)pts=d.mult;else if(g.opts.bull&&d.seg===25)pts=4;S.tot[p]+=pts;return {pts,hit:pts?1:0}},
    endTurn(S,p,t){t.total=sumPts(t)},check(S,np){if(S.round[np]>=R)rankBy(S,S.tot)}})},

  target:(S,p)=>S.over?null:S.round[p]+1,hint:(S,p,g)=>`Manche ${S.round[p]+1} sur ${g.opts.rounds} · visez le <b>${S.round[p]+1}</b>`,
  curTotal:cd=>cd.reduce((a,d)=>a+d.pts,0),fmt:t=>plural(t.total,'point'),
  cat:t=>hitsCat(t,t.total),say:t=>t.total>=2?`${t.total} points ! `:'',resume:(S,p)=>`${S.tot[p]} points`,
  statCols:['Points','Meilleure manche','Touches','Fléch.'],
  statRows(S,g){return g.players.map((_,i)=>{const ts=S.turns.filter(t=>t.p===i);return [S.tot[i],ts.reduce((a,t)=>Math.max(a,t.total),0),ts.reduce((a,t)=>a+t.darts.filter(d=>d.hit).length,0),ts.reduce((a,t)=>a+t.darts.length,0)]})},
  statNote:'Simple = 1 point, double = 2, triple = 3 sur le numéro de la manche.',endLine:()=>'Fin des manches : le plus grand total l\'emporte.'};

GAMES.golf={id:'golf',name:'Golf',short:'Golf',group:'Points',sub:'Le moins de coups possible',
  rules:g=>`Chaque trou correspond à un numéro : trou 1 = le 1, trou 2 = le 2… On a trois fléchettes par trou. Le score du trou est le numéro de la fléchette qui touche le numéro visé (1, 2 ou 3 coups). Si aucune ne touche, le trou compte ${g.opts.pen} coups. Le plus petit total après ${g.opts.rounds} trous gagne.`,
  opts:[{k:'rounds',label:'Nombre de trous',vals:[[9,'9'],[18,'18']],def:9},{k:'pen',label:'Coups si le trou est manqué',vals:[[4,'4'],[5,'5']],def:5}],
  title:g=>`Golf<small>${g.opts.rounds} trous</small>`,
  run(g){const R=g.opts.rounds;return runTurns(g,{
    init:g=>({tot:g.players.map(()=>0)}),
    dart(S,p,d,cur){const tg=((cur.round-1)%20)+1;if(d.seg===tg&&d.mult){cur.hitAt=cur.darts.length+1;cur.end=true;return {hit:1}}return {hit:0}},
    endTurn(S,p,t){t.total=t.hitAt||g.opts.pen;S.tot[p]+=t.total},check(S,np){if(S.round[np]>=R)rankBy(S,S.tot,true)}})},
  big:(S,p)=>S.tot[p],chip:(S,i)=>S.tot[i],chipSub:(S,i)=>`trou ${S.round[i]+1}`,
  target:(S,p)=>S.over?null:((S.round[p])%20)+1,hint:(S,p,g)=>`Trou ${S.round[p]+1} sur ${g.opts.rounds} · visez le <b>${(S.round[p]%20)+1}</b>`,

  statNote:'Score d\'un trou = rang de la fléchette qui touche (1, 2 ou 3), ou la pénalité si aucune ne touche. Le plus petit total gagne.',endLine:()=>'Le plus petit nombre de coups l\'emporte.'};

GAMES.killer={id:'killer',name:'Killer',short:'Killer',group:'Points',sub:'Devenir tueur et éliminer',
  rules:g=>`Chaque joueur reçoit un numéro au hasard (affiché sur son nom) et ${plural(g.opts.lives,'vie')}. Touchez d'abord ${g.opts.become==='double'?'le double':'n\'importe quelle zone'} de votre numéro pour devenir « tueur ». Ensuite, chaque double d'un adversaire lui retire une vie. ${g.opts.self?'Attention : un tueur qui touche son propre double perd une vie. ':''}Un joueur sans vie est éliminé ; le dernier en jeu gagne.`,
  opts:[{k:'lives',label:'Nombre de vies',vals:[[3,'3'],[5,'5'],[7,'7']],def:3},
        {k:'become',label:'Pour devenir tueur',vals:[['double','Double de son numéro'],['any','Son numéro']],def:'double'},
        {k:'self',label:'Toucher son propre double fait perdre une vie',vals:[[true,'Oui'],[false,'Non']],def:true}],
  setup(g){g.assign=shuffleSeeded([...Array(20)].map((_,i)=>i+1),seedOf(g)).slice(0,g.players.length);while(g.assign.length<g.players.length)g.assign.push(g.assign[g.assign.length%20])},
  title:g=>`Killer<small>${plural(g.opts.lives,'vie')}</small>`,
  run(g){const n=g.players.length;const num=g.assign||g.players.map((_,i)=>i+1);return runTurns(g,{
    init:g=>({lives:g.players.map(()=>g.opts.lives),killer:g.players.map(()=>false),num,out:[]}),
    skip:(S,p)=>S.lives[p]<=0,
    dart(S,p,d,cur){let kills=0;cur.kills=cur.kills||0;
      if(!d.mult||d.seg===25)return {k:0};
      if(!S.killer[p]){if(d.seg===S.num[p]&&(g.opts.become==='any'||d.mult===2)){S.killer[p]=true;cur.made=true;return {k:0,hit:1}}return {k:0}}
      if(d.mult!==2)return {k:0};
      for(let j=0;j<n;j++){if(S.num[j]!==d.seg||S.lives[j]<=0)continue;
        if(j===p){if(!g.opts.self)continue;S.lives[p]--;cur.self=true;if(S.lives[p]<=0){S.out.push(p);cur.end=true}}
        else{S.lives[j]--;kills++;if(S.lives[j]<=0)S.out.push(j)}}
      cur.kills+=kills;
      const alive=S.lives.map((l,i)=>l>0?i:-1).filter(i=>i>=0);
      if(alive.length<=1){S.over=true;S.winner=alive.length?alive[0]:null;S.ranking=[...alive,...S.out.slice().reverse()];if(S.winner===p)cur.win=true}
      return {k:kills,hit:kills?1:0}},
    endTurn(S,p,t){t.total=t.kills||0}})},
  big:(S,p)=>`${Math.max(0,S.lives[p])}<span class="heart">♥\uFE0E</span>`,chip:(S,i)=>S.lives[i]>0?`${S.lives[i]}<span class="heart">♥\uFE0E</span>`:'✕',
  chipSub:(S,i)=>`n° ${S.num[i]}${S.killer[i]?' · tueur':''}`,
  target:(S,p)=>S.over||S.killer[p]?null:S.num[p],
  hint:(S,p,g)=>{if(!S.killer[p])return `Votre numéro : <b>${S.num[p]}</b> · touchez ${g.opts.become==='double'?'son double':'ce numéro'} pour devenir tueur`;
    const t=others(g,p).filter(j=>S.lives[j]>0).map(j=>`<b>D${S.num[j]}</b> ${esc(g.players[j].name)}`);return `Tueur ! Visez : ${t.join(' · ')}`},
  curTotal:cd=>cd.reduce((a,d)=>a+(d.k||0),0),fmt:t=>t.made&&!t.total?'Tueur !':t.self&&!t.total?'Touché soi-même':plural(t.total,'vie')+' prise'+(t.total>1?'s':''),
  cat:t=>t.win?'checkout':t.total>=2?'huge':t.total===1||t.made?'big':t.self?'low':'zero',say:t=>t.made?'Nouveau tueur ! ':'',
  resume:(S,p)=>`${S.lives[p]} vies`,
  statCols:['Numéro','Vies','Vies prises','Fléch.'],
  statRows(S,g){return g.players.map((_,i)=>{const ts=S.turns.filter(t=>t.p===i);return [S.num[i],Math.max(0,S.lives[i]),ts.reduce((a,t)=>a+t.total,0),ts.reduce((a,t)=>a+t.darts.length,0)]})},
  statNote:'Le classement suit l\'ordre d\'élimination.',endLine:()=>'Dernier joueur encore en vie.'};

GAMES.bobs27={id:'bobs27',name:'Bob\'s 27',short:'Bob\'s 27',group:'Entraînement',sub:'Les doubles, de 1 à 20 puis Bull',
  rules:g=>`Exercice aux doubles. On commence avec 27 points et on vise le double 1, puis le double 2, jusqu'au double 20 et au Bull. Chaque double touché ajoute sa valeur (D5 = 10 points). Si aucune des trois fléchettes ne touche, on retire la valeur du double. ${g.opts.stop?'Sous zéro, le joueur est éliminé.':'On continue même sous zéro.'}`,
  opts:[{k:'stop',label:'Éliminé sous zéro',vals:[[true,'Oui'],[false,'Non']],def:true}],
  title:()=>'Bob\'s 27<small>D1 → Bull</small>',
  run(g){const n=g.players.length;return runTurns(g,{
    init:g=>({sc:g.players.map(()=>27),dead:g.players.map(()=>false)}),
    skip:(S,p)=>S.dead[p]||S.round[p]>=21,
    dart(S,p,d,cur){const tg=cur.round<=20?cur.round:25;const hit=d.seg===tg&&d.mult===2;return {hit:hit?1:0,pts:hit?tg*2:0}},
    endTurn(S,p,t){const tg=t.round<=20?t.round:25,h=t.darts.reduce((a,x)=>a+x.hit,0);t.k=h;t.total=h?h*tg*2:-tg*2;S.sc[p]+=t.total;if(g.opts.stop&&S.sc[p]<0)S.dead[p]=true},
    check(S,np){const live=S.sc.map((_,i)=>i).filter(i=>!S.dead[i]&&S.round[i]<21);if(!live.length)rankBy(S,S.sc,false,i=>S.round[i])}})},
  big:(S,p)=>S.sc[p],chip:(S,i)=>S.dead[i]?'✕':S.sc[i],chipSub:(S,i)=>S.dead[i]?'éliminé':S.round[i]>=21?'terminé':`vise D${S.round[i]<20?S.round[i]+1:'Bull'}`,
  target:(S,p)=>S.over?null:(S.round[p]<20?S.round[p]+1:25),
  hint:(S,p)=>{const r=S.round[p]+1;return r<=20?`Visez le <b>double ${r}</b> (${r*2} points)`:'Visez le <b>Bull</b> (50 points)'},
  curTotal:cd=>cd.reduce((a,d)=>a+d.pts,0),fmt:t=>(t.total>0?'+':'')+t.total,
  cat:t=>t.k>=2?'huge':t.k===1?'big':'zero',say:t=>t.k?`${t.k} double${t.k>1?'s':''} ! `:'',resume:(S,p)=>`${S.sc[p]} points`,
  statCols:['Score','Doubles touchés','Réussite','Atteint'],
  statRows(S,g){return g.players.map((_,i)=>{const ts=S.turns.filter(t=>t.p===i),h=ts.reduce((a,t)=>a+t.k,0),d=ts.reduce((a,t)=>a+t.darts.length,0);return [S.sc[i],h,d?Math.round(h/d*100)+' %':'–',S.dead[i]?`éliminé (D${Math.min(S.round[i],20)})`:S.round[i]>=21?'Bull':'D'+S.round[i]]})},
  statNote:'Réussite = doubles touchés ÷ fléchettes lancées.',endLine:()=>'Le meilleur score l\'emporte.'};

GAMES.c121={id:'c121',name:'121 Challenge',short:'121',group:'Entraînement',sub:'Finir 121 en trois fléchettes',
  rules:g=>`Exercice de finition. On part de 121 et on a trois fléchettes pour tomber exactement à zéro en finissant par un double. Réussi : on passe à ${121+g.opts.step}, puis au suivant. ${g.opts.fail==='back'?'Raté : on revient à 121.':'Raté : on retente le même score.'} Après ${g.opts.rounds} tentatives, le plus haut score atteint gagne.`,
  opts:[{k:'rounds',label:'Nombre de tentatives',vals:[[10,'10'],[20,'20'],[30,'30']],def:10},
        {k:'step',label:'Progression après une réussite',vals:[[1,'+1'],[5,'+5'],[10,'+10']],def:1},
        {k:'fail',label:'Après un échec',vals:[['stay','On retente'],['back','Retour à 121']],def:'stay'}],
  title:g=>`121 Challenge<small>${g.opts.rounds} tentatives</small>`,
  run(g){const R=g.opts.rounds;return runTurns(g,{
    init:g=>({tg:g.players.map(()=>121),best:g.players.map(()=>0),ok:g.players.map(()=>0)}),
    dart(S,p,d,cur){if(cur.rem==null){cur.rem=S.tg[p];cur.start=S.tg[p]}return finishDart(cur,d)},
    endTurn(S,p,t){if(t.ok){S.ok[p]++;S.best[p]=Math.max(S.best[p],S.tg[p]);S.tg[p]=Math.min(170,S.tg[p]+g.opts.step)}else if(g.opts.fail==='back')S.tg[p]=121;t.total=t.ok?t.start:0},
    check(S,np){if(S.round[np]>=R)rankBy(S,S.best,false,i=>S.ok[i])}})},
  big:(S,p)=>S.cur&&S.cur.p===p&&S.cur.rem!=null?S.cur.rem:S.tg[p],chip:(S,i)=>S.tg[i],chipSub:(S,i)=>`${plural(S.ok[i],'réussite')}`,
  hint:(S,p,g,cd)=>{const rem=S.cur&&S.cur.p===p&&S.cur.rem!=null?S.cur.rem:S.tg[p];const sug=suggest(rem,3-cd.length,'double');return `Objectif ${S.tg[p]} · tentative ${S.round[p]+1}/${g.opts.rounds}`+(sug?` · <b>${sug.map(dLabel).join(' · ')}</b>`:'')},
  curTotal:cd=>cd.reduce((a,d)=>a+(d.pts||0),0),fmt:t=>t.ok?`✓ ${t.start}`:t.bust?'bust':'raté',
  cat:t=>t.ok?'checkout':t.bust?'bust':'low',say:()=>'',resume:(S,p)=>`objectif ${S.tg[p]}`,
  statCols:['Meilleur','Réussites','Taux','Fléch.'],
  statRows(S,g){return g.players.map((_,i)=>{const ts=S.turns.filter(t=>t.p===i);return [S.best[i]||'–',S.ok[i],ts.length?Math.round(S.ok[i]/ts.length*100)+' %':'–',ts.reduce((a,t)=>a+t.darts.length,0)]})},
  statNote:'Taux = finitions réussies ÷ tentatives.',endLine:()=>'Le plus haut score fini l\'emporte.'};

function ringTraining(id,name,mult){const lbl=mult===2?'double':'triple';
  return {id,name,short:name,group:'Entraînement',sub:`Viser les ${lbl}s un par un`,
  rules:g=>`Exercice de précision : à chaque volée, on vise le ${lbl} indiqué (${mult===2?'de 1 à 20 puis le Bull':'de 1 à 20'}${g.opts.order==='random'?', dans un ordre tiré au hasard':', dans l\'ordre'}). Chaque ${lbl} touché rapporte 1 point. Le plus grand nombre de touches gagne.`,
  opts:[{k:'order',label:'Ordre',vals:[['seq','Dans l\'ordre'],['random','Au hasard']],def:'seq'}],
  setup(g){const base=[...Array(20)].map((_,i)=>i+1);if(mult===2)base.push(25);g.seq=g.opts.order==='random'?shuffleSeeded(base,seedOf(g)):base},
  title:g=>`${name}<small>${g.seq?g.seq.length:20} cibles</small>`,
  run(g){const seq=g.seq||[...Array(20)].map((_,i)=>i+1),R=seq.length;return runTurns(g,{
    init:g=>({hits:g.players.map(()=>0),seq}),
    dart(S,p,d,cur){const tg=seq[cur.round-1];const hit=d.seg===tg&&d.mult===(tg===25?2:mult)?1:0;S.hits[p]+=hit;return {hit}},
    endTurn(S,p,t){t.total=t.darts.reduce((a,x)=>a+x.hit,0)},check(S,np){if(S.round[np]>=R)rankBy(S,S.hits)}})},
  big:(S,p)=>S.hits[p],chip:(S,i)=>S.hits[i],chipSub:(S,i)=>{const d=S.turns.filter(t=>t.p===i).reduce((a,t)=>a+t.darts.length,0);return d?Math.round(S.hits[i]/d*100)+' % de réussite':'–'},
  target:(S,p)=>S.over?null:S.seq[S.round[p]],
  hint:(S,p)=>{const tg=S.seq[S.round[p]];return `Visez : <b>${tg===25?'le Bull (50)':(mult===2?'D':'T')+tg}</b> · cible ${S.round[p]+1}/${S.seq.length}`},
  curTotal:cd=>cd.reduce((a,d)=>a+d.hit,0),fmt:t=>plural(t.total,'touche'),
  cat:t=>t.total===3?'huge':t.total===2?'big':t.total===1?'mid':'zero',say:()=>'',resume:(S,p)=>`${S.hits[p]} touches`,
  statCols:['Touches','Réussite','Fléch.'],
  statRows(S,g){return g.players.map((_,i)=>{const d=S.turns.filter(t=>t.p===i).reduce((a,t)=>a+t.darts.length,0);return [S.hits[i],d?Math.round(S.hits[i]/d*100)+' %':'–',d]})},
  statNote:`Réussite = ${lbl}s touchés ÷ fléchettes lancées.`,endLine:()=>'Le plus grand nombre de touches l\'emporte.'}}
GAMES.doubles=ringTraining('doubles','Entraînement doubles',2);
GAMES.triples=ringTraining('triples','Entraînement triples',3);

GAMES.rcheck={id:'rcheck',name:'Finitions au hasard',short:'Finitions',group:'Entraînement',sub:'Un score à finir à chaque volée',
  rules:g=>`À chaque volée, un score à finir est tiré au hasard (${{easy:'entre 2 et 60',mid:'entre 61 et 100',hard:'entre 101 et 170'}[g.opts.level]}). On a trois fléchettes pour tomber exactement à zéro, en finissant par un double. Tous les joueurs reçoivent les mêmes scores. Le plus grand nombre de finitions réussies gagne.`,
  opts:[{k:'level',label:'Difficulté',vals:[['easy','Facile'],['mid','Moyen'],['hard','Difficile']],def:'mid'},{k:'rounds',label:'Nombre de finitions',vals:[[10,'10'],[20,'20']],def:10}],
  setup(g){const [a,b]={easy:[2,60],mid:[61,100],hard:[101,170]}[g.opts.level];const bad=[159,162,163,165,166,168,169];const R=rng(seedOf(g));const out=[];
    while(out.length<g.opts.rounds){const v=a+Math.floor(R()*(b-a+1));if(!bad.includes(v))out.push(v)}g.seq=out},
  title:g=>`Finitions au hasard<small>${g.opts.rounds}</small>`,
  run(g){const seq=g.seq||[...Array(g.opts.rounds)].map(()=>40),R=seq.length;return runTurns(g,{
    init:g=>({ok:g.players.map(()=>0),seq}),
    dart(S,p,d,cur){if(cur.rem==null){cur.rem=seq[cur.round-1];cur.start=cur.rem}return finishDart(cur,d)},
    endTurn(S,p,t){if(t.ok)S.ok[p]++;t.total=t.ok?t.start:0},check(S,np){if(S.round[np]>=R)rankBy(S,S.ok)}})},
  big:(S,p)=>S.cur&&S.cur.p===p&&S.cur.rem!=null?S.cur.rem:(S.seq[S.round[p]]??'–'),chip:(S,i)=>`${S.ok[i]}✓`,chipSub:(S,i)=>`finition ${Math.min(S.round[i]+1,S.seq.length)}/${S.seq.length}`,
  hint:(S,p,g,cd)=>{const rem=S.cur&&S.cur.p===p&&S.cur.rem!=null?S.cur.rem:S.seq[S.round[p]];const sug=suggest(rem,3-cd.length,'double');return sug?`Finition : <b>${sug.map(dLabel).join(' · ')}</b>`:`Pas de finition en ${plural(3-cd.length,'fléchette')}`},
  curTotal:cd=>cd.reduce((a,d)=>a+(d.pts||0),0),fmt:t=>t.ok?`✓ ${t.start}`:t.bust?'bust':'raté',
  cat:t=>t.ok?'checkout':t.bust?'bust':'low',say:()=>'',resume:(S,p)=>`${S.ok[p]} réussies`,
  statCols:['Réussies','Taux','Meilleure','Fléch.'],
  statRows(S,g){return g.players.map((_,i)=>{const ts=S.turns.filter(t=>t.p===i);return [S.ok[i],ts.length?Math.round(S.ok[i]/ts.length*100)+' %':'–',ts.reduce((a,t)=>Math.max(a,t.ok?t.start:0),0)||'–',ts.reduce((a,t)=>a+t.darts.length,0)]})},
  statNote:'Taux = finitions réussies ÷ finitions tentées.',endLine:()=>'Le plus de finitions réussies l\'emporte.'};

/* =========================================================
   Animations humoristiques sur la cible (sans texte)
   La cible elle-même bouge (tourne, tremble, sautille, s'affaisse…)
   et des éléments dessinés apparaissent par-dessus.
   ========================================================= */
const Fx={
  parts:[],raf:0,cv:null,ctx:null,host:null,
  enabled(){return prefs.fx&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches},
  /* Prépare le calque de dessin sur la scène (ou plein écran) */
  layer(host){
    if(this.host!==host||!this.cv||!this.cv.isConnected){
      this.cv=document.createElement('canvas');this.cv.className='fxc';this.ctx=this.cv.getContext('2d');
      host.appendChild(this.cv);this.host=host;this.parts=[]}
    const r=host.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
    this.cv.width=Math.round(r.width*dpr);this.cv.height=Math.round(r.height*dpr);this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.W=r.width;this.H=r.height;return r;
  },
  /* Centre et rayon de la cible dans le calque */
  geo(){const b=document.getElementById('board'),hr=this.host.getBoundingClientRect();
    if(b&&!b.hidden){const r=b.getBoundingClientRect();return {x:r.left-hr.left+r.width/2,y:r.top-hr.top+r.height/2,R:r.width/2}}
    return {x:this.W/2,y:this.H/2,R:Math.min(this.W,this.H)/2.4}},
  board(cls){const b=document.getElementById('board');if(!b||b.hidden)return;
    b.classList.remove('fx-spin','fx-shake','fx-bounce','fx-flex','fx-nod','fx-droop','fx-yawn','fx-pulse');void b.offsetWidth;b.classList.add('fx-'+cls);
    clearTimeout(b._fx);b._fx=setTimeout(()=>b.classList.remove('fx-'+cls),2600)},
  run(kind){
    if(!this.enabled())return;const stage=document.getElementById('gStage');if(!stage)return;
    this.layer(stage);const g=this.geo();
    switch(kind){
      case 'c180':this.board('spin');this.fireworks(g,4);this.confetti(140,['#f3dec2','#d9a47e','#ffffff','#ffd36b']);break;
      case 'checkout':this.board('pulse');this.confetti(160);this.trophy(g);break;
      case 'huge':this.board('flex');this.stars(g,34,1.25);this.ring(g);break;
      case 'big':this.board('bounce');this.stars(g,16,.9);break;
      case 'mid':this.board('nod');this.stars(g,6,.55);break;
      case 'low':this.board('droop');this.cloud(g);break;
      case 'zero':this.board('yawn');this.tumbleweed(g);break;
      case 'bust':this.board('shake');this.boom(g);break;
    }
    this.loop();
  },
  /* Célébration de fin de partie, plein écran */
  celebrate(){if(!this.enabled())return;const host=document.getElementById('view');if(!host)return;
    this.layer(host);this.confetti(220);this.fireworks({x:this.W/2,y:this.H*.35,R:this.W/3},3);this.loop()},
  loop(){if(this.raf)return;const step=t=>{const c=this.ctx;c.clearRect(0,0,this.W,this.H);
      const now=performance.now();this.parts=this.parts.filter(p=>now-p.t0<p.life);
      for(const p of this.parts)p.draw(c,(now-p.t0)/1000,p);
      if(this.parts.length)this.raf=requestAnimationFrame(step);else{this.raf=0;c.clearRect(0,0,this.W,this.H)}};
    this.raf=requestAnimationFrame(step)},
  add(life,draw,extra){this.parts.push(Object.assign({t0:performance.now(),life,draw},extra))},

  confetti(n,cols=['#d9a47e','#f3dec2','#c9d1dd','#e3262c','#16a05a','#8fb4e6']){
    for(let i=0;i<n;i++){const x=Math.random()*this.W,vy=90+Math.random()*160,vx=(Math.random()-.5)*60,col=cols[i%cols.length],w=5+Math.random()*5,h=8+Math.random()*7,rot=Math.random()*6,spin=(Math.random()-.5)*10,delay=Math.random()*.6;
      this.add(3200,(c,t)=>{t-=delay;if(t<0)return;const y=-20+vy*t+40*t*t,xx=x+vx*t+Math.sin(t*4+i)*18;c.save();c.translate(xx,y);c.rotate(rot+spin*t);c.scale(1,Math.cos(t*6+i));c.fillStyle=col;c.fillRect(-w/2,-h/2,w,h);c.restore()})}},
  stars(g,n,scale){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(.5+Math.random()*.9)*g.R*1.4*scale,sz=4+Math.random()*7*scale,col=['#ffd36b','#f3dec2','#ffffff','#d9a47e'][i%4];
      this.add(1100,(c,t)=>{const k=t/1.1,d=sp*(1-Math.pow(1-k,3));c.globalAlpha=1-k;star(c,g.x+Math.cos(a)*d,g.y+Math.sin(a)*d,sz*(1-k*.4),col,t*4);c.globalAlpha=1})}},
  ring(g){this.add(800,(c,t)=>{const k=t/.8;c.strokeStyle=`rgba(243,222,194,${1-k})`;c.lineWidth=6*(1-k)+1;c.beginPath();c.arc(g.x,g.y,g.R*(1+k*.5),0,7);c.stroke()})},
  fireworks(g,n){for(let f=0;f<n;f++){const tx=g.x+(Math.random()-.5)*g.R*1.8,ty=g.y-g.R*(.3+Math.random()*.7),delay=f*.32,col=['#ffd36b','#ff6fa8','#7fe7ff','#f3dec2'][f%4],sx=tx+(Math.random()-.5)*60;
      this.add(2400,(c,t)=>{t-=delay;if(t<0)return;
        if(t<.45){const k=t/.45,y=this.H+10-(this.H+10-ty)*k,x=sx+(tx-sx)*k;c.fillStyle='#fff';c.beginPath();c.arc(x,y,2.2,0,7);c.fill();return}
        const tt=t-.45;for(let i=0;i<36;i++){const a=i/36*Math.PI*2,d=tt*140*(1-tt*.25),x=tx+Math.cos(a)*d,y=ty+Math.sin(a)*d+tt*tt*60;c.globalAlpha=Math.max(0,1-tt/1.8);c.fillStyle=col;c.beginPath();c.arc(x,y,2.4,0,7);c.fill()}c.globalAlpha=1})}},
  /* Petit nuage grognon qui pleut sur la cible */
  cloud(g){const cx=g.x,cy=g.y-g.R*.55,s=g.R/120;
    this.add(2800,(c,t)=>{const k=Math.min(1,t/.35),out=t>2.3?(t-2.3)/.5:0,a=k*(1-out);c.save();c.globalAlpha=a;c.translate(cx+Math.sin(t*2)*6*s,cy-(1-k)*30);c.scale(s,s);
      c.fillStyle='#6f7a8c';for(const [x,y,r] of [[-38,6,24],[-12,-10,30],[20,-4,26],[42,8,20],[0,10,26]]){c.beginPath();c.arc(x,y,r,0,7);c.fill()}
      c.fillStyle='#8c97a8';for(const [x,y,r] of [[-14,-14,20],[18,-8,16]]){c.beginPath();c.arc(x,y,r,0,7);c.fill()}
      c.strokeStyle='#2b3340';c.lineWidth=3;c.lineCap='round';c.beginPath();c.moveTo(-18,4);c.lineTo(-8,8);c.moveTo(18,4);c.lineTo(8,8);c.stroke();
      c.beginPath();c.arc(0,24,8,Math.PI*1.15,Math.PI*1.85);c.stroke();c.restore();
      if(t>.35&&t<2.4){c.save();c.globalAlpha=a*.85;c.strokeStyle='#8fc2ff';c.lineWidth=2;for(let i=0;i<16;i++){const x=cx+(i-8)*7*s+Math.sin(i*7)*4,yy=cy+20*s+((t*420+i*53)%(g.R*1.3));c.beginPath();c.moveTo(x,yy);c.lineTo(x-2,yy+10*s);c.stroke()}c.restore()}})},
  /* Boule de foin qui traverse la cible en roulant (le silence du désert) */
  tumbleweed(g){const s=g.R/110,y0=g.y+g.R*.45,r=22*s;
    this.add(2600,(c,t)=>{const k=t/2.6,x=-40+(this.W+80)*k,y=y0-Math.abs(Math.sin(t*5))*26*s;c.save();c.translate(x,y);c.rotate(t*7);
      c.strokeStyle='#b0884e';c.lineWidth=1.6;for(let i=0;i<9;i++){c.beginPath();c.ellipse(0,0,r,r*.6,i*.7,0,Math.PI*1.7);c.stroke()}
      c.strokeStyle='#d8b37a';c.lineWidth=1;for(let i=0;i<5;i++){c.beginPath();c.ellipse(0,0,r*.7,r*.35,i*1.3,.4,Math.PI*1.6);c.stroke()}c.restore();
      if(Math.sin(t*5)>.9){c.fillStyle='rgba(216,179,122,.35)';c.beginPath();c.arc(x-8,y0+r*.6,6*s,0,7);c.fill()}})},
  /* Explosion façon dessin animé + fissures sur la cible */
  boom(g){const n=10;for(let i=0;i<n;i++){const a=i/n*Math.PI*2+Math.random()*.3,d=g.R*(.15+Math.random()*.25),r0=g.R*(.12+Math.random()*.1);
      this.add(1500,(c,t)=>{const k=t/1.5;c.globalAlpha=Math.max(0,1-k*1.1);c.fillStyle=k<.15?'#ffd36b':k<.3?'#ff8a3d':'#5b6170';c.beginPath();c.arc(g.x+Math.cos(a)*d*(1+k),g.y+Math.sin(a)*d*(1+k)-k*20,r0*(1+k*1.4),0,7);c.fill();c.globalAlpha=1})}
    this.add(400,(c,t)=>{const k=t/.4;c.fillStyle=`rgba(255,240,200,${.8*(1-k)})`;c.beginPath();c.arc(g.x,g.y,g.R*(.3+k*.8),0,7);c.fill()});
    const cracks=[...Array(7)].map((_,i)=>{const a=i/7*Math.PI*2+Math.random()*.4;const pts=[[0,0]];let x=0,y=0;for(let j=0;j<5;j++){const aa=a+(Math.random()-.5)*.8;x+=Math.cos(aa)*g.R*.14;y+=Math.sin(aa)*g.R*.14;pts.push([x,y])}return pts});
    this.add(1900,(c,t)=>{const k=Math.min(1,t/.2),out=t>1.4?(t-1.4)/.5:0;c.strokeStyle=`rgba(10,10,12,${.85*(1-out)})`;c.lineWidth=2.4;c.lineJoin='round';
      for(const pts of cracks){c.beginPath();const m=Math.max(2,Math.ceil(pts.length*k));pts.slice(0,m).forEach(([x,y],j)=>j?c.lineTo(g.x+x,g.y+y):c.moveTo(g.x+x,g.y+y));c.stroke()}})},
  /* Trophée qui tombe et rebondit */
  trophy(g){const s=g.R/100;
    this.add(2800,(c,t)=>{const k=Math.min(1,t/.6),bounce=k<1?1-Math.pow(1-k,3):1,y=g.y-g.R*1.6+(g.R*1.6)*bounce-Math.abs(Math.sin(Math.min(t,1.2)*9))*(t<1.2?12*(1.2-t):0),a=t>2.3?1-(t-2.3)/.5:1;
      c.save();c.globalAlpha=a;c.translate(g.x,y);c.scale(s,s);const gr=c.createLinearGradient(-30,-40,30,40);gr.addColorStop(0,'#fff1c4');gr.addColorStop(.5,'#e6b54a');gr.addColorStop(1,'#9a6a1c');
      c.fillStyle=gr;c.strokeStyle='#5a3d0e';c.lineWidth=2;
      c.beginPath();c.moveTo(-28,-40);c.lineTo(28,-40);c.quadraticCurveTo(28,8,6,16);c.lineTo(6,28);c.lineTo(18,34);c.lineTo(18,42);c.lineTo(-18,42);c.lineTo(-18,34);c.lineTo(-6,28);c.lineTo(-6,16);c.quadraticCurveTo(-28,8,-28,-40);c.closePath();c.fill();c.stroke();
      c.lineWidth=5;c.strokeStyle='#d4a03c';c.beginPath();c.arc(-30,-22,12,Math.PI*.5,Math.PI*1.5);c.stroke();c.beginPath();c.arc(30,-22,12,-Math.PI*.5,Math.PI*.5);c.stroke();
      star(c,0,-14,11,'#fff8e0',t*2);c.restore()})}
};
function star(c,x,y,r,col,rot){c.save();c.translate(x,y);c.rotate(rot||0);c.fillStyle=col;c.beginPath();for(let i=0;i<10;i++){const rr=i%2?r*.45:r,a=i/10*Math.PI*2-Math.PI/2;i?c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):c.moveTo(Math.cos(a)*rr,Math.sin(a)*rr)}c.closePath();c.fill();c.restore()}

/* ---------- Statistiques (calculées uniquement à partir des fléchettes saisies) ---------- */
function gameHistory(){return store.get('history',[]).filter(g=>g&&g.players&&g.darts)}
function playerIndex(g,p){let i=g.players.findIndex(x=>x.id===p.id);if(i<0)i=g.players.findIndex(x=>x.name.trim().toLowerCase()===p.name.trim().toLowerCase());return i}
function statsOf(p){
  const st={games:0,wins:0,ties:0,x01:{darts:0,pts:0,best:0,c180:0,c140:0,c100:0,co:0,dAtt:0,dHit:0},cricket:{darts:0,marks:0},byType:{},evo:[],recent:[]};
  for(const g of gameHistory().slice().reverse()){
    const i=playerIndex(g,p);if(i<0)continue;const m=GAMES[g.type||'x01'];if(!m)continue;let S;try{S=m.run(g)}catch(e){continue}
    st.games++;const won=S.winner===i,tie=!!(S.tie&&S.tie.includes(i));if(won)st.wins++;if(tie)st.ties++;
    const bt=st.byType[m.name]||(st.byType[m.name]={games:0,wins:0});bt.games++;if(won)bt.wins++;
    st.recent.push({g,won,tie,i});
    const ts=S.turns.filter(t=>t.p===i);
    if((g.type||'x01')==='x01'){let d=0,pts=0;
      for(const t of ts){d+=t.darts.length;pts+=t.total;st.x01.best=Math.max(st.x01.best,t.total);
        if(t.total===180)st.x01.c180++;else if(t.total>=140)st.x01.c140++;else if(t.total>=100)st.x01.c100++;
        if(t.checkout)st.x01.co=Math.max(st.x01.co,t.total);
        if(g.outRule==='double'){let rem=t.startRem;for(const dd of t.darts){if(rem===50||(rem<=40&&rem%2===0&&rem>0))st.x01.dAtt++;if(dd.mult===2&&dd.pts===rem)st.x01.dHit++;rem-=dd.pts}}}
      st.x01.darts+=d;st.x01.pts+=pts;if(d)st.evo.push({t:g.finishedAt||g.created,v:pts/d*3})}
    if(g.type==='cricket'||g.type==='cutthroat'){for(const t of ts){st.cricket.darts+=t.darts.length;st.cricket.marks+=t.total}}
  }
  st.recent.reverse();return st;
}
const fmt1=v=>Number.isFinite(v)?v.toFixed(1):'–';

/* Courbe d'évolution de la moyenne (dessinée à l'échelle) */
function evoChart(pts){
  if(pts.length<2)return '<p class="note">La courbe apparaît après deux parties de 301 à 901.</p>';
  const P=pts.slice(-30),W=320,H=150,L=34,R=8,T=12,B=22;
  const lo=Math.floor(Math.min(...P.map(p=>p.v))/10)*10,hi=Math.ceil(Math.max(...P.map(p=>p.v))/10)*10||10;const span=Math.max(10,hi-lo);
  const x=i=>L+(W-L-R)*i/(P.length-1),y=v=>T+(H-T-B)*(1-(v-lo)/span);
  const ticks=[lo,lo+span/2,lo+span];
  const line=P.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join('');
  const area=line+`L${x(P.length-1).toFixed(1)} ${H-B}L${L} ${H-B}Z`;
  return `<svg class="evo" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de la moyenne sur ${P.length} parties">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" class="lab">${Math.round(v)}</text>`).join('')}
    <path d="${area}" class="area"/><path d="${line}" class="ln"/>
    ${P.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===P.length-1?4:2.4}" class="${i===P.length-1?'last':'pt'}"/>`).join('')}
    <text x="${L}" y="${H-6}" class="lab">1<tspan dx="2">re partie</tspan></text><text x="${W-R}" y="${H-6}" text-anchor="end" class="lab">dernière</text></svg>`;
}

/* Élimination directe : tableau complet, exemptés qualifiés d'office */
function buildKO(ids){let n=1;while(n<ids.length)n*=2;const seeds=ids.concat(Array(n-ids.length).fill(null));
  const order=[];for(let i=0;i<n/2;i++)order.push([seeds[i],seeds[n-1-i]]);
  const rounds=[];let cur=order.map(([a,b],i)=>({id:uid(),r:0,i,a,b,winner:null}));rounds.push(cur);
  let size=cur.length;let r=1;while(size>1){size/=2;rounds.push([...Array(size)].map((_,i)=>({id:uid(),r,i,a:null,b:null,winner:null})));r++}
  const flat=rounds.flat();koAdvance(flat);return flat}
function koAdvance(ms){let changed=true;while(changed){changed=false;
  for(const m of ms){if(m.winner==null&&m.r===0&&((m.a&&!m.b)||(!m.a&&m.b))){m.winner=m.a||m.b;m.bye=true;changed=true}
    if(m.winner){const nx=ms.find(x=>x.r===m.r+1&&x.i===Math.floor(m.i/2));if(nx){const side=m.i%2?'b':'a';if(nx[side]!==m.winner){nx[side]=m.winner;changed=true}}}}}}
/* Championnat : chacun contre chacun (méthode du cercle), aller-retour en option */
function buildLeague(ids,legs){const a=ids.slice();if(a.length%2)a.push(null);const n=a.length,ms=[];
  for(let r=0;r<n-1;r++){for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x&&y)ms.push({id:uid(),r,a:r%2?y:x,b:r%2?x:y,winner:null})}a.splice(1,0,a.pop())}
  if(legs===2){const back=ms.map(m=>({id:uid(),r:m.r+n-1,a:m.b,b:m.a,winner:null,leg:2}));ms.push(...back)}return ms}
function standings(t){const tab=Object.fromEntries(t.players.map(p=>[p.id,{id:p.id,pl:0,w:0,l:0,d:0,pts:0}]));
  for(const m of t.matches){if(!m.done)continue;const A=tab[m.a],B=tab[m.b];A.pl++;B.pl++;
    if(m.winner===m.a){A.w++;B.l++;A.pts+=2}else if(m.winner===m.b){B.w++;A.l++;B.pts+=2}else{A.d++;B.d++;A.pts++;B.pts++}}
  return Object.values(tab).sort((x,y)=>y.pts-x.pts||y.w-x.w||x.l-y.l)}
function tStatus(t){if(t.format==='ko'){const fin=t.matches.find(m=>m.r===Math.max(...t.matches.map(x=>x.r)));return fin&&fin.winner?{done:true,champ:fin.winner}:{done:false}}
  if(t.matches.every(m=>m.done)){const s=standings(t);return {done:true,champ:s[0].id}}return {done:false}}

/* Voix : la plus naturelle de l'appareil. Si des voix enregistrées (générateur de voix) sont

function voiceQuality(v){let q=0;if(/natural|neural|online|premium|enhanced|am[ée]lior|wavenet|studio/i.test(v.name))q+=4;if(/google/i.test(v.name))q+=1;if(/fr[-_]FR/i.test(v.lang))q+=1;if(!v.localService)q+=1;return q}
const Pack={files:{},ready:false,
  /* voix/manifest.json : { "superstar": ["superstar_big_1", …], … } */
  async load(){try{const r=await fetch('voix/manifest.json',{cache:'no-cache'});if(!r.ok)return;const j=await r.json();
    for(const [amb,ids] of Object.entries(j))this.files[amb]=new Set(ids);this.ready=true}catch(e){}},
  has(amb){return this.ready&&this.files[amb]&&this.files[amb].size>0},
  play(id,cb){try{const a=new Audio('voix/'+id+'.mp3');a.volume=prefs.volume;a.onplaying=()=>cb&&cb(true);a.onerror=()=>cb&&cb(false);a.play().catch(()=>cb&&cb(false));return true}catch(e){cb&&cb(false);return false}}
};

const Voice={ok:'speechSynthesis' in window,list:[],
  load(){if(!this.ok)return;try{this.list=speechSynthesis.getVoices().filter(v=>/^fr([-_]|$)/i.test(v.lang)).sort((a,b)=>voiceQuality(b)-voiceQuality(a))}catch(e){this.list=[]}},
  pick(){if(!this.list.length)this.load();const L=this.list;if(!L.length)return null;return (prefs.voiceURI&&L.find(v=>v.voiceURI===prefs.voiceURI))||L[0]},
  /* Parle en français. Si l'appareil ne liste aucune voix, on demande quand même « fr-FR » :
     le téléphone utilise alors sa voix française par défaut. */
  say(text,amb,cb){if(!this.ok||!prefs.voice||prefs.muted){cb&&cb(false);return false}
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=this.pick();
      if(v){u.voice=v;u.lang=v.lang}else u.lang='fr-FR';
      const A=AMBIANCES[amb]||AMBIANCES.standard;u.rate=Math.max(.5,Math.min(2,prefs.rate*A.rate));u.pitch=A.pitch;u.volume=prefs.volume;
      let started=false;u.onstart=()=>{started=true;cb&&cb(true)};u.onerror=()=>{if(!started){cb&&cb(false);cb=null}};
      if(cb)setTimeout(()=>{if(!started&&cb){cb(false);cb=null}},3500);
      setTimeout(()=>{try{speechSynthesis.speak(u);if(speechSynthesis.paused)speechSynthesis.resume()}catch(e){}},speechSynthesis.speaking?120:0);return true}catch(e){cb&&cb(false);return false}},
  /* Réaction : voix enregistrée si disponible, sinon voix de l'appareil */
  react(choice,prefix,amb){if(!prefs.voice||prefs.muted)return;
    if(choice.id&&Pack.has(amb)&&Pack.files[amb].has(choice.id)){Pack.play(choice.id,ok=>{if(!ok)this.say(prefix+choice.text,amb)});return}
    this.say(prefix+choice.text,amb)},
  warm(){if(!this.ok)return;try{const u=new SpeechSynthesisUtterance(' ');u.lang='fr-FR';u.volume=0;speechSynthesis.speak(u)}catch(e){}},
  tested:null,
  natural(){return this.list.some(v=>voiceQuality(v)>=4)},
  status(){
    if(Pack.ready)return {warn:false,txt:'Voix enregistrées installées : elles sont utilisées pour les réactions. Voix : elevenlabs.io'};
    if(!this.ok)return {warn:true,txt:'Ce navigateur ne propose pas de synthèse vocale. Les réactions s\'affichent à l\'écran.'};
    if(!this.list.length)this.load();
    if(this.tested===false)return {warn:true,txt:'La voix n\'a pas pu démarrer sur cet appareil. Les réactions s\'affichent à l\'écran.'};
    if(this.list.length){const v=this.pick();return {warn:!this.natural(),txt:`Voix utilisée : ${v.name}.`+(this.natural()?' C\'est une voix naturelle.':' Pas de voix « naturelle » sur cet appareil : voir l\'aide ci-dessous.')+(this.tested?' Test réussi.':'')}}
    if(this.tested)return {warn:false,txt:'La voix du téléphone fonctionne. Test réussi.'};
    return {warn:false,txt:'Le téléphone utilisera sa voix française par défaut. Touchez « Tester la voix » pour vérifier.'};
  },
  runTest(){this.tested=null;updateVoiceBox();this.say('Bonjour, je suis la voix d\'ARROW.','standard',ok=>{this.tested=ok;updateVoiceBox()})}

const recentPick={};
/* Choisit une phrase sans répéter les dernières. Avec des voix enregistrées, on évite les phrases
   qui contiennent le prénom ou le score (elles ne peuvent pas être enregistrées à l'avance). */
function choosePhrase(amb,cat,vars){
  const A=AMBIANCES[amb]||AMBIANCES.standard,list=A[cat]||A.mid,key=amb+cat;
  let pool=list.map((_,i)=>i);if(Pack.has(amb)){const np=pool.filter(i=>!/\{[nr]\}/.test(list[i]));if(np.length)pool=np}
  const used=recentPick[key]||[],free=pool.filter(i=>!used.includes(i));const from=free.length?free:pool;
  const i=from[Math.floor(Math.random()*from.length)];
  recentPick[key]=[...used,i].slice(-Math.floor(pool.length/2));
  return {text:list[i].replace(/\{n\}/g,vars.n).replace(/\{r\}/g,vars.r),id:`${amb}_${cat}_${i+1}`};
}
function pickPhrase(amb,cat,vars){return choosePhrase(amb,cat,vars).text}
