<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="ARROW by Elmagination : application de fléchettes entre amis.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARROW">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ARROW</title>
<meta name="theme-color" content="#0f1b2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout : barre fixe en haut, contenu défilant au milieu, barre de marque en bas. Jeu : cible au centre (téléphone), cible à gauche + panneau à droite (tablette/ordinateur). */
:root{
  /* Identité Elmagination : Deep Navy, Titanium Grey, Warm Bronze, champagne (Envy) */
  --bg:#0f1b2e; --bg-deep:#0a1322; --surface:#13233b; --surface-2:#1a2d4a; --surface-3:#22385a; --bar:#0c1627;
  --line:rgba(184,194,204,.13); --line-2:rgba(184,194,204,.26);
  --silver:#eef1f5; --silver-2:#b8c2cc; --muted:#7c8a9d;
  --copper:#d9a47e; --copper-hi:#f3dec2; --copper-lo:#9c5d34; --on-copper:#2a1408; --champagne:#f3dec2;
  --danger:#e9867b; --ok:#93d6b0;
  --ff-ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ff-num:'Jost','Futura','Avenir Next',system-ui,sans-serif;
  --ff-mark:'Jost','Futura','Avenir Next',system-ui,sans-serif;
  --r-md:14px; --r-lg:20px;
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(900px 520px at 50% 0%,var(--surface-2) 0%,transparent 70%);color:var(--silver);font-family:var(--ff-ui);font-size:15px;line-height:1.45;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--copper-hi);outline-offset:2px}
button:disabled{cursor:default}
input,select{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}

/* ---------- Barres fixes ---------- */
.appbar{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:58px;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:6px;background:var(--bar);border-bottom:1px solid var(--line);position:relative;z-index:20}
.bar-btn{display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 12px 0 10px;border-radius:12px;border:1px solid var(--line);color:var(--silver-2);font-weight:700;font-size:14px;justify-self:start}
.bar-btn svg{width:19px;height:19px;flex:none}
.bar-btn:hover{color:var(--silver);border-color:var(--line-2)}
.bar-btn[aria-current="page"]{color:var(--copper-hi);border-color:rgba(217,164,126,.45)}
.bar-btn.right{justify-self:end}
.bar-btn.quit{color:#ffc7bf;border-color:rgba(233,134,123,.35)}
.bar-title{text-align:center;font-family:var(--ff-mark);font-weight:500;font-size:16px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:52vw}
.bar-title .wm{font-weight:400;font-size:17px;letter-spacing:.34em;margin-right:-.34em}
.bar-title small{font-family:var(--ff-ui);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--copper-hi);margin-left:8px}
.view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-left:var(--gut-l);padding-right:var(--gut-r);position:relative}
.view.fixed{overflow:hidden}
.brandbar{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:6px;background:var(--bar);border-top:1px solid var(--line)}
.brandbar svg{width:22px;height:22px;flex:none}
.brand-name{font-family:var(--ff-mark);font-weight:500;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--silver-2)}

/* ---------- Logo et lancement ---------- */
.logo-svg{display:block;width:100%;height:auto;overflow:visible}
.logo-svg .crack{opacity:.75}
.logo-svg.anim .fly{animation:fly .5s cubic-bezier(.18,.9,.3,1.12) both}
.logo-svg.anim .f1{animation-delay:.45s}
.logo-svg.anim .f2{animation-delay:.95s}
.logo-svg.anim .crack{opacity:0;animation:crack .25s ease-out forwards}
.logo-svg.anim .c1{animation-delay:.9s}
.logo-svg.anim .c2{animation-delay:1.4s}
.logo-svg.anim .lg-body{animation:thud .22s ease-out .9s,thud2 .22s ease-out 1.4s}
.logo-svg.anim .star{transform-box:view-box;transform-origin:150px 40px;animation:star .7s cubic-bezier(.2,1.4,.4,1) 1.65s both,twinkle 2.6s ease-in-out 2.4s infinite}
@keyframes fly{0%{transform:translateX(460px);opacity:0}12%{opacity:1}100%{transform:translateX(0);opacity:1}}
@keyframes crack{to{opacity:.75}}
@keyframes thud{40%{transform:translate(-2px,2px)}75%{transform:translate(1px,-1px)}}
@keyframes thud2{40%{transform:translate(-2px,1.5px)}75%{transform:translate(1px,-1px)}}
@keyframes star{0%{transform:scale(0) rotate(-90deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes twinkle{50%{transform:scale(.88) rotate(8deg);opacity:.85}}
.splash{position:fixed;inset:0;z-index:200;background:var(--bg);background-image:radial-gradient(700px 500px at 50% 40%,var(--surface-2),transparent 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;transition:opacity .45s ease}
.splash.out{opacity:0;pointer-events:none}
.splash .logo-wrap{width:min(320px,68vw)}
.splash .mark{font-size:clamp(40px,12vw,60px);opacity:0;animation:rise .6s ease-out 1.7s forwards}
.splash .byline{opacity:0;animation:rise .6s ease-out 1.95s forwards}
.splash .skip{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);letter-spacing:.06em}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mark{font-family:var(--ff-mark);font-weight:300;letter-spacing:.32em;margin-right:-.32em;line-height:1.05;background:linear-gradient(180deg,#ffffff 0%,#d6dce3 50%,#9aa5b1 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.byline{font-size:15px;letter-spacing:.02em;color:var(--silver-2)}
.hero{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.hero .logo-wrap{width:min(190px,52vw)}
.hero .mark{font-size:clamp(36px,10vw,50px)}

/* ---------- Mise en page des écrans défilants ---------- */
.col{max-width:560px;margin:0 auto;padding-block:20px 28px;display:flex;flex-direction:column;gap:22px}

/* ---------- Boutons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 20px;border-radius:var(--r-md);font-weight:700;font-size:16px;letter-spacing:.01em;transition:transform .08s ease,filter .15s;text-align:center}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,#f0c7b3 0%,#d9a47e 45%,#a86a55 100%);color:var(--on-copper);box-shadow:0 8px 24px -10px rgba(217,164,126,.6),inset 0 1px 0 rgba(255,255,255,.45)}
.btn-silver{background:linear-gradient(180deg,#f2f4f7 0%,#c4ccd5 55%,#9aa4af 100%);color:#16202e;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 18px -10px rgba(0,0,0,.6)}
.btn-ghost{border:1px solid var(--line-2);background:rgba(255,255,255,.02)}
.btn-ghost:hover{background:rgba(255,255,255,.05)}
.btn-danger{border:1px solid rgba(233,134,123,.45);color:#ffc7bf}
.btn[disabled]{opacity:.42}
.btn svg{width:18px;height:18px;flex:none}
.btn small{font-weight:600;font-size:12px;color:inherit;opacity:.7}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);color:var(--silver-2);flex:none}
.icon-btn:hover{color:var(--silver);border-color:var(--line-2)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.sm{width:36px;height:36px;border-radius:10px}
.icon-btn.sm svg{width:17px;height:17px}

/* ---------- Cartes / sections ---------- */
.sec-title{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--silver-2);font-weight:700;margin:0 0 10px}
.card{background:linear-gradient(180deg,var(--surface) 0%,rgba(19,35,59,.6) 100%);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.code-list{margin-top:12px;display:grid;gap:8px}
.code-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-md);background:var(--bg-deep);border:1px solid var(--line)}
.code-row b{display:block;font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em;font-size:14px}
.code-row span{display:block;font-size:12px;color:var(--silver-2)}
.code-row.used{opacity:.6}
.code-row .btn{width:auto;min-height:38px;padding:0 12px;font-size:13px}
a.btn{text-decoration:none}
.home-head h1{margin:4px 0 0;font-family:var(--ff-num);font-weight:500;font-size:26px}
.hcards{display:grid;gap:10px}
.hcard{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;text-align:left}
.hcard .fam-art,.hcard .fam-logo{width:58px;flex:none}
.hcard .fam-logo svg{width:100%;height:auto}
.hc-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.hc-txt b{font-size:17px}
.hc-txt span{font-size:13px;color:var(--silver-2)}
.hc-txt .hc-free{color:var(--copper);font-weight:600;font-size:12px;margin-top:2px}
.hcard>svg:last-child{width:20px;height:20px;flex:none;color:var(--silver-2)}
/* message court (toastMsg) */
.note-toast{position:fixed;left:50%;top:76px;z-index:80;transform:translate(-50%,-8px);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;background:rgba(7,13,26,.9);border:1px solid var(--line-2);border-radius:14px;padding:9px 16px;max-width:min(88vw,420px);text-align:center;font-size:14px;font-weight:600;color:var(--champagne);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.note-toast.show{opacity:1;transform:translate(-50%,0)}
/* barre du haut : bouton son à côté du compte ou de « Quitter » */
.bar-right{justify-self:end;display:flex;align-items:center;gap:8px}
.bar-vol{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);color:var(--silver-2)}
.bar-vol svg{width:20px;height:20px}
.bar-vol[aria-pressed="true"]{color:#ffc7bf;border-color:rgba(233,134,123,.4)}
/* encart doré du score, en haut à droite de la cible ou du terrain */
.sflash{position:absolute;z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:1px;padding:8px 13px 9px;border-radius:14px;
  background:linear-gradient(140deg,#fbeccd 0%,#e9c58f 45%,#b9824f 100%);color:#2a1408;box-shadow:0 10px 26px -8px rgba(0,0,0,.65),0 0 0 1px rgba(255,236,200,.7) inset;
  opacity:0;transform:translateY(-6px) scale(.92);transform-origin:top right;transition:opacity .2s,transform .3s cubic-bezier(.2,1.5,.4,1);pointer-events:none;max-width:62%}
.sflash.show{opacity:1;transform:none}
.sflash .sf-name{font-size:11.5px;font-weight:800;letter-spacing:.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.8}
.sflash .sf-val{font-family:var(--ff-num);font-weight:600;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.sflash .sf-tag{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;opacity:.75}
.sflash.bad{background:linear-gradient(140deg,#f6d9d2,#d98a7c 55%,#a5503f);color:#2b0b05}
.sflash.bad .sf-val{font-size:26px}
/* bouton et ligne « Nous soutenir / Devenir premium » en doré */
.btn-gold{background:linear-gradient(135deg,#fbeccd 0%,#e9c58f 45%,#b9824f 100%);color:#2a1408;box-shadow:0 8px 26px -8px rgba(233,197,143,.75),inset 0 1px 0 rgba(255,255,255,.6)}
.btn-gold svg{width:20px;height:20px}
.row-link.gold{border-color:rgba(233,197,143,.75)!important;background:linear-gradient(135deg,rgba(233,197,143,.22),rgba(185,130,79,.1));box-shadow:0 0 22px -6px rgba(233,197,143,.55)}
.row-link.gold .rl-ico,.row-link.gold b{color:#f3d9a6}
/* écran de partie (autres jeux) : tout tient sur l'écran */
.op{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px}
.op-score{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.op-team{position:relative;display:grid;grid-template-columns:1fr auto;grid-template-areas:"name sc" "sub sc" "bar bar";align-items:center;gap:2px 8px;padding:9px 12px 10px;border-radius:16px;border:1px solid var(--line-2);background:linear-gradient(160deg,var(--surface-2),var(--surface));overflow:hidden}
.op-team::before{content:'';position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,#d58a55,#a8562a)}
.op-team.b::before{background:linear-gradient(90deg,#4a72ad,#23406c)}
.op-team.win{border-color:var(--copper)}
.op-name{grid-area:name;display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.op-name .bagdot{flex:none}
.op-sc{grid-area:sc;font-family:var(--ff-num);font-weight:500;font-size:clamp(34px,10vw,46px);line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.op-sub{grid-area:sub;font-size:12px;color:var(--silver-2);white-space:nowrap}
.op-team .mt-bar{grid-area:bar;margin-top:5px;height:4px}
.op-mk{display:flex;gap:6px;overflow-x:auto;flex:none;padding-bottom:2px;scrollbar-width:none}
.op-mk .mkp{display:flex;align-items:center;gap:8px;padding:7px 11px;flex:none;grid-template-columns:none}
.op-mk .mkp-sc{font-size:22px}
.op-tools{display:flex;align-items:center;gap:8px;min-height:40px;flex:none}
.op-tools .ch-teams{flex:1;min-width:0;flex-wrap:nowrap;overflow-x:auto}
.op-tools .ch-teams .chip{height:36px;white-space:nowrap}
.op-tools .mk-turn,.op-hint{flex:1;min-width:0;margin:0;text-align:left;font-size:13.5px;color:var(--silver-2)}
.op-tools-r{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}
.op-tools .icon-btn{width:40px;height:40px}
.op-stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:auto}
.op-stage .scene.fill{flex:1;min-height:0}
.op-stage .scene.fill canvas{position:absolute;left:0;top:0}
.op-pads{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.op-pads .mk-pins{grid-column:1/-1}
.op-pad{padding:10px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.op-pad .cat-lbl{display:flex;align-items:center;gap:6px;margin:0 0 6px}
.op-pad .ch-row+.ch-row{margin-top:8px}
.op .ch-sum{flex:none;flex-direction:row;flex-wrap:wrap;gap:2px 12px;font-size:12.5px}
.op-actions{display:flex;gap:8px;flex:none}
.op-actions .btn{min-height:50px}
.op-actions .btn-primary{flex:1}
.op-actions .btn-ghost{flex:none;width:56px;padding:0}
/* interrupteur 3D : on le glisse (ou le touche) pour passer à la saisie */
.sw3d{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 10px 0 6px;border-radius:12px;border:1px solid var(--line);font-weight:800;font-size:13px;color:var(--silver-2)}
.sw3d-track{position:relative;width:38px;height:22px;border-radius:11px;background:var(--bg-deep);border:1px solid var(--line-2);transition:background .2s}
.sw3d-track i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--silver-2);transition:transform .2s,background .2s}
.sw3d[aria-checked="true"]{color:var(--copper-hi)}
.sw3d[aria-checked="true"] .sw3d-track{background:linear-gradient(135deg,#d9a47e,#9c5d34);border-color:transparent}
.sw3d[aria-checked="true"] .sw3d-track i{transform:translateX(16px);background:#fff}
/* réglages : catégories repliables */
.set-grp>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;min-height:44px;margin:-4px 0}
.set-grp>summary::-webkit-details-marker{display:none}
.set-grp>summary .sec-title{margin:0}
.sg-chev{display:grid;place-items:center;color:var(--silver-2);transition:transform .2s}
.sg-chev svg{width:20px;height:20px}
.set-grp[open] .sg-chev{transform:rotate(90deg)}
.set-grp .sg-body{margin-top:12px}
.set-grp .sg-body>section.card{padding:0;border:0;background:none;box-shadow:none}
.set-grp h3.cat-lbl{margin:18px 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.set-grp .sg-body>h3.cat-lbl:first-child,.set-grp .sg-body>p:first-child+h3.cat-lbl{margin-top:4px}
.skin.locked{opacity:.55;position:relative}
.skin.locked::after{content:'Premium';position:absolute;top:6px;right:6px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:linear-gradient(135deg,#fbeccd,#b9824f);color:#2a1408}
.resume .big .fam-art{width:52px;height:auto;color:var(--silver-2)}
.row-link.flat{background:none;border:0;padding:10px 0;width:100%}
.row-link.flat+.row-link.flat{border-top:1px solid var(--line)}
textarea.tin{min-height:140px;padding-top:12px;resize:vertical;font:inherit;line-height:1.5}
.resume-row{display:flex;align-items:center;gap:8px}
.resume-row .resume{flex:1;min-width:0}
.resume-row .icon-btn{flex:none;color:#ffc7bf}
.resume{display:flex;align-items:center;gap:14px;text-align:left;width:100%}
.resume .big{font-family:var(--ff-num);font-weight:400;font-size:34px;line-height:1;color:var(--copper-hi)}
.resume .meta{flex:1;min-width:0}
.resume .meta b{display:block}
.resume .meta span{color:var(--silver-2);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume svg{width:20px;height:20px;color:var(--silver-2)}
.roadmap{list-style:none;margin:0;padding:0;display:grid}
.roadmap li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.roadmap li:first-child{border-top:0}
.roadmap .dot{width:10px;height:10px;border-radius:50%;margin-top:5px;border:1.5px solid var(--muted)}
.roadmap .done .dot{background:var(--copper);border-color:var(--copper)}
.roadmap .now .dot{border-color:var(--copper);box-shadow:0 0 0 3px rgba(217,164,126,.2)}
.roadmap span{color:var(--silver-2)}
.stack{display:flex;flex-direction:column;gap:10px}
.note{font-size:13px;color:var(--muted);margin:0}

/* ---------- Préparation ---------- */
.games{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.game-opt{border:1px solid var(--line-2);border-radius:var(--r-md);padding:12px 6px;text-align:center;background:rgba(255,255,255,.02)}
.game-opt b{display:block;font-family:var(--ff-num);font-size:28px;line-height:1.1;font-weight:400}
.game-opt span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.game-opt[aria-pressed="true"]{border-color:var(--copper);background:rgba(217,164,126,.12)}
.game-opt[aria-pressed="true"] b{color:var(--copper-hi)}
.rule-text{margin:12px 0 0;color:var(--silver-2);font-size:14px}
.seg{display:flex;gap:4px;padding:4px;border-radius:var(--r-md);background:var(--bg-deep);border:1px solid var(--line)}
.seg button{flex:1;min-height:42px;border-radius:10px;font-weight:700;font-size:14px;color:var(--silver-2)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--silver);box-shadow:inset 0 0 0 1px var(--line-2)}
.opt-row{display:grid;gap:8px}
.opt-row+.opt-row{margin-top:16px}
.opt-row>label,.opt-row>.lbl{font-weight:700;font-size:14px}
.opt-row p{margin:0;font-size:13px;color:var(--muted)}
.players-list{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:8px}
.prow .ord{width:20px;text-align:center;font-family:var(--ff-num);font-size:17px;color:var(--muted)}
.prow input{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg-deep);padding:0 12px;font-weight:600}
.prow .icon-btn{width:40px;height:48px}
.av{--tone:#9c5d34;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--ff-mark);font-weight:500;font-size:15px;flex:none;color:var(--champagne);text-shadow:0 1px 1px rgba(0,0,0,.3);background:linear-gradient(180deg,rgba(255,255,255,.24) 0%,rgba(255,255,255,.04) 48%,rgba(0,0,0,.1) 100%),linear-gradient(135deg,color-mix(in oklab,var(--tone) 85%,white) 0%,var(--tone) 55%,color-mix(in oklab,var(--tone) 80%,black) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.08),0 3px 10px color-mix(in oklab,var(--tone) 35%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--silver-2)}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2 .btn{flex:1;min-height:46px;font-size:14px}
.soon{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.soon div{padding:10px 12px;border-radius:12px;border:1px dashed var(--line-2);font-size:13px;color:var(--muted)}
.soon div b{color:var(--silver-2);display:block;font-weight:700}

/* ---------- Ambiances et audio ---------- */
.amb-list{display:flex;flex-direction:column;gap:10px}
.amb{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start;text-align:left;width:100%;padding:16px;border-radius:var(--r-lg);border:1px solid var(--line-2);background:rgba(255,255,255,.02)}
.amb[aria-pressed="true"]{border-color:var(--copper);background:linear-gradient(160deg,rgba(217,164,126,.16),rgba(217,164,126,.04))}
.amb-name{font-family:var(--ff-mark);font-weight:500;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.amb[aria-pressed="true"] .amb-name{color:var(--copper-hi)}
.amb-tone{grid-column:1/-1;font-size:13px;color:var(--silver-2);margin-top:-4px}
.amb-ex{grid-column:1/-1;font-family:var(--ff-mark);font-style:italic;font-size:15px;color:var(--silver)}
.amb .listen{font-size:13px;font-weight:700;color:var(--copper-hi);border:1px solid rgba(217,164,126,.45);border-radius:999px;padding:7px 12px;display:inline-flex;gap:6px;align-items:center}
.amb .listen svg{width:15px;height:15px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0;padding-top:0}
.set-row .txt{min-width:0}
.set-row .txt b{display:block;font-size:14px}
.set-row .txt span{display:block;font-size:12.5px;color:var(--muted)}
.switch{width:52px;height:32px;border-radius:16px;padding:3px;display:flex;background:var(--surface-3);flex:none;justify-content:flex-start;transition:background .15s;border:1px solid var(--line-2)}
.switch::after{content:"";width:24px;height:24px;border-radius:12px;background:var(--silver-2);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.switch[aria-pressed="true"]{background:var(--copper);justify-content:flex-end;border-color:var(--copper)}
.switch[aria-pressed="true"]::after{background:#fff}
input[type=range]{width:100%;accent-color:var(--copper);height:28px}
select{width:100%;height:46px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg-deep);padding:0 10px}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);font-weight:800;font-size:18px}
.stepper output{min-width:44px;text-align:center;font-family:var(--ff-num);font-size:20px;font-variant-numeric:tabular-nums}
.voice-status{font-size:13px;color:var(--silver-2);padding:10px 12px;border-radius:12px;background:var(--bg-deep);border:1px solid var(--line)}
.voice-status.warn{color:#ffd6b8;border-color:rgba(217,164,126,.4)}

/* ---------- Écran de jeu ---------- */
.g{height:100%;display:grid;gap:10px;padding-block:10px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"players" "active" "stage" "ctrl"}
.g-side{display:contents}
.g-players{grid-area:players;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.g-players::-webkit-scrollbar{display:none}
.pl{flex:none;min-width:94px;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.pl .av{width:26px;height:26px;font-size:12px}
.pl .nm{font-size:12px;font-weight:700;color:var(--silver-2);max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.pl .rm{font-family:var(--ff-num);font-weight:500;font-size:19px;line-height:1;font-variant-numeric:tabular-nums}
.pl .avg{display:none}
.pl.on{border-color:var(--copper);background:rgba(217,164,126,.1)}
.pl.on .nm{color:var(--copper-hi)}
.act{grid-area:active;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"who who" "score darts" "co co";column-gap:14px;row-gap:4px;align-items:center;padding:10px 14px 10px;border-radius:var(--r-lg);background:linear-gradient(160deg,var(--surface-2) 0%,var(--surface) 100%);border:1px solid var(--line-2);position:relative;overflow:hidden}
.act::after{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,transparent,var(--copper),transparent);opacity:.7}
.act-who{grid-area:who;display:flex;align-items:center;gap:8px;min-width:0}
.act-who .av{width:28px;height:28px;font-size:12px}
.act-name{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.act-turn{font-size:12px;color:var(--silver-2);white-space:nowrap}
.act-score{grid-area:score;font-family:var(--ff-num);font-weight:500;font-size:clamp(56px,17vw,96px);line-height:.95;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 2px 24px rgba(160,190,240,.18)}
.act-darts{grid-area:darts;display:flex;flex-direction:column;gap:6px;min-width:0}
.slots{display:grid;grid-template-columns:repeat(3,1fr) 1.1fr;gap:5px}
.slot{height:40px;border-radius:10px;border:1px dashed var(--line-2);display:grid;place-items:center;font-family:var(--ff-num);font-weight:500;font-size:18px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot.fill{border-style:solid;background:var(--bg-deep);color:var(--silver)}
.slot.next{border-color:var(--copper);color:var(--copper)}
.slot.tot{border:0;background:rgba(217,164,126,.14);color:var(--copper-hi)}
.prev{font-size:12px;color:var(--silver-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev b{color:var(--silver)}
.act-co{grid-area:co;font-size:13px;color:var(--silver-2);min-height:18px}
.act-co b{color:var(--copper-hi);font-weight:800}
.stage{grid-area:stage;position:relative;container-type:size;min-height:0}
.board{position:absolute;inset:0;margin:auto;width:min(100cqw,100cqh);height:min(100cqw,100cqh);touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.board canvas,.board svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.board canvas{border-radius:50%;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
.board svg{pointer-events:none;overflow:visible}
.board .ph{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#2a2622 0 74%,#121212 75%);display:grid;place-items:center;color:var(--silver-2);font-size:13px}
.pad{position:absolute;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:8px;max-width:620px;margin:0 auto}
.pad-nums{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:minmax(0,1fr);gap:6px}
.pad button{border-radius:12px;background:var(--surface);border:1px solid var(--line);font-family:var(--ff-num);font-weight:500;font-size:clamp(19px,4.6vw,26px);min-height:38px;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--surface-3)}
.pad-nums button[aria-pressed="true"]{background:var(--copper);color:var(--on-copper);border-color:var(--copper)}
.pad-mult,.pad-bull{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad-mult button{min-height:52px;font-family:var(--ff-ui);font-size:15px;font-weight:800}
.pad-mult button span{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.pad-mult button:not(:disabled){border-color:rgba(217,164,126,.55)}
.pad-mult button:disabled{opacity:.4}
.pad-bull button{min-height:48px;font-family:var(--ff-ui);font-size:15px;font-weight:800}
.pad-bull .b25{color:#7fd3a0}
.pad-bull .b50{color:#ff8f86}
.g-ctrl{grid-area:ctrl;display:flex;gap:8px;align-items:stretch}
.g-ctrl .seg{flex:1.4}
.g-ctrl .seg button{min-height:48px}
.g-ctrl .btn{min-height:54px;flex:1;padding:0 12px;font-size:15px}
.heart{color:var(--copper);font-size:.62em;margin-left:.12em;vertical-align:.12em;font-family:var(--ff-ui)}
.btn-val{flex-direction:column;gap:0;line-height:1.1}
.btn-val small{font-family:var(--ff-num);font-size:13px;opacity:.8}
.btn-val:not(.ready){filter:saturate(.6) brightness(.9)}
.btn-val.ready{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(217,164,126,.25),0 8px 24px -10px rgba(217,164,126,.6)}}
.g-ctrl.four .seg{flex:1.2}.g-ctrl.four .btn{padding:0 8px}
.btn-miss{border:1px solid var(--line-2);background:rgba(255,255,255,.03)}
.btn-undo{border:1px solid rgba(233,134,123,.35);color:#ffc2ba}
.g-hist{display:none}
.hist-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist-list li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 2px;border-top:1px solid var(--line);font-size:13px}
.hist-list li:first-child{border-top:0}
.hist-list .h-who{min-width:0}
.hist-list .h-who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-list .h-who span{color:var(--muted);font-family:var(--ff-num);font-size:14px}
.hist-list .h-tot{font-family:var(--ff-num);font-weight:500;font-size:20px;font-variant-numeric:tabular-nums}
.hist-list .h-rem{font-family:var(--ff-num);font-size:16px;color:var(--silver-2);width:44px;text-align:right;font-variant-numeric:tabular-nums}
.hist-list .bust .h-tot{color:var(--danger);font-size:15px;letter-spacing:.08em}
.hist-list .co .h-tot{color:var(--copper-hi)}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.sheet-bg{position:fixed;inset:0;background:rgba(3,7,15,.62);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:80%;overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-bottom:0;border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-family:var(--ff-mark);font-weight:500;font-size:20px;flex:1}
.sheet p{margin:0;color:var(--silver-2)}
.sheet-head{display:flex;align-items:center;gap:12px}
.loupe{position:fixed;width:136px;height:136px;border-radius:50%;pointer-events:none;z-index:60;box-shadow:0 0 0 2px var(--copper),0 12px 30px rgba(0,0,0,.6);background:#111}
.loupe-lbl{position:fixed;z-index:61;pointer-events:none;transform:translateX(-50%);background:var(--bg-deep);border:1px solid var(--copper);color:var(--copper-hi);font-weight:800;font-size:13px;padding:4px 10px;border-radius:999px;white-space:nowrap}

/* ---------- Fin de partie ---------- */
.win{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.win .crown{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--copper)}
.win h1{margin:0;font-family:var(--ff-mark);font-size:clamp(30px,8vw,42px);font-weight:500;line-height:1.1;text-wrap:balance}
.win p{margin:0;color:var(--silver-2)}
.stats-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg)}
table.stats{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
.stats th,.stats td{padding:10px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.stats thead th{border-top:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stats th:first-child,.stats td:first-child{text-align:left}
.stats td{font-family:var(--ff-num);font-size:17px;font-variant-numeric:tabular-nums}
.stats td:first-child{font-family:var(--ff-ui);font-size:14px;font-weight:700}
.stats tr.w td:first-child{color:var(--copper-hi)}


/* ---------- Catalogue des jeux ---------- */
.cat-lbl{margin:14px 0 8px;font-size:12px;font-weight:700;color:var(--muted)}
.cat-lbl:first-of-type{margin-top:0}
.catalog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gcard{text-align:left;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line-2);background:rgba(255,255,255,.02);display:flex;flex-direction:column;gap:2px;min-width:0}
.gcard b{font-family:var(--ff-mark);font-weight:500;font-size:16px;line-height:1.2}
.gcard span{font-size:12px;color:var(--muted);line-height:1.3}
.gcard[aria-pressed="true"]{border-color:var(--copper);background:rgba(217,164,126,.12)}
.gcard[aria-pressed="true"] b{color:var(--copper-hi)}
/* ---------- Cricket ---------- */
.crow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cm{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 0 2px;border-radius:8px;background:var(--bg-deep);border:1px solid var(--line);color:var(--silver)}
.cm i{font-style:normal;font-family:var(--ff-num);font-size:13px;color:var(--silver-2);line-height:1.1}
.cm svg{width:18px;height:18px}
.cm.m3{color:var(--copper-hi);border-color:rgba(217,164,126,.45)}
.cm.dead{opacity:.45}
.ctab-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.ctab{border-collapse:collapse;width:100%;font-size:13px}
.ctab th,.ctab td{padding:6px 8px;text-align:center;border-top:1px solid var(--line);white-space:nowrap}
.ctab thead th{border-top:0;font-size:12px;color:var(--silver-2);max-width:90px;overflow:hidden;text-overflow:ellipsis}
.ctab tbody th{text-align:left;font-family:var(--ff-num);font-weight:500;font-size:15px;color:var(--silver-2)}
.ctab td svg{width:20px;height:20px;display:block;margin:0 auto}
.ctab td.m3{color:var(--copper-hi)}
.ctab tr.pts td{font-family:var(--ff-num);font-size:18px;color:#fff}
.g-table{display:none;padding:12px 14px}
.pad-nums button.tgt{border-color:var(--copper-hi);box-shadow:inset 0 0 0 1px var(--copper-hi);color:var(--copper-hi)}
/* ---------- Ambiance par joueur ---------- */
.amb{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
.amb-players{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pchip[aria-pressed="true"]{background:var(--copper);border-color:var(--copper);color:var(--on-copper)}
/* ---------- Cibles ---------- */
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.skin{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;border-radius:var(--r-md);border:1px solid var(--line-2);background:rgba(255,255,255,.02);text-align:center}
.skin canvas{width:84px;height:84px;border-radius:50%;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.skin b{font-family:var(--ff-mark);font-weight:500;font-size:15px}
.skin span{font-size:11.5px;color:var(--muted);line-height:1.25}
.skin[aria-pressed="true"]{border-color:var(--copper);background:rgba(217,164,126,.12)}
.skin[aria-pressed="true"] b{color:var(--copper-hi)}
/* ---------- Animations de la cible ---------- */
.fxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.stage{perspective:1100px}
.decor-layer{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;border-radius:16px}
.board{z-index:1;transform-style:preserve-3d}
.stage .pad{z-index:2}
.board.fx-spin{animation:fx3spin 1.4s cubic-bezier(.35,.05,.25,1)}
.board.fx-flip{animation:fx3flip 1.9s cubic-bezier(.3,.1,.2,1)}
.board.fx-lean{animation:fx3lean 1.3s cubic-bezier(.3,.1,.2,1)}
.board.fx-tilt{animation:fx3tilt 1.1s cubic-bezier(.3,.1,.2,1)}
.board.fx-sway{animation:fx3sway 1.2s ease-in-out}
.board.fx-back{animation:fx3back 2.5s cubic-bezier(.4,0,.2,1)}
.board.fx-shrug{animation:fx3shrug 1.5s ease-in-out}
.board.fx-shake{animation:fx3shake .9s linear}
@keyframes fx3spin{0%{transform:rotateY(0)}45%{transform:rotateY(200deg) scale(.9)}100%{transform:rotateY(360deg)}}
@keyframes fx3flip{0%{transform:none}30%{transform:rotateX(18deg) rotateY(-28deg) scale(1.06);filter:drop-shadow(0 0 30px rgba(255,214,150,.55))}65%{transform:rotateX(-6deg) rotateY(14deg) scale(1.03)}100%{transform:none}}
@keyframes fx3lean{30%{transform:rotateX(18deg) translateZ(40px);filter:drop-shadow(0 0 26px rgba(243,222,194,.55))}70%{transform:rotateX(4deg) translateZ(10px)}}
@keyframes fx3tilt{35%{transform:rotateY(-16deg) rotateX(7deg) translateZ(20px)}}
@keyframes fx3sway{30%{transform:rotateY(9deg)}65%{transform:rotateY(-6deg)}}
@keyframes fx3back{22%,72%{transform:rotateX(32deg) translateY(16px) scale(.94);filter:brightness(.7) saturate(.7)}}
@keyframes fx3shrug{18%{transform:rotateY(-20deg) rotateZ(-3deg)}42%{transform:rotateY(18deg) rotateZ(3deg)}66%{transform:rotateY(-8deg)}}
@keyframes fx3shake{10%,50%,90%{transform:translateX(-7px) rotateY(-10deg) rotateZ(-2deg);filter:drop-shadow(0 0 22px rgba(233,96,86,.6))}30%,70%{transform:translateX(7px) rotateY(10deg) rotateZ(2deg)}100%{transform:none}}
.skin.decor canvas{width:100%;max-width:150px;height:auto;aspect-ratio:3/2;border-radius:10px;box-shadow:none}
.dk.out{opacity:.9}
/* ---------- Personnages vocaux ---------- */
/* ---------- Aide voix ---------- */
.voice-help{margin-top:10px;font-size:13px;color:var(--silver-2)}
.voice-help summary{cursor:pointer;font-weight:700;color:var(--copper-hi);padding:6px 0}
.voice-help ol{margin:6px 0 0;padding-left:20px;display:grid;gap:6px}

/* ---------- Joueurs, stats, tournois ---------- */
.addp{display:flex;gap:8px}
.addp input,.tin{flex:1;min-width:0;height:50px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg-deep);padding:0 12px;font-weight:600;width:100%}
.addp .btn{min-height:50px;padding:0 16px}
.plist,.hlist,.mlist{display:flex;flex-direction:column;gap:6px}
.prow-card{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:rgba(255,255,255,.02)}
.prow-card>.av,.prow-card>.t-ico{grid-row:1/3}
.prow-card>svg{grid-row:1/3;grid-column:3;width:18px;height:18px;color:var(--muted)}
.pc-name{font-weight:800;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-sub{font-size:12.5px;color:var(--muted);min-width:0}
.t-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(217,164,126,.14);color:var(--copper-hi);font-family:var(--ff-mark);font-size:18px}
.av.ph{background-size:cover;background-position:center}
.av.xl{width:84px;height:84px;font-size:34px}
.lnk{color:var(--copper-hi);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:2px 0;text-align:left}
.prof-head{display:flex;gap:16px;align-items:center}
.ph-pick{position:relative;cursor:pointer;flex:none}
.ph-edit{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-size:10.5px;font-weight:800;background:var(--bg-deep);border:1px solid var(--line-2);border-radius:999px;padding:2px 8px;color:var(--silver-2)}
.ph-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.ph-main input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg-deep);padding:0 12px;font-family:var(--ff-mark);font-size:18px;font-weight:500}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:28px;height:28px;border-radius:50%;background:var(--tone);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.sw[aria-pressed="true"]{outline:2px solid var(--copper-hi);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tile{padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:rgba(255,255,255,.02);display:flex;flex-direction:column;gap:2px}
.tile span{font-size:12px;color:var(--muted)}
.tile b{font-family:var(--ff-num);font-weight:500;font-size:26px;font-variant-numeric:tabular-nums}
.tile b small{font-size:13px;color:var(--copper-hi)}
.evo{width:100%;height:auto;display:block}
.evo .grid{stroke:var(--line);stroke-width:1}
.evo .lab{fill:var(--muted);font-size:10px;font-family:var(--ff-ui)}
.evo .area{fill:rgba(217,164,126,.12)}
.evo .ln{fill:none;stroke:var(--copper);stroke-width:2.2;stroke-linejoin:round}
.evo .pt{fill:var(--copper)}
.evo .last{fill:var(--copper-hi);stroke:var(--bg);stroke-width:2}
.hrow{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02);font-size:13.5px}
.hr-date{font-size:12px;color:var(--muted)}
.hr-main{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--silver-2)}
.hr-main b{color:var(--silver);font-family:var(--ff-mark);font-weight:500}
.hr-win{font-weight:700;font-size:13px;color:var(--copper-hi);white-space:nowrap}
.tag{font-style:normal;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--silver-2)}
.tag.ok{border-color:rgba(147,214,176,.5);color:var(--ok)}
.mrow{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02);font-size:14px}
.mrow span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .vs{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.mrow.done{opacity:.75}
.mw{color:var(--copper-hi);font-weight:800}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px;border-radius:10px}
.bracket{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.bcol{flex:0 0 150px;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.bcol h3{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bm{display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;font-size:13px}
.bm span{padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm span+span{border-top:1px solid var(--line)}
.bm.done{border-color:rgba(217,164,126,.45)}
/* ---------- Parties en ligne ---------- */
.icon-btn.net{position:relative;width:auto;min-width:36px;padding:0 8px;gap:4px;display:inline-flex;align-items:center}
.icon-btn.net.on{border-color:rgba(147,214,176,.5);color:var(--ok)}
.icon-btn.net span{font-size:12px;font-weight:800}
.icon-btn.net i{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.icon-btn.net i.off{background:var(--danger)}
.room-code{font-family:var(--ff-num);font-size:44px;font-weight:500;letter-spacing:.24em;text-align:center;color:var(--copper-hi);padding:6px 0}
.linkbox{font-size:13px;color:var(--silver-2);background:var(--bg-deep);border:1px solid var(--line);border-radius:12px;padding:10px 12px;overflow-wrap:anywhere;user-select:all}
.members{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.members li{display:flex;align-items:center;gap:8px;font-size:14px}
.members li span:last-child{color:var(--muted);font-size:12.5px}
.code-in{font-family:var(--ff-num);font-size:26px;letter-spacing:.3em;text-transform:uppercase;text-align:center}
.code-in.sm{font-size:18px;letter-spacing:.2em;height:50px}
.code-in::placeholder{letter-spacing:.04em;font-size:14px;font-family:var(--ff-ui)}
.mycode .mc-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.mycode .mc-head b{display:block;font-family:var(--ff-mark);font-weight:500;font-size:20px}
.mycode .room-code{margin-bottom:6px}
.pend{color:var(--copper-hi)}
/* ---------- Autres jeux (pétanque, Mölkky…) ---------- */
.mteams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mteam{border-radius:var(--r-lg);border:1px solid var(--line-2);background:linear-gradient(160deg,var(--surface-2),var(--surface));padding:14px 12px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center;min-width:0}
.mteam.win{border-color:var(--copper);box-shadow:0 0 0 1px var(--copper),0 10px 30px -12px rgba(217,164,126,.6)}
.mt-name{font-family:var(--ff-mark);font-weight:500;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt-mem{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt-score{font-family:var(--ff-num);font-weight:500;font-size:clamp(56px,16vw,88px);line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.mt-bar{display:block;height:5px;border-radius:3px;background:var(--bg-deep);overflow:hidden}
.mt-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--copper-lo),var(--copper-hi));border-radius:3px;transition:width .4s ease}
.mt-pts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.mt-pts button{min-height:48px;border-radius:12px;background:var(--bg-deep);border:1px solid rgba(217,164,126,.45);font-family:var(--ff-num);font-size:22px;color:var(--copper-hi)}
.mt-pts button:active{background:var(--copper);color:var(--on-copper)}
.mteam.pop,.mkp.pop{animation:mpop .7s cubic-bezier(.3,.1,.2,1)}
@keyframes mpop{30%{transform:perspective(600px) rotateX(10deg) scale(1.04);box-shadow:0 0 0 1px var(--copper),0 0 30px rgba(243,222,194,.45)}}
.ch-row{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;text-align:left;flex-wrap:wrap}
.ch-row small{display:block;color:var(--muted);font-size:11px}
.ch-row .stepper button{width:34px;height:34px}
.ch-row .stepper output{min-width:26px;font-size:20px}
.mk-players{display:flex;flex-direction:column;gap:6px}
.mkp{display:grid;grid-template-columns:1fr auto auto;grid-template-rows:auto auto;gap:4px 10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.mkp.on{border-color:var(--copper);background:rgba(217,164,126,.1)}
.mkp.out{opacity:.45}
.mkp.win{border-color:var(--copper);box-shadow:0 0 0 1px var(--copper)}
.mkp .mt-bar{grid-column:1/-1}
.mkp-name{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mkp-sc{font-family:var(--ff-num);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.mkp-miss{display:flex;gap:3px}
.mkp-miss i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.mkp-miss i.x{background:var(--danger);border-color:var(--danger)}
.mk-turn{text-align:center;margin:0;color:var(--silver-2)}
.mk-pins{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0}
.mk-row{display:flex;gap:8px}
.pin{width:clamp(52px,15vw,64px);height:clamp(52px,15vw,64px);border-radius:50%;font-family:var(--ff-num);font-size:22px;font-weight:500;color:#3a2412;
  background:radial-gradient(circle at 40% 35%,#f6e2c2 0%,#d9b788 55%,#a9824f 100%);box-shadow:inset 0 -4px 8px rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.4);transition:transform .12s}
.pin[aria-pressed="true"]{transform:translateY(4px) rotate(-14deg) scale(.92);background:radial-gradient(circle at 40% 35%,#ffd7a8 0%,#d39a73 55%,#8f5638 100%);color:#fff;box-shadow:0 0 0 3px var(--copper-hi),0 2px 6px rgba(0,0,0,.4)}
.ow h1{font-size:clamp(28px,8vw,40px)}
.center{text-align:center}
.team-card{padding:12px}
.seqpick{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.seqpick button{position:relative;min-height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg-deep);font-family:var(--ff-num);font-size:16px}
.seqpick button[aria-pressed="true"]{border-color:var(--copper);color:var(--copper-hi);background:rgba(217,164,126,.14)}
.seqpick i{position:absolute;top:-6px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--copper);color:var(--on-copper);font-style:normal;font-size:10px;font-weight:800;display:grid;place-items:center;font-family:var(--ff-ui);padding:0 3px}
.free-in{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--silver-2)}
.free-in input{width:110px;height:42px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg-deep);padding:0 10px;font-family:var(--ff-num);font-size:18px;text-align:center}
.team-lbl{margin:8px 0 2px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--copper-hi)}
/* ---------- Tablette / ordinateur ---------- */
@media (min-width:860px) and (min-aspect-ratio:1/1){
  .g{grid-template-columns:minmax(0,1fr) minmax(340px,400px);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"stage side" "ctrl side";column-gap:22px}
  .g-side{display:flex;flex-direction:column;gap:12px;grid-area:side;min-height:0;overflow-y:auto}
  .g-side>*{flex:none}
  .g-players{flex-direction:column;overflow:visible;margin:0;padding:0;order:2}
  .act{order:1;grid-template-columns:minmax(0,1fr);grid-template-areas:"who" "score" "darts" "co";row-gap:10px}
  .act-score{font-size:120px}
  .slot{height:46px;font-size:21px}
  .g-hist{display:block;order:4;padding:12px 14px}
  .g-table{display:block;order:3}
  .pl{min-width:0;padding:8px 12px 8px 8px}
  .pl .nm{max-width:none;font-size:14px;flex:1}
  .pl .avg{display:block;color:var(--muted);font-family:var(--ff-num);font-size:14px}
  .pl .rm{font-size:26px}
  .hist-btn{display:none}
  .g-ctrl{max-width:640px;width:100%;justify-self:center}
}
@media (max-width:359px){.bar-btn span{display:none}.bar-btn{padding:0;width:44px;justify-content:center}}
@media (max-height:700px) and (max-width:859px){
  .act{padding:8px 12px}
  .act-score{font-size:52px}
  .slot{height:34px;font-size:17px}
  .g-ctrl .btn,.g-ctrl .seg button{min-height:46px}
  .g{gap:8px;padding-block:8px}
  .brandbar{min-height:34px;padding-block:4px}
  .appbar{min-height:52px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.logo-svg.anim *{animation:none!important;opacity:1!important}.splash *{animation:none!important;opacity:1!important}}

/* =========================================================
   Navigation façon Envy : barre du haut, onglets en bas, bouton central
   ========================================================= */
.appbar{grid-template-columns:auto 1fr auto;min-height:60px;border-bottom:1px solid var(--line);background:rgba(12,22,39,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.appbar .bar-title{max-width:none;text-align:center}
.back-btn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line-2);color:var(--silver)}
.back-btn svg{width:22px;height:22px}
.back-btn:active{transform:scale(.94)}
.brand-btn{display:flex;align-items:center;gap:8px;height:44px;padding-right:6px;color:var(--silver)}
.brand-btn .logo-svg{width:42px;height:auto}
.brand-btn .wm{font-family:var(--ff-mark);font-weight:400;font-size:16px;letter-spacing:.34em}
.acc-btn{position:relative;width:44px;height:44px;border-radius:22px;display:grid;place-items:center;justify-self:end}
.acc-btn .av{width:38px;height:38px;font-size:16px;box-shadow:0 0 0 2px var(--bg),0 0 0 3px rgba(217,164,126,.55)}
.av.ghost{background:var(--surface-2);color:var(--silver-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.av.ghost svg{width:20px;height:20px}
.acc-dot{position:absolute;right:2px;bottom:3px;width:11px;height:11px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--bar)}
.view{scroll-padding-bottom:24px}
.dock~*{}
#view>.col{padding-bottom:40px}
.view.bare{padding-top:env(safe-area-inset-top,0px)}
.dock{flex:none;background:rgba(12,22,39,.96);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 4px) max(8px,env(safe-area-inset-left,0px))}
.tabbar{max-width:560px;margin:0 auto;display:flex;justify-content:space-around;align-items:flex-start}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:58px;min-height:48px;font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--copper-hi)}
.tab.add{min-width:0;width:58px;height:58px;border-radius:29px;margin-top:-24px;background:linear-gradient(135deg,#f0c7b3 0%,#d9a47e 45%,#a86a55 100%);color:var(--on-copper);box-shadow:0 0 0 5px var(--bar),0 10px 24px rgba(217,164,126,.35)}
.tab.add svg{width:26px;height:26px}
.tab.add:active{transform:scale(.95)}
.sig{display:flex;align-items:center;justify-content:center;gap:7px;padding-top:2px;opacity:.75}
.sig svg{width:14px;height:14px}
.sig span{font-family:var(--ff-mark);font-size:9px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--silver-2)}
.eyebrow{display:block;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--copper)}
.center{text-align:center}
.grow{flex:1;min-width:0}
.btn.sm{min-height:40px;padding:0 14px;font-size:13.5px;border-radius:12px;width:auto;flex:none}
.linkbtn{align-self:center;font-weight:700;font-size:14px;color:var(--copper-hi);padding:10px 4px}
.linkbtn.dim{color:var(--muted);font-weight:600}

/* ---------- Accueil ---------- */
.home{gap:18px;padding-top:14px}
.fam-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * var(--gut-l)) calc(-1 * var(--gut-r));padding-inline:var(--gut-l) var(--gut-r);scroll-snap-type:x proximity}
.fam-tabs::-webkit-scrollbar{display:none}
.fam-tab{flex:none;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);font-size:14px;font-weight:600;color:var(--silver-2);white-space:nowrap;scroll-snap-align:center}
.fam-tab[aria-selected="true"]{background:var(--silver);color:#13233b;border-color:var(--silver);font-weight:700}
.fam-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;gap:12px 10px;align-items:center;padding:20px;border-radius:24px;border:1px solid rgba(217,164,126,.3);
  background:radial-gradient(420px 220px at 100% 0%,rgba(217,164,126,.16),transparent 70%),linear-gradient(160deg,var(--surface-2) 0%,var(--surface) 100%);box-shadow:0 18px 40px -24px rgba(0,0,0,.8)}
.fam-hero h1{margin:6px 0 2px;font-family:var(--ff-mark);font-weight:500;font-size:30px;line-height:1.1;letter-spacing:.01em}
.fam-hero p{margin:0;font-size:13.5px;color:var(--silver-2)}
.fam-hero .btn{grid-column:1/-1}
.fam-logo{width:min(120px,30vw)}
.fam-art{width:min(112px,28vw);height:auto;color:var(--silver-2)}
.fam-art .fill{fill:var(--copper);stroke:var(--copper)}
.fam-art .front{fill:var(--surface-2)}
.fam-art .cop{stroke:var(--copper)}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qk{min-height:56px;border-radius:16px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);font-family:var(--ff-mark);font-weight:500;font-size:19px;color:var(--silver)}
.qk:active{transform:scale(.97)}
.qk.all{font-family:var(--ff-ui);font-size:13px;font-weight:700;color:var(--copper-hi);border-style:dashed;border-color:rgba(217,164,126,.5)}
.row-link{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px}
.rl-ico{width:42px;height:42px;border-radius:21px;display:grid;place-items:center;background:rgba(217,164,126,.14);color:var(--copper-hi);flex:none}
.rl-ico svg{width:21px;height:21px}
.rl-txt{flex:1;min-width:0}
.rl-txt b{display:block;font-size:15px}
.rl-txt span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-link>svg{width:20px;height:20px;color:var(--muted);flex:none}
.row-link .av{width:42px;height:42px;font-size:17px}

/* ---------- Préparation : jeu choisi ---------- */
.game-pick{display:flex;flex-direction:column;gap:14px}
.gp-head{display:flex;align-items:flex-start;gap:12px}
.gp-txt{flex:1;min-width:0}
.gp-txt h2{margin:4px 0 2px;font-family:var(--ff-mark);font-weight:500;font-size:24px;line-height:1.15}
.gp-txt .sub{font-size:13px;color:var(--muted)}
details.rules{border-top:1px solid var(--line);padding-top:10px}
details.rules summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--copper-hi);list-style:none;display:flex;align-items:center;gap:6px}
details.rules summary::-webkit-details-marker{display:none}
details.rules summary::after{content:"";width:7px;height:7px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-3px}
details.rules[open] summary::after{transform:rotate(-135deg);margin-top:3px}
details.rules .rule-text{margin-top:8px}

/* ---------- Connexion ---------- */
.auth{position:relative;max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;padding-block:calc(env(safe-area-inset-top,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 22px)}
.auth-x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:0;border-radius:22px}
.auth-hero{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:8px}
.auth-hero .logo-wrap{width:min(150px,36vw)}
.auth-hero .mark{font-size:clamp(34px,10vw,46px)}
.auth-hero .byline{font-size:13px}
.auth-title{margin:6px 0 0;text-align:center;font-family:var(--ff-mark);font-weight:500;font-size:24px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:var(--silver-2);letter-spacing:.02em}
.fld .tin{width:100%;font-size:16px;flex:none;height:52px}
.pw{position:relative;display:block}
.pw .tin{padding-right:86px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);height:38px;padding:0 10px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--copper-hi)}
.form-msg{margin:0;min-height:1em;font-size:13.5px;color:#ffc7bf}
.form-msg:empty{display:none}
.form-msg.ok{color:var(--ok)}
.acc-card .mc-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.acc-card .mc-head .av{width:52px;height:52px;font-size:22px}
.acc-card .mc-head b{display:block;font-family:var(--ff-mark);font-weight:500;font-size:21px}
.acc-card .mail{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.acc-card .lbl,.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sync{margin:0 0 12px;font-size:13.5px;color:var(--silver-2)}
.sync.ok{color:var(--ok)}
.sync.warn{color:#ffd6b8}

/* ---------- Scènes 3D Mölkky / Cornhole ---------- */
.scene{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line-2);box-shadow:0 18px 40px -22px rgba(0,0,0,.9);touch-action:manipulation;background:#13233b}
.scene canvas{display:block;width:100%;cursor:pointer;-webkit-user-select:none;user-select:none}
.scene::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 60px 6px rgba(10,19,34,.55)}
.ch-badge{position:absolute;z-index:1;transform:translate(-50%,-50%);min-width:30px;height:24px;padding:0 7px;border-radius:12px;display:grid;place-items:center;font:700 12.5px/1 Figtree,system-ui,sans-serif;color:#0f1b2e;box-shadow:0 2px 8px rgba(0,0,0,.45);pointer-events:none}
.ch-badge.a{background:linear-gradient(135deg,#d58a55,#a8562a);color:#fff}
.ch-badge.b{background:linear-gradient(135deg,#4a72ad,#23406c);color:#fff}
.scene-hint{position:absolute;z-index:1;left:0;right:0;bottom:8px;text-align:center;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:rgba(243,222,194,.85);text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none}
details.mk-alt{border:1px solid var(--line);border-radius:16px;padding:10px 14px}
details.mk-alt summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--silver-2)}
details.mk-alt[open] summary{margin-bottom:10px}
.ch-teams{display:flex;gap:8px;flex-wrap:wrap}
.ch-teams .chip{display:inline-flex;align-items:center;gap:8px;height:40px}
.ch-teams .chip[aria-pressed="true"]{background:var(--silver);color:#13233b;border-color:var(--silver)}
.bagdot{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;flex:none}
.bagdot.a{background:linear-gradient(135deg,#d58a55,#a8562a)}
.bagdot.b{background:linear-gradient(135deg,#4a72ad,#23406c);box-shadow:0 0 0 1px rgba(184,194,204,.55)}
.ch-sum{margin:0;display:flex;flex-direction:column;gap:2px;font-size:13.5px;color:var(--silver-2)}
.ch-sum b{color:var(--silver)}
.tin{min-height:50px}
.pw-card summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--copper-hi)}
</style>

/* =========================================================
   Géométrie réglementaire de la cible (millimètres, norme WDF)
   ========================================================= */
const SECTORS=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const G={db:6.35,b:15.9,ti:99,to:107,di:162,do:170,num:196,rim:225};

function hitTest(x,y){
  const r=Math.hypot(x,y);
  if(r>G.rim) return {seg:0,mult:0};       // dans le carré, hors de la cible : raté
  if(r<=G.db) return {seg:25,mult:2};
  if(r<=G.b)  return {seg:25,mult:1};
  if(r>G.do)  return {seg:0,mult:0};       // anneau des numéros : raté
  const a=Math.atan2(x,-y)*180/Math.PI;    // 0° en haut, sens horaire
  const idx=Math.floor((((a+9)%360)+360)%360/18);
  const mult=r<G.ti?1:r<=G.to?3:r<G.di?1:2;
  return {seg:SECTORS[idx],mult};
}
function zoneCenter(seg,mult){
  if(!seg) return null;
  if(seg===25) return mult===2?{x:0,y:0}:{x:0,y:-11.1};
  const ang=SECTORS.indexOf(seg)*18*Math.PI/180;
  const r=mult===3?103:mult===2?166:134;
  return {x:r*Math.sin(ang),y:-r*Math.cos(ang)};
}
const dScore=d=>d.seg*d.mult;
function dLabel(d){
  if(!d.seg) return 'Raté';
  if(d.seg===25) return d.mult===2?'Bull':'25';
  return (d.mult===3?'T':d.mult===2?'D':'')+d.seg;
}
function dLong(d){
  if(!d) return 'Annuler (relâcher ici)';
  if(!d.seg) return 'Hors zone · 0';
  if(d.seg===25) return d.mult===2?'Bull (centre) · 50':'Bull extérieur · 25';
  const n=['','Simple','Double','Triple'][d.mult];
  return d.mult===1?`Simple ${d.seg}`:`${n} ${d.seg} · ${dScore(d)}`;
}

function h2(x,y){let n=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)|0;n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967296}

  const a=h2(xi,yi),b=h2(xi+1,yi),c=h2(xi,yi+1),d=h2(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* =========================================================
   Moteur X01 (301 / 501 / 701 / 901)
   L'état est recalculé à partir de la liste des fléchettes :
   annuler = retirer la dernière fléchette, toujours fiable.
   ========================================================= */
function replay(g){
  const n=g.players.length;
  const P=g.players.map(()=>({rem:g.start,open:g.inRule!=='double'}));
  const turns=[];let cur=null,p=0,winner=null;
  for(const d of g.darts){
    if(winner!==null)break;
    if(!cur)cur={p,darts:[],startRem:P[p].rem,startOpen:P[p].open,bust:false,checkout:false};
    const st=P[p];let pts=dScore(d),counted=true;
    if(!st.open){if(d.mult===2)st.open=true;else{pts=0;counted=false}}
    const nr=st.rem-pts;
    const fin=g.outRule==='single'?true:g.outRule==='master'?d.mult>=2:d.mult===2;
    cur.darts.push({...d,pts,counted});
    let end=false;
    if(nr<0||(g.outRule!=='single'&&nr===1)||(nr===0&&!fin)){cur.bust=true;st.rem=cur.startRem;st.open=cur.startOpen;end=true}
    else if(nr===0){st.rem=0;cur.checkout=true;winner=p;end=true}
    else{st.rem=nr;if(cur.darts.length===3)end=true}
    if(end){cur.endRem=st.rem;cur.total=cur.bust?0:cur.startRem-st.rem;turns.push(cur);cur=null;if(winner===null)p=(p+1)%n}
  }
  return {P,turns,cur,p,winner};
}

/* Suggestion de finition */
const THROWS=(()=>{const t=[];for(let n=20;n>=1;n--)t.push({seg:n,mult:3});t.push({seg:25,mult:1});for(let n=20;n>=1;n--)t.push({seg:n,mult:1});for(let n=20;n>=1;n--)t.push({seg:n,mult:2});t.push({seg:25,mult:2});return t})();
const PREF_D=[20,16,18,10,8,12,14,6,4,2,19,17,15,13,11,9,7,5,3,1];
function finishers(out){
  if(out==='single')return THROWS.slice().sort((a,b)=>b.mult===2?1:-1);
  const f=PREF_D.map(n=>({seg:n,mult:2}));f.push({seg:25,mult:2});
  if(out==='master')for(let n=20;n>=1;n--)f.push({seg:n,mult:3});
  return f;
}
function oneThrow(v){ // meilleure fléchette « préparation » pour une valeur
  if(v<=0)return null;if(v<=20)return {seg:v,mult:1};if(v===25)return {seg:25,mult:1};if(v===50)return {seg:25,mult:2};
  if(v%3===0&&v<=60)return {seg:v/3,mult:3};if(v%2===0&&v<=40)return {seg:v/2,mult:2};return null}
function suggest(rem,left,out){
  if(left<1||rem<2&&out!=='single'||rem<1)return null;
  if(rem>(out==='single'?180:170))return null;
  const F=finishers(out);
  for(const f of F)if(dScore(f)===rem)return [f];
  if(left>=2)for(const f of F){const a=oneThrow(rem-dScore(f));if(a)return [a,f]}
  if(left>=3)for(const t of THROWS.slice(0,21)){const r=rem-dScore(t);if(r<2)continue;for(const f of F){const a=oneThrow(r-dScore(f));if(a)return [t,a,f]}}
  return null;
}

/* Statistiques (formules documentées sur l'écran de fin) */
function statsFor(g,r){
  return g.players.map((pl,i)=>{
    const ts=r.turns.filter(t=>t.p===i);
    const darts=ts.reduce((a,t)=>a+t.darts.length,0),pts=ts.reduce((a,t)=>a+t.total,0);
    const f9=ts.slice(0,3),f9d=f9.reduce((a,t)=>a+t.darts.length,0),f9p=f9.reduce((a,t)=>a+t.total,0);
    const co=ts.find(t=>t.checkout);
    return {name:pl.name,darts,points:pts,avg:darts?pts/darts*3:0,first9:f9d?f9p/f9d*3:0,
      best:ts.reduce((a,t)=>Math.max(a,t.total),0),c180:ts.filter(t=>t.total===180).length,
      c140:ts.filter(t=>t.total>=140&&t.total<180).length,c100:ts.filter(t=>t.total>=100&&t.total<140).length,
      busts:ts.filter(t=>t.bust).length,checkout:co?co.total:null,rem:r.P[i].rem};
  });
}

const CR_NUMS=[20,19,18,17,16,15,25];

/* Moteur commun : volées de 3 fléchettes, joueurs à tour de rôle */
function runTurns(g,h){
  const n=g.players.length,S=h.init(g);S.round=g.players.map(()=>0);S.over=false;S.winner=null;
  const turns=[];let cur=null,p=0;
  for(const d of g.darts){
    if(S.over)break;
    if(!cur)cur={p,darts:[],round:S.round[p]+1};
    const res=h.dart(S,p,d,cur)||{};cur.darts.push({...d,...res});
    if(S.over||cur.end||cur.darts.length===3){
      h.endTurn&&h.endTurn(S,p,cur);S.round[p]++;turns.push(cur);cur=null;
      if(!S.over){p=(p+1)%n;let k=0;while(h.skip&&h.skip(S,p)&&k++<n)p=(p+1)%n;h.check&&h.check(S,p)}
    }
  }
  S.turns=turns;S.cur=cur;S.p=p;S.n=n;return S;
}
/* Classement final : meilleur score (ou plus petit si asc), égalité possible */
function rankBy(S,vals,asc,tie){
  const idx=vals.map((_,i)=>i).sort((a,b)=>(asc?vals[a]-vals[b]:vals[b]-vals[a])||(tie?tie(b)-tie(a):0));
  S.over=true;S.ranking=idx;
  const top=idx.filter(i=>vals[i]===vals[idx[0]]&&(!tie||tie(i)===tie(idx[0])));
  S.winner=top.length===1?idx[0]:null;S.tie=top.length>1?top:null;
}

function pointsCat(t,S){

}

const GAMES={
/* ---------------- X01 : 301 / 501 / 701 / 901 ---------------- */
x01:{id:'x01',name:'301 · 501 · 701 · 901',short:'X01',group:'Classiques',sub:'Descendre à zéro, finir au double',
  rules:g=>RULES[g.start||501]||`Même principe que le 501, avec un départ à ${g.start} points. Le premier à tomber exactement à zéro gagne.`,
  opts:[{k:'start',label:'Départ',vals:[[301,'301'],[501,'501'],[701,'701'],[901,'901']],def:501,free:{min:21,max:2001,label:'Autre départ (ex. 170, 1001)'}},
        {k:'outRule',label:'Règle de sortie',vals:[['double','Double'],['single','Simple'],['master','Master']],def:'double',help:v=>OUT_LONG[v]+' Si on dépasse zéro'+(v!=='single'?', qu\'on tombe à 1 ou qu\'on finit sans la bonne zone':'')+', la volée est annulée (« bust »).'},
        {k:'inRule',label:'Règle d\'entrée',vals:[['straight','Directe'],['double','Double In']],def:'straight',help:v=>v==='double'?'Les points ne comptent qu\'à partir du premier double touché.':'Toutes les fléchettes comptent dès la première.'}],
  title:g=>`${g.start}<small>${OUT_LABEL[g.outRule]}${g.inRule==='double'?' · Double In':''}</small>`,
  run(g){const r=replay(g);r.over=r.winner!==null;r.n=g.players.length;
    r.turns.forEach(t=>{if(t.checkout)t.win=true});
    if(r.over)r.ranking=[r.winner,...g.players.map((_,i)=>i).filter(i=>i!==r.winner).sort((a,b)=>r.P[a].rem-r.P[b].rem)];return r},
  big:(S,p)=>S.P[p].rem,chip:(S,i)=>S.P[i].rem,
  chipSub:(S,i,g)=>{const s=statsFor(g,S)[i];return `moy. ${s.avg.toFixed(1)}`},
  hint(S,p,g,cd){const rem=S.P[p].rem;
    if(!S.P[p].open)return 'Double In : touchez un double pour commencer à marquer.';
    const sug=suggest(rem,3-cd.length,g.outRule);
    if(sug)return `Finition possible : <b>${sug.map(dLabel).join(' · ')}</b>`;
    if(rem<=170&&g.outRule!=='single')return `Pas de finition en ${plural(3-cd.length,'fléchette')}`;return ''},
  curTotal:cd=>cd.reduce((a,d)=>a+d.pts,0),
  fmt:t=>t.bust?'BUST':String(t.total),unit:()=>'',
  cat:(t,S)=>t.bust?'bust':pointsCat(t,S),
  say:t=>t.bust||t.total===180||t.win?'':(t.total===0?'Zéro. ':t.total+' ! '),
  resume:(S,p)=>`reste ${S.P[p].rem}`,
  statCols:['Reste','Moy. 3','9 prem.','Meilleure','100+','140+','180','Bust','Fléch.'],
  statRows(S,g){return statsFor(g,S).map(s=>[s.rem,s.avg.toFixed(2),s.first9.toFixed(2),s.best,s.c100,s.c140,s.c180,s.busts,s.darts])},
  statNote:'Moyenne 3 fléchettes = points retirés ÷ fléchettes lancées × 3 (une volée « bust » compte 0 point mais ses fléchettes comptent). « 9 prem. » = même calcul sur les trois premières volées.',
  endLine(S,g){const t=S.turns[S.turns.length-1];return `Finition ${t.total} en ${t.darts.map(dLabel).join(' · ')}`}},

/* ---------------- Cricket et Cut-Throat ---------------- */
cricket:cricketGame(false),

countup:pointsGame('countup','Count Up','Points','Additionner un maximum de points',8,[5,8,10,15,20],
